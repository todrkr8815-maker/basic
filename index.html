<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제갈량 상소문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e11;
    --bg-2: #14161b;
    --card: rgba(255, 255, 255, 0.035);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #e9e6df;
    --muted: #9a968c;
    --faint: #5f5c55;
    --gold: #d4b06a;
    --gold-soft: rgba(212, 176, 106, 0.14);
    --seal: #c0392b;
    --glow-1: rgba(212, 176, 106, 0.10);
    --glow-2: rgba(192, 57, 43, 0.08);
    --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
    --sans: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f1e8;
      --bg-2: #ece6d8;
      --card: rgba(255, 255, 255, 0.6);
      --card-border: rgba(60, 45, 20, 0.12);
      --text: #22201b;
      --muted: #6d675b;
      --faint: #a39c8c;
      --gold: #9a7428;
      --gold-soft: rgba(154, 116, 40, 0.12);
      --seal: #b0301f;
      --glow-1: rgba(154, 116, 40, 0.10);
      --glow-2: rgba(176, 48, 31, 0.06);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 85% -10%, var(--glow-1), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, var(--glow-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .progress {
    position: fixed; inset: 0 0 auto 0; height: 2px; z-index: 50;
    background: linear-gradient(90deg, var(--gold), var(--seal));
    transform-origin: left; transform: scaleX(0);
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 0;
    font-size: 13px; color: var(--muted); letter-spacing: 0.02em;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .seal {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--seal); color: #fff4ea;
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 900; font-size: 15px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
  }
  .close-btn {
    border: 1px solid var(--card-border); background: var(--card);
    color: var(--muted); font: inherit; font-size: 13px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .close-btn:hover { color: var(--text); border-color: var(--gold); }

  /* ---------- Hero ---------- */
  .hero { padding: 56px 0 28px; animation: rise .8s ease both; }
  .eyebrow {
    font-size: 13px; letter-spacing: 0.18em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 14px;
  }
  h1 {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(30px, 5.4vw, 46px); line-height: 1.25;
    margin: 0 0 14px; letter-spacing: -0.01em;
  }
  .greeting { color: var(--muted); font-size: 16px; margin: 0; }

  .maxim {
    margin-top: 36px; padding: 28px 30px;
    border: 1px solid var(--card-border); border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(8px);
    position: relative; overflow: hidden;
    animation: rise .8s .1s ease both;
  }
  .maxim::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(var(--gold), var(--seal));
  }
  .maxim-label { font-size: 12px; letter-spacing: 0.16em; color: var(--muted); }
  .maxim-han {
    font-family: var(--serif); font-size: clamp(20px, 3.4vw, 26px);
    font-weight: 600; margin: 10px 0 6px; letter-spacing: 0.08em;
  }
  .maxim-ko { font-family: var(--serif); font-size: 16px; margin: 0; }
  .maxim-src { font-size: 13px; color: var(--muted); margin-top: 10px; }

  /* ---------- Tabs ---------- */
  .tabs-shell {
    position: sticky; top: 0; z-index: 20;
    padding: 14px 0; margin-top: 28px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 6px; border-radius: 16px;
    background: var(--bg-2); border: 1px solid var(--card-border);
  }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; cursor: pointer; text-align: left;
    padding: 10px 14px; border-radius: 11px;
    display: flex; align-items: center; gap: 12px;
    transition: background .25s, color .25s;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] {
    background: var(--card); color: var(--text);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 6px 20px rgba(0,0,0,0.18);
    outline: 1px solid var(--card-border);
  }
  .tab-num {
    font-family: var(--serif); font-weight: 900; font-size: 20px;
    color: var(--faint); transition: color .25s; flex: none;
  }
  .tab[aria-selected="true"] .tab-num { color: var(--gold); }
  .tab-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .tab-meta { font-size: 12px; color: var(--faint); }

  /* ---------- Article ---------- */
  article { padding: 34px 0 10px; }
  article.enter { animation: rise .5s ease both; }
  .chapter-kicker {
    font-size: 13px; color: var(--gold); letter-spacing: 0.14em; margin-bottom: 8px;
  }
  h2 {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(24px, 4vw, 32px); line-height: 1.35; margin: 0 0 8px;
  }
  .chapter-sub { color: var(--muted); margin: 0 0 34px; font-size: 15px; }
  article p {
    font-family: var(--serif); font-size: 17.5px; line-height: 2;
    margin: 0 0 22px; color: var(--text);
  }
  article p.lead::first-letter {
    font-size: 3.1em; float: left; line-height: 1; margin: 6px 10px 0 0;
    color: var(--gold); font-weight: 700;
  }
  article h3 {
    font-family: var(--sans); font-size: 18px; font-weight: 700;
    margin: 44px 0 14px; display: flex; align-items: baseline; gap: 12px;
  }
  article h3 .n {
    font-family: var(--serif); color: var(--gold); font-size: 14px; font-weight: 600;
    padding: 2px 8px; border-radius: 6px; background: var(--gold-soft);
  }
  .signoff {
    display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    margin: 44px 0 0; color: var(--muted); font-family: var(--serif);
  }
  .signoff .seal { width: 40px; height: 40px; font-size: 20px; transform: rotate(-4deg); }

  .next-chapter {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    margin: 40px 0 0; padding: 18px 22px; border-radius: 14px;
    border: 1px dashed var(--card-border); background: transparent;
    color: var(--muted); font: inherit; width: 100%; cursor: pointer; text-align: left;
    transition: border-color .2s, color .2s;
  }
  .next-chapter:hover { border-color: var(--gold); color: var(--text); }
  .next-chapter strong { color: var(--text); font-weight: 600; }

  /* ---------- Today's stratagem ---------- */
  .today {
    margin: 56px 0 24px; padding: 26px 28px; border-radius: 18px;
    background: linear-gradient(135deg, var(--gold-soft), transparent 70%), var(--card);
    border: 1px solid var(--card-border);
  }
  .today-label { font-size: 12px; letter-spacing: 0.16em; color: var(--gold); }
  .today-row { display: flex; gap: 14px; align-items: flex-start; margin-top: 12px; }
  .check {
    appearance: none; flex: none; width: 24px; height: 24px; margin: 2px 0 0;
    border-radius: 7px; border: 1.5px solid var(--gold); cursor: pointer;
    display: grid; place-items: center; transition: background .2s;
  }
  .check:checked { background: var(--gold); }
  .check:checked::after { content: "✓"; color: var(--bg); font-weight: 800; font-size: 15px; }
  .today-text { font-size: 17px; font-weight: 500; margin: 0; }
  .today.done .today-text { color: var(--muted); text-decoration: line-through; }

  footer {
    padding: 10px 0 60px; font-size: 12.5px; color: var(--faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  kbd {
    font-family: var(--sans); font-size: 11px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--card-border); background: var(--card); color: var(--muted);
  }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .hero { padding-top: 36px; }
    .maxim, .today { padding: 22px 20px; }
    .tab { flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; }
    .tab-meta { display: none; }
    article p { font-size: 16.5px; line-height: 1.95; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="seal">亮</span><span>出師表 · 제갈량 상소문</span></div>
    <button class="close-btn" id="closeBtn" title="Esc">상소를 거두다 ✕</button>
  </div>

  <header class="hero">
    <div class="eyebrow" id="dateLine"></div>
    <h1>주공께 올리는<br>오늘의 상소</h1>
    <p class="greeting" id="greeting"></p>

    <section class="maxim" aria-label="오늘의 한 구절">
      <div class="maxim-label">오늘의 한 구절</div>
      <p class="maxim-han" id="maximHan"></p>
      <p class="maxim-ko" id="maximKo"></p>
      <div class="maxim-src" id="maximSrc"></div>
    </section>
  </header>

  <div class="tabs-shell">
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>

  <main>
    <article id="article" role="tabpanel"></article>

    <section class="today" id="today">
      <div class="today-label">오늘의 계책 · 하나만 행하시옵소서</div>
      <div class="today-row">
        <input type="checkbox" class="check" id="todayCheck" aria-label="오늘의 계책 완료">
        <label class="today-text" for="todayCheck" id="todayText"></label>
      </div>
    </section>
  </main>

  <footer>
    <span>매일 오전 7시, 그리고 주공께서 컴퓨터를 켜실 때마다 올리옵니다.</span>
    <span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 장 넘기기 · <kbd>Esc</kbd> 닫기</span>
  </footer>
</div>

  ================================================================
  상소 본문 — 이 아래 CHAPTERS / MAXIMS / STRATAGEMS 를 고치면
  내용이 바뀝니다. 본문에서 빈 줄은 문단 구분, "## "로 시작하는 줄은

<script>
const CHAPTERS = [
{
  id: "claude",
  num: "壹",
  tab: "클로드 코드",
  kicker: "第一章 · 새 병기를 다루는 법",
  title: "클로드 코드 운용에 관한 상소",
  sub: "처음 병기를 잡으신 주공께 올리는 여덟 가지 계책",
  body: `
신 량이 아뢰옵니다. 주공께서 근래 클로드 코드라는 새 병기를 손에 넣으셨다 들었사옵니다. 이것은 명을 받들어 스스로 글을 짓고, 서책(파일)을 뒤지고, 명령을 실행하는 참모와 같사옵니다. 허나 아무리 뛰어난 참모라도 주공의 뜻을 모르면 헛걸음을 하는 법이옵니다. 처음 병기를 잡으신 주공께 신이 아는 바를 차례로 올리옵니다.

## 뜻을 분명히 하여 명하시옵소서

"좋게 고쳐라"는 명은 장수를 헤매게 하옵니다. 무엇을, 왜, 어떤 모습으로 끝내고 싶으신지를 말씀하시옵소서. "사진 폴더의 파일 이름을 촬영 날짜 순으로 바꾸되, 원본은 건드리지 말라"처럼 목적과 금기와 완성의 모습을 함께 전하시면, 참모는 한 번에 과녁을 맞히옵니다. 말이 길어짐을 두려워 마시옵소서. 짧은 명령보다 넉넉한 설명이 언제나 이기옵니다. 참고할 파일이나 예시가 있다면 함께 내어 주시옵소서.

## 싸우기 전에 먼저 계책을 세우시옵소서

큰일일수록 곧바로 칼을 뽑지 마시옵소서. Shift와 Tab을 함께 눌러 계획 모드로 들어가시면, 참모는 손을 대기 전에 어찌 싸울지를 먼저 아뢰옵니다. 그 계책을 읽어 보시고 마음에 들지 않으면 고치라 하시고, 흡족하실 때 비로소 출병을 명하시옵소서. 계획 모드에서는 참모가 파일을 고치지 않고 살피기만 하니, 마음 놓고 이것저것 물어보셔도 되옵니다. 신이 남만을 칠 때도 먼저 지도를 펼치고 길을 헤아렸사옵니다. 계획 없이 시작한 싸움은 이겨도 뒷수습이 길어지옵니다.

## 군령을 문서로 남기시옵소서

/init 이라 명하시면 참모가 진영을 두루 살피고 CLAUDE.md라는 군령서를 짓사옵니다. 여기에 "답은 한국어로 하라", "사진 원본은 절대 지우지 말라", "나는 초보이니 쉬운 말로 설명하라" 같은 주공의 원칙을 적어 두시옵소서. 참모는 출정할 때마다 이 문서를 먼저 읽으니, 같은 말씀을 거듭하실 수고가 사라지옵니다. 참모가 같은 실수를 두 번 하거든, 그 교훈을 군령서에 한 줄 더하시옵소서.

## 작은 승리를 쌓으시옵소서

한 번에 천하를 얻으려 하면 대개 모두 잃사옵니다. 기능 하나, 화면 하나씩 명하시고, 하나가 이루어질 때마다 눈으로 확인하시옵소서. 그리고 "지금까지를 커밋해 두라"고 명하시어 깃(git)에 진지를 쌓으시옵소서. 커밋은 퇴로와 같아서, 뒤에 일이 틀어져도 언제든 그 자리로 물러날 수 있사옵니다. 퇴로를 확보한 장수만이 과감하게 나아갈 수 있사옵니다.

## 길을 잘못 들면 멈추게 하시옵소서

참모가 엉뚱한 곳으로 달려가면 Esc를 눌러 즉시 멈추게 하시옵소서. Esc를 두 번 누르시면 앞선 명령으로 되돌아가 다시 명하실 수 있사옵니다. 전혀 다른 일을 시작하실 때는 /clear로 군막을 비우시고, 대화가 너무 길어졌다면 /compact로 요점만 남기시옵소서. 머릿속이 어지러운 참모는 판단이 흐려지는 법이옵니다.

## 모르는 것을 부끄러워 마시옵소서

주공께서는 스스로 초보라 하셨으나, 그것이 오히려 큰 무기이옵니다. "방금 한 일을 초보자에게 설명하듯 말해 달라", "이 명령은 무엇을 하는 것이냐"고 서슴없이 물으시옵소서. 참모는 싫증 내지 않고 몇 번이고 답하옵니다. 결과를 그대로 믿지 마시고 "제대로 되었는지 직접 확인해 보라"고 명하시면, 참모는 스스로 시험하고 잘못을 바로잡사옵니다. 화면이 이상하면 갈무리한 그림을 붙여 보여 주시옵소서. 백 마디 설명보다 한 장의 그림이 빠르옵니다.

## 자주 쓰는 명은 병법서로 엮으시옵소서

같은 부탁을 여러 번 하게 되거든, 그것을 스킬이나 슬래시 명령으로 만들어 달라 청하시옵소서. 예컨대 "촬영을 마친 날의 정리 절차"를 한 번 엮어 두시면, 다음부터는 짧은 한마디로 참모가 그 절차를 처음부터 끝까지 행하옵니다. 반복을 줄이는 것이 곧 전력을 늘리는 길이옵니다.

## 권한은 신중히 내리시옵소서

참모가 파일을 지우거나 밖으로 무엇을 보내려 할 때는 반드시 한 번 더 살피시옵소서. 무엇을 하려는지 모르겠거든 허락하기 전에 까닭을 물으시옵소서. 신뢰는 차츰 쌓는 것이지 첫날 모두 내어 주는 것이 아니옵니다. 처음에는 참모가 매번 허락을 구하는 것이 번거로우시겠으나, 그 물음 하나하나가 주공께서 병기의 성질을 배우시는 수업이옵니다. 자주 허락하는 안전한 일만 골라 차츰 풀어 주시옵소서.

신이 바라옵건대, 하루에 한 가지씩만 새로 시험해 보시옵소서. 오늘은 계획 모드, 내일은 군령서, 모레는 커밋. 석 달이 지나면 주공께서는 이 병기를 신보다도 능숙히 다루실 것이옵니다. 혹여 막히시거든 참모에게 "내가 무엇을 모르는지도 모르겠다, 무엇부터 물어야 하느냐"고 물으시옵소서. 길을 잃었을 때 길을 묻는 것 또한 병법이옵니다.
`
},
{

  "클로드 코드에게 오늘 되풀이되는 잡무 하나를 맡겨 보시옵소서.",
  "큰일을 시키기 전에 Shift+Tab으로 계획 모드를 켜고 계책부터 받아 보시옵소서.",
  "CLAUDE.md 군령서에 주공의 원칙 한 줄을 더하시옵소서.",
  "모르는 명령어 하나를 클로드에게 \"초보자에게 설명하듯\" 물어보시옵소서.",
  "비슷한 사진 열 장 가운데 한 장만 남기고 나머지는 과감히 내려놓으시옵소서.",
  "원본 사진의 백업이 두 곳 이상에 있는지 오늘 확인하시옵소서.",
  "해 뜬 직후나 해 지기 전 한 시간, 빛이 떨어지는 자리를 오 분만 바라보시옵소서.",
  "거장의 사진 한 장을 십 분 동안 들여다보고, 왜 그 순간이었는지 적어 보시옵소서.",
  "이번 달 군량 — 수입, 지출, 버틸 수 있는 날수 — 를 한 장에 적어 보시옵소서.",
  "고마운 손님 한 분께 먼저 안부를 전하시옵소서.",
  "오늘 할 일 가운데 하나를 거절하거나 남에게 맡기시옵소서.",
  "삼십 분 걸으시옵소서. 고민은 걸으며 푸는 것이옵니다.",
  "이번 주에 잘된 일, 잘못된 일, 다음 주에 할 한 가지를 세 줄로 적으시옵소서.",
  "사진 한 장을 세상에 내보이시옵소서. 완벽하지 않아도 되옵니다."
];
</script>

<script>
(() => {
  const now = new Date();
  const dayKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  const dayIndex = Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 86400000);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  // --- Date & greeting ---
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  document.getElementById("dateLine").textContent =
    `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${weekdays[now.getDay()]}요일`;
  const h = now.getHours();
  const greeting =
    h < 5  ? "밤이 깊었사옵니다. 주공, 오늘은 이만 쉬시옵소서." :
    h < 9  ? "새벽 기운이 맑사옵니다. 주공, 평안히 주무셨사옵니까." :
    h < 12 ? "해가 높이 올랐사옵니다. 오늘의 싸움을 시작하실 때이옵니다." :
    h < 18 ? "한낮이 기울고 있사옵니다. 잠시 숨을 고르시옵소서." :
             "날이 저물었사옵니다. 오늘 하루도 수고 많으셨사옵니다.";
  document.getElementById("greeting").textContent = greeting;

  // --- Maxim of the day ---
  const m = MAXIMS[dayIndex % MAXIMS.length];
  document.getElementById("maximHan").textContent = m.han;
  document.getElementById("maximKo").textContent = m.ko;
  document.getElementById("maximSrc").textContent = "— " + m.src;

  // --- Stratagem of the day ---
  const todayEl = document.getElementById("today");
  const check = document.getElementById("todayCheck");
  document.getElementById("todayText").textContent = STRATAGEMS[dayIndex % STRATAGEMS.length];
  check.checked = store.get("stratagem-done") === dayKey;
  todayEl.classList.toggle("done", check.checked);
  check.addEventListener("change", () => {
    store.set("stratagem-done", check.checked ? dayKey : "");
    todayEl.classList.toggle("done", check.checked);
  });

  // --- Chapters ---
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = body => body.replace(/^## .*$/gm, "").replace(/\s+/g, " ").trim();

  const tabsEl = document.getElementById("tabs");
  const article = document.getElementById("article");

  CHAPTERS.forEach((c, i) => {
    const chars = plain(c.body).length;
    const mins = Math.max(1, Math.round(chars / 500));
    const b = document.createElement("button");
    b.className = "tab";
    b.role = "tab";
    b.id = "tab-" + c.id;
    b.innerHTML =
      `<span class="tab-num">${c.num}</span>` +
      `<span><div class="tab-title">${esc(c.tab)}</div>` +
      `<div class="tab-meta">${chars.toLocaleString()}자 · ${mins}분</div></span>`;
    b.addEventListener("click", () => show(i, true));
    tabsEl.appendChild(b);
  });

  function render(c) {
    let n = 0, first = true;
    const blocks = c.body.trim().split(/\n\s*\n/).map(block => {
      block = block.trim();
      if (block.startsWith("## ")) {
        n++;
        return `<h3><span class="n">第${"一二三四五六七八九十"[n - 1] || n}計</span>${esc(block.slice(3))}</h3>`;
      }
      const cls = first ? ' class="lead"' : "";
      first = false;
      return `<p${cls}>${esc(block)}</p>`;
    }).join("");
    return `
      <div class="chapter-kicker">${esc(c.kicker)}</div>
      <h2>${esc(c.title)}</h2>
      <p class="chapter-sub">${esc(c.sub)}</p>
      ${blocks}
      <div class="signoff"><span>臣 亮 謹拜 · 신 량 삼가 올리옵니다</span><span class="seal">亮</span></div>`;
  }

  let current = -1;
  function show(i, scroll) {
    if (i === current) return;
    current = i;
    const c = CHAPTERS[i];
    [...tabsEl.children].forEach((t, j) => t.setAttribute("aria-selected", String(j === i)));
    article.setAttribute("aria-labelledby", "tab-" + c.id);
    const next = CHAPTERS[(i + 1) % CHAPTERS.length];
    article.innerHTML = render(c) +
      `<button class="next-chapter" id="nextBtn"><span>다음 장 · <strong>${esc(next.title)}</strong></span><span>→</span></button>`;
    document.getElementById("nextBtn").addEventListener("click", () => show((i + 1) % CHAPTERS.length, true));
    article.classList.remove("enter"); void article.offsetWidth; article.classList.add("enter");
    store.set("last-chapter", String(i));
    if (scroll) {
      const top = document.querySelector(".tabs-shell").offsetTop;
      if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
    }
    updateProgress();
  }

  // --- Reading progress ---
  const bar = document.getElementById("progress");
  function updateProgress() {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
  }
  addEventListener("scroll", updateProgress, { passive: true });
  addEventListener("resize", updateProgress);

  // Each morning, open on a different chapter so all three get their turn.
  show(dayIndex % CHAPTERS.length, false);

  // --- Close ---
  function closeWindow() {
    window.close();
    setTimeout(() => {
      const btn = document.getElementById("closeBtn");
      btn.textContent = "Ctrl+W (Mac은 ⌘W)로 닫으시옵소서";
    }, 200);
  }
  document.getElementById("closeBtn").addEventListener("click", closeWindow);

  // --- Keyboard ---
  addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "Escape") closeWindow();
    const k = Number(e.key);
    if (k >= 1 && k <= CHAPTERS.length) show(k - 1, true);
  });
})();
</script>
</body>
</html>
