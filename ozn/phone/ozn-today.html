<title>오즈네이쳐 육류 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* 레이아웃: 위에서 아래로 한 칸 세로 스크롤. 날짜 선택 → 탭(브리핑 / 학습 카드). 브리핑은 아이디어 → 시장 흐름 → 뉴스, 카드는 도식 → 본문 → 요약 */
:root{
  --bg:#F2F4F3; --card:#FFFFFF; --ink:#1B2321; --sub:#5E6A66; --line:#DDE3E0;
  --accent:#B0252E; --accent-soft:#F6E3E4; --mid:#9A7A1E; --mid-soft:#F3EBD3; --done:#2E7D5B; --done-soft:#DDEFE6;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-head:"Noto Serif KR",Georgia,"Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1E2522; --ink:#ECF0EE; --sub:#9AA8A3; --line:#2E3834;
  --accent:#F08088; --accent-soft:#3A2224; --mid:#D8B65A; --mid-soft:#3A3522; --done:#6FCB9F; --done-soft:#1F3A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1E2522; --ink:#ECF0EE; --sub:#9AA8A3; --line:#2E3834;
  --accent:#F08088; --accent-soft:#3A2224; --mid:#D8B65A; --mid-soft:#3A3522; --done:#6FCB9F; --done-soft:#1F3A2E; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--f-head);font-size:26px;line-height:1.3;margin:0}
.sub{color:var(--sub);font-size:14px}
select{min-height:44px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--sub);font-size:13px}
h3{font-size:16px;margin:8px 0 0;padding-top:12px;border-top:1px solid var(--line)}
p{margin:0}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.idea{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:10px}
.itag{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.ititle{font-weight:700}
.mk{display:grid;grid-template-columns:1fr;gap:10px}
.mk div{background:var(--bg);padding:10px 12px;border-radius:10px}
.mk b{display:block;font-size:14px}
details{border:1px solid var(--line);border-radius:10px;padding:12px}
summary{cursor:pointer;font-weight:700}
.meta{font-size:13px;color:var(--sub);margin:4px 0}
.impact{background:var(--accent-soft);padding:8px 10px;border-radius:8px;margin-top:6px;font-size:14px}
.ctitle{font-family:var(--f-head);font-size:20px;line-height:1.4}
p.body,p.intro{line-height:1.85}
p.intro{color:var(--sub)}
.box{border-left:4px solid var(--accent);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:4px}
.box b{font-size:12px;letter-spacing:.06em;color:var(--accent)}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.sum{background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.src{font-size:13px;color:var(--sub)}
.dia{display:flex;flex-direction:column;gap:6px}
a.link{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;text-align:center;padding:8px 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a.link{color:#1B0B0C}}
:root[data-theme="dark"] a.link{color:#1B0B0C}
.animal{width:100%;height:auto;display:block}.outline{fill:none;stroke:var(--ink,#1B2321);stroke-width:6;stroke-linejoin:round}.fillbase{fill:var(--card,#fff);stroke:none}.zone{stroke:var(--card,#fff);stroke-width:2}.z-g{fill:var(--accent-soft,#F3D3D5);}.z-m{fill:var(--mid-soft,#F1E5BF);}.z-s{fill:var(--done-soft,#CFE8DA);}.dash{stroke:var(--ink,#1B2321);stroke-width:1.5;stroke-dasharray:5 3}.zt{fill:var(--ink,#1B2321);font-size:15px;font-weight:700}.zt.sp{fill:var(--accent,#B0252E)}.zh{fill:var(--sub,#5E6A66);font-size:12px}.zin{font-size:11px}.tail{fill:none;stroke:var(--ink,#1B2321);stroke-width:5;stroke-linecap:round}.tuft{fill:var(--ink,#1B2321)}.ear{fill:var(--card,#fff);stroke:var(--ink,#1B2321);stroke-width:2.2}.eye{fill:var(--ink,#1B2321)}.leader{stroke:var(--accent,#B0252E);stroke-width:1.5}.dot{fill:var(--accent,#B0252E)}.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:4px}.legend span{display:inline-flex;align-items:center;gap:6px}.sw.z-g{background:var(--accent-soft,#F3D3D5)}.sw.z-m{background:var(--mid-soft,#F1E5BF)}.sw.z-s{background:var(--done-soft,#CFE8DA)}.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--ink,#1B2321)}
[hidden]{display:none!important}
</style>

<script>
var BR=[{"date":"2026-10-01","day":1,"ideas":[{"tag":"릴스","title":"소 한 마리 위에 부위 칠하기 (구이·불고기·탕 3색)","body":"오늘 카드의 소 도식을 보여 주며 '소고기 부위, 몸에서 어디일까요?'로 시작합니다. 등 쪽은 부드러운 구이용, 다리와 가슴은 오래 끓이는 탕·찜용이라는 한 줄 결론으로 마무리합니다. 15~25초면 충분합니다."},{"tag":"스토어","title":"상세페이지에 '이 부위는 몸의 여기' 도식과 용도 배지 넣기","body":"대표 상품 3개에 부위 위치 그림과 '구이용/불고기용/국거리용' 배지를 넣어 보세요. 구매 후 '이걸로 구워도 되나요?' 문의와 용도 착각 클레임이 줄어듭니다."},{"tag":"B2B 영업","title":"거래처 메뉴별 추천 부위 한 장 시트","body":"고깃집, 국밥집, 불고기 전문점, 구내식당 4가지 유형별로 '이 메뉴에는 이 부위'를 정리한 A4 한 장을 만들어 기존 거래처 5곳에 보내 보세요. 견적 대화가 부위 이야기로 시작되면 단가 경쟁에서 한 발 빠져나옵니다."},{"tag":"인사·HACCP","title":"외국인 근로자 대상 10분 부위 교육","body":"도식에 모국어 명칭을 병기해 출력하고, 작업 전 10분 교육을 해 보세요. 부위를 알면 소분 실수가 줄고, 교육 일시와 참석자를 기록하면 HACCP 교육 기록으로도 남길 수 있습니다."},{"tag":"마케팅","title":"거래처에 주 1회 '이번 주 시세 한 줄' 문자","body":"예: '이번 주 호주산 소 가격은 오르고 미국산은 내렸습니다. 견적 필요하시면 말씀 주세요.' 영업 압박 없이 전문가라는 인상을 남기는 가장 값싼 방법입니다. 오늘 뉴스가 첫 소재입니다."}],"market":{"beef":"9월 한 달 세계 소 가격은 지역별로 엇갈렸습니다. 호주 비육우는 8월 430에서 9월 448(Ac/kg 생체, +4.2%)로 올랐고, 브라질은 342에서 343으로 사실상 보합, 미국은 709에서 681(-3.9%)로 내렸습니다. 올해 세계 소고기 생산은 감소하고 가격은 높게 유지된다는 전망이 우세합니다.","pork":"미국 돼지 협상 거래가는 9월 말 100파운드당 약 79~80달러 수준입니다. 유럽(덴마크 등)과 브라질은 1년 전보다 크게 낮은 가격대라는 보도가 있고, 중국의 EU산 돼지고기 반덤핑 관세와 스페인 ASF 발생이 유럽 가격을 눌렀다는 분석이 있습니다. 중국 수입은 올해 약 100만 톤으로 감소가 전망됩니다."},"news":[{"title":"호주 소 가격 9월 4.2% 상승, 미국은 3.9% 하락","source":"Stock Journal / Farm Online (호주 매체, 월간 국가별 소 가격 비교)","date":"2026년 9월","summary":"호주 비육우 가격이 8월 대비 4.2% 올랐고 브라질은 거의 변화가 없었으며 미국은 3.9% 내렸습니다. 보도는 미국의 소고기 수입 쿼터(약 30만 톤) 관련 조치가 미국 시장 열기를 식힌 것으로 해석했습니다. 브라질은 세계 소 가격 비교에서 가장 낮은 기준 가격으로 언급됩니다.","impact":"수입 소고기 단가 협상에서 호주산 강세와 미국산 약세 신호입니다. 수입육 취급 거래처에는 환율과 함께 견적 시점을 확인하세요."},{"title":"미국 USDA 일일 보고: 비육우와 돼지 가격","source":"USDA 보고를 요약한 IndexBox 기사","date":"2026-09-29 ~ 09-30","summary":"9월 29일 기준 Choice 80% 이상 비육 거세우는 평균 1,023파운드에 100파운드당 348.55달러, 암소는 893파운드에 349.82달러로 거래됐습니다. 돼지 협상 거래의 가중평균 순가격은 9월 30일 100파운드당 79.96달러였습니다.","impact":"미국 시세는 수입 부분육 가격의 선행 지표입니다. 미국산 삼겹·갈비 취급 거래처가 있다면 다음 달 수입 단가 변동을 예상해 보세요."},{"title":"유럽·브라질 돼지 가격 약세, 중국 수입 감소 전망","source":"The Pig Site 및 S&P Global 인용 보도 (검색 요약)","date":"발표 시점 확인 필요","summary":"덴마크 돼지 가격이 1년 전보다 45%, 브라질은 약 42% 낮다는 보도가 있습니다. 중국의 EU산 돼지고기 반덤핑 관세와 스페인 ASF 발생이 유럽 가격을 눌렀고, 중국의 올해 돼지고기 수입은 약 100만 톤으로 7.1% 줄 것으로 전망됩니다. 무역 흐름은 중국·일본 수입 감소와 브라질 수출 확대 방향으로 이동하고 있습니다.","impact":"수입 돼지고기(삼겹, 목살) 가격에는 하락 압력입니다. 국산 돼지 시세와 수입 단가 격차를 이번 주에 ekapepia와 비교해 보세요."}],"newsNote":"확인 한계: 이 환경에서는 FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약문 기준으로 정리했습니다. 숫자는 보도를 인용한 것이므로 거래 판단 전에 원문을 확인하세요. 국내 한우·돼지 시세의 최신 기사는 검색되지 않았습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-02","day":2,"ideas":[{"tag":"릴스","title":"'왜 사태는 구우면 질길까?' 15초 비교 영상","body":"같은 사태를 짧게 구운 것과 오래 끓인 것을 나란히 썰어 보여 주세요. 후크는 '구우면 질기고 끓이면 부드러운 고기가 있다?'로 하고, 결론은 '콜라겐이 젤라틴이 되기 때문'이라는 한 줄이면 충분합니다. 오늘 카드 내용을 그대로 영상으로 바꾸는 가장 쉬운 방법입니다."},{"tag":"스토어","title":"상품 설명 첫 줄에 '이렇게 조리하세요' 한 줄 넣기","body":"등심·채끝에는 '센 불에 짧게 굽기', 양지·사태에는 '약한 불에 오래 끓이기'를 아이콘과 함께 넣어 보세요. 용도에 맞지 않는 조리로 인한 '질기다'는 리뷰와 문의를 줄이는 데 도움이 됩니다."},{"tag":"B2B 영업","title":"국밥·찜 전문점용 '국거리 부위 단가표' 제안","body":"오래 끓이는 업종은 결합조직이 많은 양지와 사태가 맛과 원가에 유리합니다. 해당 업종 거래처에 '탕·찜용 부위 한 장 단가표'를 보내 보세요. 구이용 단가 경쟁에서 벗어나 새 거래 대화를 열 수 있습니다."},{"tag":"인사·HACCP","title":"외국인 근로자 비자·계약 만료일 90일 전 알림표","body":"오늘 캘린더 항목입니다. 이름, 체류 자격, 만료일, 갱신 준비 시작일(만료 90일 전)을 한 장 표로 만들고 휴대폰 캘린더에 알림을 넣어 두세요. 갱신 시기를 놓치는 일이 가장 큰 인사 리스크입니다."},{"tag":"지원사업","title":"하반기 지원사업 공고 후보 3개 메모","body":"K-Startup, 기업마당, 충북·청주시 공고에서 식품 제조·가공 업체가 신청할 수 있는 항목을 3개만 골라 마감일과 요구 서류를 적어 보세요. 식품 위생·설비 개선, 판로·온라인 마케팅 관련 공고가 있는지 확인해 보시길 권합니다."}],"market":{"beef":"10월 1일 기준 브라질 소 가격은 15kg당 366.5헤알로 전일 대비 0.6% 올랐고, 미국 생우 선물은 0.3% 올랐다는 시세 사이트 표기가 있습니다. 미국은 올해 소고기 가격이 기록적으로 높고 수입이 사상 최대가 될 것이라는 전망이 이어지고 있습니다.","pork":"미국 돼지 가중평균 순가격은 10월 1일 보고에서 100파운드당 약 80~84달러였습니다. 올해 세계 돼지고기 생산은 약 0.6% 늘고 브라질이 증산과 수출 확대를 이끄는 반면, 유럽은 스페인 ASF 영향으로 생산과 수출이 줄 것이라는 USDA 전망이 소개되고 있습니다."},"news":[{"title":"미국 돼지 거래 순가격 10월 1일 보고","source":"USDA 일일 보고(LM_HG215)를 요약한 IndexBox 기사","date":"2026-10-01","summary":"가중평균 순가격이 100파운드당 80.14~84.31달러 범위로 보고됐습니다. 전일 보고(9/30)의 협상 거래 평균 79.96달러와는 집계 기준이 달라 단순 비교는 어렵지만 80달러 안팎의 가격대가 유지되고 있습니다.","impact":"미국산 삼겹·갈비 수입 단가의 선행 지표입니다. 수입 돼지고기 취급 거래처는 다음 달 견적 변동 가능성을 염두에 두세요."},{"title":"소 가격: 브라질 15kg당 366.5헤알, 미국 생우 소폭 상승","source":"Trading Economics 시세 요약(검색 결과)","date":"2026-10-01","summary":"브라질 소 가격은 전일 대비 0.6%, 미국 생우는 0.3% 올랐다고 표기됩니다. 단위가 사이트 표기 그대로라 정확한 단위는 원문 확인이 필요합니다.","impact":"브라질산·미국산 수입 소고기 단가 방향을 보는 참고 지표입니다. 환율과 함께 확인하세요."},{"title":"2026년 세계 돼지고기 생산 소폭 증가, 브라질 증산·EU 감산","source":"USDA 전망을 인용한 Pigua 기사(검색 요약)","date":"발표 시점 확인 필요","summary":"세계 생산은 약 0.6% 늘어난 1억 2,020만 톤으로 전망되고, 브라질은 생산 3.2%와 수출 6.8% 증가, EU는 생산 1.2%와 수출 7.6% 감소, 중국은 수입을 15.8% 줄여 약 100만 톤으로 예상됩니다.","impact":"수입 돼지고기 공급처가 브라질 쪽으로 넓어지고 유럽산은 위축될 수 있다는 신호입니다. 수입 삼겹 거래처가 있다면 원산지별 단가를 비교해 보세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 한국어 검색에서는 한우·삼겹살 소매가 상승 기사가 나왔지만 2026년 기사인지 확인되지 않아 싣지 않았습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요. 이 브리핑은 10월 3일에 대신 생성했습니다."},{"date":"2026-10-03","day":3,"ideas":[{"tag":"릴스","title":"'1++ 우둔인데 마블링이 왜 없지?' 오해 바로잡기","body":"후크는 '1++ 등급인데 마블링이 없다고요?'입니다. 등급은 등심 단면으로 매기고 우둔은 원래 지방이 적은 부위라는 점을 도식 한 장으로 설명하세요. 오늘 카드 도식을 그대로 활용할 수 있습니다."},{"tag":"스토어","title":"등급 표기를 '등급+부위명' 세트로 통일하기","body":"상세페이지에서 등급만 크게 쓰지 말고 부위명과 용도(구이용/국거리용)를 같은 줄에 적어 보세요. 비교표 이미지(1++, 1+, 1등급 마블링 차이)를 하나 넣으면 문의가 줄어듭니다."},{"tag":"B2B 영업","title":"메뉴·손님 연령대별 '적정 등급 가이드' 한 장","body":"고깃집은 구이용 상위 등급, 국밥집은 국거리 부위 위주, 어르신 손님이 많은 식당은 담백한 1등급 살코기처럼 유형별 추천을 정리해 보세요. 무조건 높은 등급을 권하지 않는 영업은 거래처의 신뢰를 얻습니다."},{"tag":"인사·HACCP","title":"냉동창고 작업 안전·방한 수칙 한 장 (쉬운 한국어+모국어)","body":"개천절이라 여유가 있는 날 만들어 두기 좋습니다. 방한복 착용, 미끄럼 주의, 문 열림 시간 최소화, 창고 내 혼자 작업 금지 같은 항목을 그림과 함께 정리하고, 월요일 작업 전 5분 교육 자료로 쓰세요."},{"tag":"마케팅","title":"한우데이(11/1) 3부작: 등급·부위·수율 이야기","body":"오늘 등급, 다음 주 육량등급, 그다음 수율 이야기를 한우데이 전까지 3부작 시리즈로 묶어 보세요. 오늘 캘린더 항목인 '10월 릴스 주제 10개 리스트업'의 첫 세 칸을 이 시리즈로 채울 수 있습니다."}],"market":{"beef":"올해 미국은 소 공급이 빠듯해 소고기 가격이 기록적으로 높고 수입이 사상 최대가 될 것이라는 전망이 이어집니다. 9월 한 달에는 호주 소 가격이 올랐고 미국은 내렸습니다(앞선 브리핑 참고).","pork":"스페인 ASF 영향으로 유럽산 수출이 줄 것으로 보이는 가운데 필리핀이 스페인산 돼지고기에 시장을 다시 열었다는 보도가 있습니다. 중국은 자체 공급이 충분해 수입을 크게 줄이는 흐름입니다."},"news":[{"title":"미국 소고기: 공급 감소와 사상 최대 수입 전망","source":"USDA ERS 가축·낙농·가금 전망(1월호)과 Farm Progress 기사(검색 요약)","date":"2026년 초 발표 (시점 확인 필요)","summary":"2026년 미국 소 도축과 생산이 더 줄어 가격이 기록적으로 높아지고 소고기 수입은 사상 최대가 될 것이라는 전망입니다. 연평균 비육우 가격 전망은 100파운드당 357달러로 전년보다 약 11% 높다고 소개됩니다.","impact":"미국이 수입을 늘리면 호주·브라질산 수요가 늘어 수입 소고기 가격 하방이 단단해질 수 있습니다. 수입육 재고 시점을 신중히 보세요."},{"title":"스페인 ASF 지속, 필리핀은 스페인산 돼지고기 시장 재개","source":"Pigua 기사(검색 요약)","date":"발표 시점 확인 필요","summary":"스페인에서 확인된 아프리카돼지열병(ASF)이 EU 수출 확대를 막고 있습니다. 한편 필리핀이 스페인산 돼지고기에 다시 문을 열었다는 내용이 함께 언급됩니다.","impact":"질병 이슈는 수입 돼지고기 공급과 가격을 갑자기 흔들 수 있습니다. 국내 ASF 방역 소식과 수입 원산지별 정보를 함께 보세요."},{"title":"중국 돼지고기 수입 15.8% 감소 전망","source":"USDA 전망을 인용한 Pigua 기사(검색 요약)","date":"발표 시점 확인 필요","summary":"중국이 풍부한 자체 공급으로 올해 돼지고기 수입을 약 100만 톤으로 줄일 것으로 전망됩니다. 이 때문에 남는 물량이 다른 시장으로 향할 수 있다는 해석이 나옵니다.","impact":"중국으로 가지 못한 유럽·브라질산 물량이 한국을 포함한 다른 시장에 풀리면 수입 삼겹·목살 가격이 약해질 수 있습니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했고 일부는 발표 시점이 불확실합니다. 한국어 검색에서는 한우·삼겹살 소매가 상승 기사가 나왔지만 2026년 기사인지 확인되지 않아 싣지 않았습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-04","day":4,"ideas":[{"tag":"릴스","title":"'같은 1++인데 A와 C는 정육이 다르다?' 손질 전후 무게 비교","body":"같은 무게의 원료 두 종류를 손질해 정육 무게를 저울로 보여 주세요. 후크는 '1++ 뒤의 알파벳 A, B, C의 비밀'입니다. 육질은 맛, 육량은 정육 비율이라는 한 줄로 마무리합니다. 일요일에 촬영 콘티만 잡아 두고 월요일 작업 때 찍어도 좋습니다."},{"tag":"스토어","title":"상품 설명에 '손질 후 실중량' 기준 명시하기","body":"냉동·소분 상품이라면 '손질 후 중량 기준', '지방 트리밍 정도'를 한 줄 적어 보세요. 수율이 낮은 상품을 싸게 보이게 파는 경쟁과 선을 긋고, 중량 관련 문의와 클레임도 줄일 수 있습니다."},{"tag":"B2B 영업","title":"'단가가 아니라 실제 원가' 한 장 설명 자료","body":"매입 10,000원/kg에 수율 80%면 실제 원가는 12,500원입니다. 이 계산 예시와 우리 제품의 손질 규격을 한 장에 담아 거래처 상담에 쓰세요. 단가만 비교하는 거래처에 가장 설득력 있는 자료입니다."},{"tag":"인사·HACCP","title":"지방 트리밍 기준 사진 표준서 만들기","body":"손질 담당자마다 지방을 떼는 정도가 다르면 수율과 제품 규격이 흔들립니다. 지방 두께별 합격·불합격 사진을 만들어 작업대에 붙이고 외국인·알바 근로자 교육에도 쓰세요. 작업표준서와 연결하면 HACCP 기록에도 도움이 됩니다."},{"tag":"마케팅","title":"일요일 15분: 지난 주 시세·재고 메모와 거래처 문자 소재 만들기","body":"오늘 캘린더 항목(자료 정리)을 활용하세요. 지난 주 주력 품목 시세와 재고를 한 줄씩 적고, 오늘 뉴스인 라보뱅크의 '돼지고기 시장은 압박 속에서도 재균형 진행' 내용을 '이번 주 시세 한 줄' 문자 소재로 정리해 두세요."}],"market":{"beef":"올해 미국의 소고기 수입이 사상 최대로 늘어 미국 소비 소고기의 20% 이상을 차지할 것이라는 전망이 보도되고 있습니다. 호주의 미국 수출이 늘고 수입 제조용 소고기(90CL) 가격이 사상 최고 수준이라는 보도도 있습니다.","pork":"라보뱅크는 3분기 돼지고기 보고서에서 시장이 여전히 압박을 받고 있지만 재균형이 진행 중이라고 평가했습니다. 중국은 생산 확대로, 유럽은 스페인의 ASF로 수출이 막혀 공급이 넘치는 구조이며 올해 하반기 세계 생산은 둔화할 전망입니다."},"news":[{"title":"라보뱅크 3분기 글로벌 돼지고기 보고서: 압박 속 재균형 진행","source":"Rabobank 글로벌 돼지고기 분기 보고서 Q3 2026 (검색 요약)","date":"2026년 3분기","summary":"세계 돼지고기 가격은 정체된 수요와 공급 과잉으로 약세가 이어지고 있습니다. 중국은 지난 5년간의 설비 확대와 생산성 향상으로 공급이 늘었고, 유럽은 스페인 ASF 때문에 수출이 막혀 역내 물량이 늘었습니다. 올해 하반기 세계 생산은 둔화할 것으로 전망됩니다.","impact":"수입 돼지고기 가격은 단기적으로 약세, 하반기 이후 점진적 회복 가능성이 있습니다. 수입 삼겹·목살 재고와 구매 시점을 이번 분기 안에 점검해 보세요."},{"title":"미국 소고기 수입 사상 최대 전망, 소비량의 20% 이상","source":"미국 소고기 수입 전망 기사(검색 요약)","date":"발표 시점 확인 필요","summary":"올해 미국의 소고기 수입이 사상 최고치를 기록하고 미국에서 소비되는 소고기의 20% 이상을 차지할 것이라는 전망입니다. 국내 공급 감소로 미국이 해외 물량을 더 끌어가는 구조입니다.","impact":"미국이 수입을 늘리면 호주·브라질산 수요가 커져 수입 소고기 가격 하방이 단단해질 수 있습니다."},{"title":"호주산 수입 제조용 소고기(90CL) 가격 사상 최고 수준","source":"호주 축산 매체(Shepp News 등) 보도 요약","date":"발표 시점 확인 필요","summary":"미국 수입 제조용 소고기(90CL) 가격 지표가 호주 센트 기준 kg당 1,120센트로 기록적 수준이라는 보도입니다. 최근 3개월 호주산 냉장 소고기의 미국 수출은 전년 같은 기간보다 약 25% 많았다고 소개됩니다.","impact":"호주산 가공용 원료 가격 상승 신호입니다. 햄버거 패티, 분쇄육용 수입 원료를 쓰는 거래처가 있다면 단가 변동에 대비하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했고 일부는 발표 시점이 불확실합니다. 한국어 검색에서는 2026년 기사로 확인되는 한우·삼겹살 시세 자료를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-05","day":5,"ideas":[{"tag":"릴스","title":"'원육 10kg이 손질하면 몇 kg?' 저울 실측 릴스","body":"원료를 올린 저울, 손질 후 정육, 떼어낸 지방과 뼈를 차례로 보여 주세요. 후크는 '싸게 산 고기가 사실 더 비싸다?'입니다. 마지막에 '실제 원가 = 매입단가 ÷ 수율' 자막을 넣으면 오늘 카드 한 장이 그대로 영상이 됩니다."},{"tag":"스토어","title":"상품명 키워드 점검과 '100g당 가격' 병기","body":"오늘 캘린더 항목입니다. 대표 상품의 이름에 부위, 용도, 원산지가 들어 있는지 점검하고, 가격 옆에 100g당 가격을 함께 적어 보세요. 손질 후 중량 기준이라는 점을 같이 쓰면 가격 비교에서 신뢰를 얻을 수 있습니다."},{"tag":"B2B 영업","title":"'수율 기반 실제 원가 계산표' 엑셀 한 장","body":"칸을 매입단가, 수율, 부산물 판매 수입, 실제 원가로 만들어 거래처 상담 때 바로 숫자를 넣어 보여 주세요. 단가만 비교하던 거래처가 손질 규격과 정육 기준으로 대화하게 되는 계기가 됩니다."},{"tag":"인사·HACCP","title":"수율 실측 기록표를 외국인·알바 근로자도 쓸 수 있게 단순화","body":"원료 무게, 정육 무게, 지방, 뼈 네 칸만 있는 한 장 표를 만들어 작업대에 두고, 월요일 작업 전 5분간 쓰는 법을 알려 주세요. 기록 담당을 정하면 HACCP 작업 기록과도 자연스럽게 연결됩니다."},{"tag":"지원사업·마케팅","title":"계량·기록 자동화 관련 지원사업 공고 확인과 이번 주 시세 한 줄 문자","body":"정밀 계량이나 생산 기록 자동화 설비를 지원하는 공고가 있는지 K-Startup, 기업마당에서 찾아 보세요. 그리고 오늘 뉴스인 '미국 소 선물 하락과 수출 금지 루머'를 '이번 주 시세 한 줄' 문자 소재로 쓸 수 있습니다."}],"market":{"beef":"미국 생우 10월물 선물은 한 주 사이 100파운드당 약 3.75달러 내린 215.9달러였고, 도매 Choice 부분육 가격(컷아웃)은 371.94달러로 4달러 하락했습니다. 현물 거래는 생우 222~223달러로 보합이었습니다. 미국 정부의 가격 인하 조치와 수출 금지 루머가 선물 가격을 눌렀다는 보도가 있습니다.","pork":"유럽은 스페인에 이어 독일 서부의 ASF 보도로 가격 부담이 커지고 생산이 줄어드는 흐름이고, 필리핀·베트남 같은 동남아는 국내 공급 부족으로 수입을 늘리고 있습니다. 중국 돼지고기 가격은 1년 전보다 0.5% 높은 수준이라는 표기가 있습니다."},"news":[{"title":"미국 소 선물 하락: 정책 개입과 수출 금지 루머","source":"Beef Magazine, Andrews Meat 시장 스냅샷 등 (검색 요약)","date":"2026년 10월 첫째 주 (정확한 날짜 확인 필요)","summary":"10월물 생우 선물이 한 주 동안 3.75달러 내려 215.925달러를 기록했고, 이후 월물은 5.6~7.25달러 하락했습니다. 트럼프 행정부가 소고기 가격을 낮추려 한다는 소문과 확인되지 않은 미국산 소고기 수출 금지설이 선물을 눌렀지만 현물 거래는 버텼습니다. Choice 컷아웃은 371.94달러, Select는 353.26달러였습니다.","impact":"미국산 소고기 수입 단가의 방향이 흔들릴 수 있습니다. 수출 금지는 확인되지 않은 루머이므로 거래 판단은 공식 발표 후에 하세요."},{"title":"필리핀 돼지고기 가격 높은 수준 유지, 동남아 수입 증가","source":"USDA FAS 필리핀 축산물 연례 보고서 (2026년 9월, 검색 요약)","date":"2026-09","summary":"필리핀은 공급이 빠듯해 돼지고기 가격이 높은 수준을 유지할 것으로 전망되며, 필리핀과 베트남 같은 동남아 국가가 질병과 국내 생산 부족을 메우려고 수입을 늘리고 있습니다. 유럽 수출업자가 중국 외 시장을 찾는 흐름과 맞물립니다.","impact":"중국 수입이 줄어도 동남아 수요가 물량을 흡수하면 수입 돼지고기 가격 급락은 제한될 수 있습니다."},{"title":"독일 서부 ASF 발생 보도, 유럽 돼지 가격 부담 지속","source":"S&P Global·AHDB 유럽 돼지고기 시황 요약 (검색 요약)","date":"발표 시점 확인 필요","summary":"스페인에 이어 독일 서부에서 ASF가 보고되어 이웃 국가의 수입 규제 가능성이 거론됩니다. 약한 내수와 풍부한 공급이 겹쳐 유럽 돼지고기 가격이 내려가고 EU 생산은 약 1% 줄 것으로 예상됩니다.","impact":"유럽산 수입 삼겹 가격은 약세 요인이지만, 수출 규제가 확대되면 공급 불안이 생길 수 있습니다. 유럽산 비중이 큰 거래처는 원산지 대안을 점검하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했고 일부는 발표 시점이 불확실합니다. 한국어 검색에서는 2026년 기사로 확인되는 한우·삼겹살 시세 자료를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-06","day":6,"ideas":[{"tag":"릴스","title":"돼지 실루엣 위에 7부위 칠하기 + 소분·진공포장 ASMR","body":"오늘 캘린더 항목과 학습 카드를 한 영상으로 묶어 보세요. 앞부분 5초는 돼지 도식에 7부위가 채워지는 화면, 뒷부분은 소분과 진공포장 소리 위주 영상입니다. 후크는 '돼지고기 한 마리에서 삼겹살은 얼마나 나올까?'가 좋습니다."},{"tag":"스토어","title":"앞다리·뒷다리 '불고기·수육·제육 세트' 상품 기획","body":"구이용 부위만 잘 팔리면 앞·뒷다리 재고가 쌓입니다. 용도별로 손질한 불고기용, 수육용, 제육용 3종을 소용량 세트로 묶고 상세페이지에 부위 위치 도식과 추천 조리법을 넣어 보세요. 재고 회전을 올리는 가장 직접적인 방법입니다."},{"tag":"B2B 영업","title":"'삼겹이 비쌀 때 앞다리로 바꾸는 메뉴' 레시피 카드","body":"제육볶음, 수육, 김치찌개용 등 앞·뒷다리로 만들 수 있는 메뉴를 한 장 카드로 만들어 구이 중심 식당과 구내식당에 보내 보세요. 원가가 부담스러운 시기에 대안을 제시하는 영업은 거래처 유지에 효과적입니다."},{"tag":"HACCP·인사","title":"HACCP 월간 기록 점검과 돼지 7부위 명칭 병기표","body":"오늘 캘린더 항목입니다. 이번 달 냉동·냉장 온도 기록, 위생 점검표, 교육 기록에서 빠진 날이 없는지 훑어 보세요. 그리고 돼지 7부위 도식에 모국어 명칭을 병기한 표를 만들어 외국인·알바 근로자 소분 교육에 쓰세요."},{"tag":"지원사업·마케팅","title":"지원사업 후보 1곳 요건 읽기와 '수입육 시장 한 줄 소식' 문자","body":"10월 2일에 모은 후보 중 한 곳의 신청 자격과 제출 서류를 미리 읽어 보세요. 그리고 오늘 뉴스(브라질 소고기의 중국 쿼터 소진, 브라질 돼지고기 수출 확대)를 거래처용 '수입육 시장 한 줄 소식'으로 정리해 보내 보세요."}],"market":{"beef":"중국이 올해 1월부터 3년간 소고기 수입 쿼터 초과분에 55%의 추가 관세(기본 12%와 합쳐 67%)를 매기고 있고, 브라질은 7월 이미 쿼터의 80%를 채웠다는 보도가 있습니다. 브라질 업계는 올해 수출이 약 10% 줄 것으로 전망합니다.","pork":"미국 돼지고기는 올해 4분기 생산이 전년보다 1.5% 늘고 하반기 가격은 내려갈 것이라는 USDA 전망이 있습니다. 브라질은 올해 돼지고기 수출이 약 144만 톤으로 6% 늘어 아시아 수입 시장에서 비중을 키우고 있습니다."},"news":[{"title":"중국 소고기 세이프가드 쿼터: 브라질 쿼터 소진 임박, 도축 감축","source":"Rio Times, DatamarNews, S&P Global 등 (검색 요약)","date":"2026년 (7~9월 보도 포함)","summary":"중국은 1월 1일부터 3년간 쿼터 초과 소고기에 55% 추가 관세를 부과하며, 브라질의 올해 쿼터는 약 110만 톤입니다. 브라질은 7월 21일에 이미 쿼터의 80%를 채웠고, JBS 등 일부 도축장이 도축을 줄였습니다. 브라질 업계는 올해 소고기 수출이 약 10% 감소할 것으로 봅니다.","impact":"중국 쿼터에 묶인 브라질 물량이 다른 시장으로 향하면 수입 소고기 가격 경쟁이 달라질 수 있습니다. 한국 시장에서 허용되는 브라질산 품목 여부는 별도로 확인하세요."},{"title":"미국 돼지고기 4분기 생산 1.5% 증가, 하반기 가격 하락 전망","source":"USDA ERS 가축·낙농·가금 전망 (2026년 봄호 추정, 검색 요약)","date":"발표 시점 확인 필요","summary":"올해 4분기 미국 돼지고기 생산은 74억 파운드로 전년 같은 분기보다 1.5% 많을 것으로 추정됩니다. 하반기에 돼지와 돼지고기 가격이 내려가면서 미국산 돼지고기의 해외 가격 경쟁력이 높아질 것으로 전망됩니다.","impact":"미국산 삼겹·목살의 수입 단가가 낮아질 가능성이 있습니다. 다만 환율과 운임까지 반영한 최종 단가를 확인하세요."},{"title":"브라질 돼지고기 수출 확대: 올해 약 144만 톤 전망","source":"Pig333(3tres3) 브라질 돼지고기 2026 전망 기사 (검색 요약)","date":"발표 시점 확인 필요","summary":"브라질의 올해 돼지고기 수출은 전년보다 6.3% 늘어난 약 144만 톤이 될 것으로 전망됩니다. 동·동남아시아 수입 시장에서 브라질 비중이 약 40%까지 커졌다는 자료도 함께 소개됩니다.","impact":"아시아 수입 돼지고기 시장에서 브라질산과의 가격 경쟁이 커집니다. 수입 삼겹 거래처에는 원산지별 대안 견적을 준비해 두세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했고 일부는 발표 시점이 불확실합니다. 한국어 검색에서는 2026년 기사로 확인되는 한우·삼겹살 시세 자료를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-07","day":7,"ideas":[{"tag":"릴스","title":"'항정살은 돼지 어디에서 나올까?' 지시선 도식 릴스","body":"오늘 카드의 돼지 도식 위에 항정살, 가브리살, 갈매기살 위치를 점으로 찍어 보여 주세요. 후크는 '돼지 한 마리에서 항정살은 이만큼밖에 안 나옵니다'입니다. 희소성을 숫자나 저울 영상으로 보여 주면 반응이 좋습니다."},{"tag":"스토어","title":"베스트 상품 첫 화면에 '몸의 어디 부위' 도식과 한 줄 특징 넣기","body":"오늘 캘린더 항목입니다. 대표 상품의 첫 화면 상단에 부위 위치 그림과 '목 아래 근육, 한 마리에서 소량' 같은 한 줄을 넣어 보세요. 리뷰 답글에도 굽는 팁 한 줄을 붙이면 재구매 유도에 도움이 됩니다."},{"tag":"B2B 영업","title":"특수부위 월별 한정 물량 선예약 안내","body":"특수부위는 한 마리에서 나오는 양이 정해져 있어 거래처별 배정 기준이 필요합니다. 월 초에 '이번 달 항정·가브리·갈매기 한정 물량'을 선예약으로 안내해 보세요. 기존 거래처에는 신뢰를, 신규 식당에는 대화를 여는 계기를 줍니다."},{"tag":"인사·HACCP","title":"특수부위 소분 규격 사진과 5분 부위 맞히기","body":"항정, 가브리, 갈매기, 목살의 합격 규격 사진을 한 장에 모아 작업대에 붙이세요. 월요일 교육처럼 5분간 부위 사진을 보여 주고 이름 맞히기를 하면 외국인·알바 근로자의 소분 실수를 줄일 수 있습니다."},{"tag":"지원사업·마케팅","title":"ASF 소식 확인과 거래처 안내 문구 준비, 지원사업 요건 읽기","body":"오늘 뉴스에 ASF가 나옵니다. 국내 ASF 방역 정보는 농림축산식품부와 농림축산검역본부 공지에서 확인하고, 거래처가 불안해할 때 쓸 안내 문구(원료 이력번호와 입고 검수 기준)를 준비해 두세요. 여유가 있으면 지원사업 후보 한 곳의 요건도 읽어 보세요."}],"market":{"beef":"호주 MLA가 9월에 발표한 전망에서 올해 호주 소고기 생산은 사상 처음 300만 톤을 넘고 수출은 약 240만 톤으로 예상됩니다. 미국은 소 사육 마릿수가 75년 만에 가장 적어 수입 수요가 강하고, 중국은 쿼터제로 호주산 수입이 줄 것으로 전망됩니다.","pork":"스페인 ASF가 처음 발생 지역 밖의 야생 멧돼지로 번졌고 일부 국가가 스페인산 수입을 중단했다는 보도가 있습니다. 독일에서도 작센과 노르트라인베스트팔렌에서 ASF가 확인됐다는 내용이 이어집니다. 한국에서도 올해 초 ASF 발생이 20건으로 늘었다는 자료가 있어 발표 시점 확인이 필요합니다."},"news":[{"title":"호주 소고기 생산 사상 최대 300만 톤 초과 전망, 수출 약 240만 톤","source":"MLA 9월 소 산업 전망(Cattle Industry Projections)을 인용한 보도 (검색 요약)","date":"2026-09","summary":"호주 소 산업은 도축 두수와 도체 무게 증가로 올해 소고기 생산이 사상 최대인 300만 톤을 넘을 것으로 전망됩니다. 수출은 약 240만 톤이며, 중국의 호주산 쿼터는 20만 5천 톤으로 작년 수출량 31만 8천 톤보다 크게 낮습니다. 일본과 한국 수요는 강하지만 호주 달러 강세와 한국·중국의 관세 설정 변화가 부담이라고 소개됩니다.","impact":"호주산은 공급이 풍부하지만 중국 물량이 줄면 한국·일본 시장으로 더 향할 수 있습니다. 호주산 수입 소고기 단가 협상 때 환율과 관세 변화를 함께 확인하세요."},{"title":"스페인 ASF 야생 멧돼지 확산, 일부 수입국 중단 보도","source":"Pork Business, 유럽 ASF 현황 요약 (검색 요약)","date":"발표 시점 확인 필요","summary":"스페인에서 처음 발생 지역 밖의 야생 멧돼지에서 ASF가 확인됐고, 일본, 필리핀, 말레이시아, 멕시코, 대만, 태국 등이 스페인산 돼지고기 수입을 중단했다는 내용입니다. 독일에서도 작센에서 재발하고 노르트라인베스트팔렌에서 첫 야생 멧돼지 사례가 확인됐다고 합니다.","impact":"유럽산 수입 삼겹·목살의 공급과 가격이 갑자기 바뀔 수 있습니다. 앞선 보도에는 필리핀이 스페인산 시장을 다시 열었다는 내용도 있어 국가별 현재 상태는 확인이 필요합니다."},{"title":"한국 ASF 발생 20건, 7개 도 확산 보고","source":"돼지 질병 감시 보고서 요약 (swinehealth.org, 검색 요약)","date":"발표 시점 확인 필요 (2월 중순 기준 보고)","summary":"2월 중순까지 한국에서 20건의 ASF 발생이 7개 도에서 확인됐다는 내용입니다. 보고 연도가 명확하지 않아 최신 상황은 방역 당국 자료로 확인해야 합니다.","impact":"국내 ASF 상황은 국산 돼지 시세와 거래처 불안에 직접 영향을 줍니다. 최신 발생 현황은 농림축산식품부 공지로 먼저 확인하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했고 일부는 발표 시점이 불확실합니다. 한국 ASF 항목은 보고 연도가 불분명하니 방역 당국 자료로 최신본을 확인하세요. 한국어 검색에서는 2026년 기사로 확인되는 한우·삼겹살 시세 자료를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-08","day":8,"ideas":[{"tag":"릴스","title":"'포장에 육즙이 흥건한 고기, 왜 그럴까?' PSE 원인 설명","body":"오늘 카드의 PSE육 설명을 15초로 줄여 보세요. 후크는 '고기가 하얗고 물이 많이 고였다면 이유가 있습니다'입니다. 도축 전 스트레스가 고기 색과 수분에 영향을 준다는 점을 쉬운 말로 설명하면 전문가 이미지를 쌓을 수 있습니다."},{"tag":"스토어","title":"수입 소고기 '냉장 vs 냉동' 비교 카드와 관세 소식 한 줄","body":"오늘 뉴스처럼 한국은 올해 미국산 관세가 0%가 되고 호주산은 안전장치 관세 24%가 적용 중입니다. 수입육 상품이 있다면 상세페이지에 냉장과 냉동의 차이, 원산지별 특징을 비교한 카드를 넣어 보세요. 관세 설명은 사실 확인 후에 넣으세요."},{"tag":"B2B 영업","title":"공장 구내식당 소개 1장과 견적 응대 템플릿에 '단가 유효기간' 넣기","body":"오늘 캘린더 항목입니다. 구내식당용 소개 1장에 정량 소분과 납품 안정성을 담고, 견적 응대 템플릿에는 '환율·관세 변동 시 단가 유효기간 7일' 같은 문구를 넣어 보세요. 수입 원료를 쓰는 견적에는 특히 필요한 보호 장치입니다."},{"tag":"인사·HACCP","title":"입고 검수표에 육색·드립·온도 칸과 PSE 의심 사진 기준 추가","body":"검수표에 육색, 포장 내 육즙(드립) 양, 입고 온도 세 칸을 넣고, 'PSE 의심' 사진 예시를 한 장 붙여 두세요. 외국인·알바 근로자도 사진으로 판단할 수 있고, 매입처별 품질 비교와 HACCP 입고 기록에도 쓰입니다."},{"tag":"지원사업·마케팅","title":"관세 변화 안내 문자와 시설 개선 지원사업 공고 확인","body":"거래처에 '올해 호주산 관세가 달라졌고 미국산은 무관세입니다. 견적 필요하시면 말씀 주세요' 정도의 안내 문자를 보내 보세요. 그리고 식품 시설·위생 개선 관련 지원사업 공고가 있는지 K-Startup과 기업마당에서 찾아 보세요."}],"market":{"beef":"한국은 올해 1월부터 미국산 소고기 관세가 0%가 됐고, 호주산은 7월 말 안전장치 물량을 채워 연말까지 24% 관세가 적용됩니다. USDA 서울사무소는 올해 한국 소고기 수입이 약 60만 톤으로 2% 늘고, 국내 소 도축은 약 102만 두로 줄 것으로 전망했습니다.","pork":"유럽 돼지 가격은 9월 중순 기준 EU 평균 148펜스/kg(영국 환산)으로 약세입니다. 독일 147.6, 스페인 152.5, 덴마크 100.4펜스이고, 올해 상반기 EU 돼지고기 생산은 전년보다 1.8% 늘었습니다."},"news":[{"title":"한국 수입 소고기: 미국산 관세 0%, 호주산 안전장치 24% 적용","source":"MLA, Beef Central, Tridge, Seoulz 등 (검색 요약)","date":"2026년","summary":"한미 FTA 이행으로 미국산 소고기 관세가 올해 1월 1일부터 0%가 됐습니다. 호주산은 연간 안전장치 기준을 7월 말 역대 가장 이르게 채워 관세가 5.3%에서 24%로 올랐고 연말까지 유지됩니다. 수입업체들이 인상 전에 물량을 미리 들여와 올해 호주산 수입의 약 90%가 냉동이라고 합니다. 미국산 냉장육 구매가 유통업체와 식당에서 늘고 있습니다.","impact":"수입 소고기 견적에서 원산지별 관세 차이가 가격에 직접 반영됩니다. 호주산을 쓰는 거래처에는 미국산 대안을 함께 제안해 볼 수 있습니다."},{"title":"USDA 서울사무소 9월 보고: 한국 소고기 소비 둔화, 수입은 증가","source":"USDA FAS 서울 축산물 연례 보고서 (2026년 9월, 검색 요약)","date":"2026-09","summary":"물가 부담으로 소고기 소비는 둔화하지만 높은 국내 소고기 가격이 수입육 수요를 받치고 있습니다. 올해 한국 소 도축은 약 102만 두로 줄고, 수입은 1~6월 10% 늘었으며 연간 약 60만 톤(+2%)으로 전망됩니다.","impact":"국내산 공급이 줄어 수입육 수요가 유지되는 구조입니다. 수입육 품목 확대나 소분 상품 기획의 근거로 쓸 수 있습니다."},{"title":"EU 돼지 가격 약세 지속, 상반기 생산 1.8% 증가","source":"AHDB 유럽 돼지고기 시황 (9월 13일 기준, 검색 요약)","date":"2026-09-13 기준","summary":"EU 평균 도축 돼지 가격은 148.13펜스/kg(영국 단위 환산)으로 소폭 하락했고, 독일 147.63, 스페인 152.51, 덴마크 100.39펜스였습니다. 올해 상반기 EU 돼지고기 생산은 1,110만 톤으로 1.8% 늘었고 7월 새끼돼지 가격은 1년 전보다 약 40% 낮았습니다.","impact":"유럽산 수입 삼겹·목살 가격은 약세 기조라 구매 협상에 유리합니다. 다만 ASF 같은 질병 이슈와 환율 변수를 함께 보세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 관세 수치와 수입량 전망은 보도와 USDA 요약을 인용한 것이므로 거래 판단 전 원문을 확인하세요. 한국어 검색에서는 2026년 기사로 확인되는 한우·삼겹살 시세 자료를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-09","day":9,"ideas":[{"tag":"릴스","title":"'한우와 육우, 3초 구분법' 예약발행 릴스","body":"한글날 휴일에 올릴 영상을 미리 만들어 예약발행해 두세요. 후크는 '국산 소고기라고 다 한우가 아닙니다'이고, 한우는 한우 품종, 육우는 고기용으로 키운 젖소 수소 등이라는 한 줄 설명과 표시 방법을 보여 주면 됩니다."},{"tag":"스토어","title":"'한우 / 국내산 육우 / 수입' 배지 통일과 육우 대안 상품 기획","body":"모든 소고기 상품에 종류 배지를 같은 위치에 넣고 표기가 정확한지 점검하세요. 한우 공급이 줄어 가격이 높다는 전망이 있는 만큼, 가격 부담이 적은 국내산 육우나 수입육 소용량 상품을 함께 기획해 보면 선택지가 넓어집니다."},{"tag":"B2B 영업","title":"'한우+대안' 포트폴리오 제안서 한 장","body":"한우 도매가가 높은 수준이라는 전망을 근거로 거래처에 구이용은 한우, 국거리·불고기용은 육우나 수입육으로 나눈 구성을 제안해 보세요. 메뉴 원가를 낮추면서 한우 이미지를 지키는 방법으로 설명할 수 있습니다."},{"tag":"인사·HACCP","title":"한글날 기념 '한국어 고기 용어 카드' 만들기","body":"등심, 채끝, 사태, 한우, 육우, 원산지처럼 현장에서 자주 쓰는 단어를 그림과 쉬운 한국어, 모국어 병기로 정리한 카드를 만들어 보세요. 한글날과 맞춰 작업장에 붙이면 외국인 근로자 교육 자료로 오래 쓸 수 있습니다."},{"tag":"지원사업·마케팅","title":"지원사업 후보 1곳 요건 읽기와 한우데이(11/1) 소용량 구성 구상","body":"오늘 캘린더 항목대로 10월 2일에 모은 후보 중 한 곳의 신청 자격과 제출 서류를 읽어 보세요. 그리고 한우데이 이벤트는 가격 부담을 고려해 소용량이나 부위 조합 세트로 구상해 두면 좋습니다."}],"market":{"beef":"국내 한·육우 사육은 올해 2분기에 328만 9천 마리로 1년 전보다 4.9% 줄었고, 농촌경제연구원은 올해 한우 도축이 9.1% 줄어 거세우 도매가가 kg당 2만 원 안팎이 될 것으로 전망했습니다. 미국은 아르헨티나 쇠고기 수입 한도를 올렸지만 공급 부족으로 가격이 높게 유지된다는 정부 인식을 8월에 밝혔습니다.","pork":"2분기 가축동향조사에서 돼지는 어미돼지가 줄면서 모든 월령대에서 사육이 감소했다는 결과가 보도됐지만 정확한 마릿수는 확인하지 못했습니다. 유럽은 9월 중순 기준 돼지 가격 약세가 이어지고 있습니다."},"news":[{"title":"2분기 가축동향조사: 한·육우 328만 9천 마리, 1년 새 4.9% 감소","source":"국가데이터처 가축동향조사 (뉴시스, 다음 뉴스 등 검색 요약)","date":"2026-07-24 발표","summary":"6월 1일 기준 한·육우 사육은 328만 9천 마리로 전년 동기보다 17만 마리 줄었고, 가임 암소 감소가 원인으로 지목됐습니다. 돼지는 어미돼지가 줄어 모든 월령대에서 감소했고, 산란계와 육용계는 늘었습니다.","impact":"국내산 소·돼지 공급이 줄어드는 구조라 시세가 높게 유지될 가능성이 큽니다. 수입육과 육우 같은 대안 상품 확보가 거래처 유지에 도움이 됩니다."},{"title":"농촌경제연구원 전망: 한우 도축 9.1% 감소, 거세우 도매가 2만 원 안팎","source":"한국농촌경제연구원 2026 농업전망 (농민신문, 팜인사이트 등 검색 요약)","date":"2026년 1월 발표","summary":"올해 한우 도축은 약 86만 2천 마리로 전년보다 9.1% 줄고, 거세우 평균 도매가격은 kg당 2만 원 안팎으로 오를 것으로 전망됩니다. 다만 소비는 등심·안심·채끝 같은 고가 부위 위주로 부진할 가능성이 있고, 소비쿠폰과 할인행사 등에 따라 가격이 조정될 수 있다고 소개됩니다.","impact":"고가 구이용 부위 수요는 약하고 가격은 높은 구조입니다. 국거리·불고기용과 소용량 구성을 강화하는 판매 전략이 유리합니다."},{"title":"미국, 아르헨티나 소고기 수입 한도 확대·공급 부족 대응 지속","source":"백악관 대통령 문서(2026년 8월), 농업 매체 요약 (검색 요약)","date":"2026-02 및 2026-08","summary":"2월에 미국은 아르헨티나산 쇠고기 정육(분쇄용) 수입 한도를 연 2만 톤에서 10만 톤으로 늘렸고, 1~4월 아르헨티나산 수입은 전년보다 약 90% 증가했습니다. 8월 대통령 문서는 소고기 공급 감소와 수요 증가로 가격이 계속 높을 것이라며 추가 조치를 언급했습니다.","impact":"미국의 소고기 수입 확대는 세계 분쇄·가공용 원료 수요를 키웁니다. 수입 가공용 원료를 쓰는 거래처가 있다면 단가 변동을 점검하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 2026년 2분기 돼지 총 사육두수와 감소율은 확인하지 못했으니 국가데이터처 보도자료에서 확인하세요. 한우 가격 전망은 연초 전망이므로 최근 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-10","day":10,"ideas":[{"tag":"릴스","title":"'이력번호로 우리 고기 추적해 보기' 조회 화면 시연","body":"이력번호를 입력해 사육지와 도축장이 나오는 화면을 보여 주세요. 후크는 '이 고기가 어디서 왔는지 10초 만에 확인하는 법'입니다. 최근 명절 원산지 단속 소식이 있는 시기라 관심이 높습니다. 위반 업체를 비난하는 말투는 피하고 우리의 확인 방법을 보여 주는 쪽이 좋습니다."},{"tag":"스토어","title":"묶음상품 3종 구성안과 모든 상세페이지의 원산지·이력번호 표기 통일","body":"오늘 캘린더 항목입니다. 구이 세트, 국거리 세트, 불고기·수육 세트처럼 용도별 묶음 3종을 구상하고, 상세페이지마다 원산지, 종류(한우/육우/수입), 등급, 이력번호 조회 안내를 같은 자리에 넣으세요."},{"tag":"B2B 영업","title":"거래명세서에 원산지·이력번호를 병기한 '증빙 패키지' 제안","body":"식당과 판매점도 원산지 단속 대상이라 납품 서류에 원산지 증빙이 있으면 도움이 됩니다. 명세서에 원산지와 이력번호를 병기하고 요청 시 입고 기록을 제공하는 서비스를 영업 포인트로 안내해 보세요."},{"tag":"인사·HACCP","title":"입고 이력번호를 출고 제품과 연결하는 표와 라벨 혼입 방지 교육","body":"입고 이력번호, 소분 일자, 출고 거래처를 한 줄로 연결하는 표를 만들어 두세요. 소분 때 국산과 수입산 라벨이 섞이지 않도록 색 구분 라벨과 확인 절차를 외국인·알바 근로자 교육에 포함하면 원산지 위반 위험을 크게 줄일 수 있습니다."},{"tag":"지원사업·마케팅","title":"다음 주 릴스 촬영 콘티와 ASF 관련 거래처 안내 문구","body":"오늘 캘린더 항목대로 다음 주 릴스 촬영 콘티를 정리하세요. 그리고 국내 ASF 소식에 거래처가 불안해할 때 쓸 안내 문구(원료 이력번호 확인, 입고 검수 기준, 방역 공지 확인 방법)를 미리 준비해 두면 좋습니다."}],"market":{"beef":"추석 원산지 특별점검에서 외국산 쇠고기를 한우로 속여 판 업체가 적발된 사례가 보도됐습니다. 국내 한·육우 사육은 올해 2분기에 1년 전보다 4.9% 줄어 공급이 빠듯한 구조이고, 이런 시기에 원산지와 종류 표기가 더 중요해집니다.","pork":"국내 ASF는 올해 1월 16일 첫 발생 이후 1분기에만 24건이 확진되어 2019년 이후 누적의 약 31%가 집중됐고, 전남·경남에서 비접경 지역 첫 사례가 나왔다는 보도가 있습니다. 10월에는 전국 양돈농장 ASF·PRRS 일제검사가 진행 중이라는 소식이 있습니다."},"news":[{"title":"농관원 추석 원산지 특별점검: 256곳 적발, 돼지고기가 위반 품목 2위","source":"중도일보, 중부뉴스통신, 문화투데이 등 (농림부 국립농산물품질관리원 발표 보도 요약)","date":"2026-10-01 전후 보도","summary":"농관원은 17일 동안 1만 3,251곳을 점검해 256곳을 적발했습니다. 거짓 표시 104곳은 형사입건하고, 미표시 152곳에는 과태료 3,587만 원을 부과할 예정입니다. 품목별로 배추김치가 가장 많고 돼지고기가 2위였으며, 캐나다산 삼겹살·목살을 국내산으로 표시한 식육판매점과 외국산 쇠고기를 한우로 속여 판 업체가 적발됐습니다.","impact":"원산지 표시는 단속 강도가 높고 처벌이 무겁습니다. 우리 상품과 거래처 납품 서류의 원산지·종류 표기를 이번 주에 한 번 더 점검하세요."},{"title":"국내 ASF 올해 1분기 24건 확진, 비접경 지역으로 확산","source":"업계 칼럼(축산정보뉴스), 머니투데이 등 (검색 요약)","date":"2026년 1~2월 상황 기사","summary":"올해 1월 16일 첫 발생 이후 1분기에만 24건이 확진되어 2019년 이후 누적 80건 중 31.2%가 올해 1분기에 몰렸다고 합니다. 전남과 경남에서 비접경 지역 첫 확진이 나왔고 2월 9일 전남 나주 양돈농가에서도 확인됐습니다.","impact":"국내산 돼지고기 공급과 시세가 흔들릴 수 있습니다. 최신 발생 현황은 농림축산식품부 공지로 먼저 확인하세요."},{"title":"정읍시 10월부터 가축방역상황실 가동, 양돈농가 127곳 정밀 검사","source":"투데이안 (정읍시 발표 보도)","date":"2026-10-06","summary":"정읍시가 10월부터 내년 2월까지 가축방역상황실을 운영하고, 관내 127개 양돈농가의 폐사축과 액비 시료를 채취해 정밀 검사하겠다고 밝혔습니다. 가을과 겨울철 ASF 재발 방지를 위한 선제 조치입니다.","impact":"겨울철에 ASF 위험이 커지는 만큼 지자체 방역 강화가 이어질 전망입니다. 국산 돼지고기 납품 거래처에는 입고 검수와 이력번호 확인 체계를 알려 두세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 원산지 단속 건수와 ASF 발생 건수는 보도를 인용한 것이므로 최신본은 농관원과 농림축산식품부 공지로 확인하세요. 최근 한우·삼겹살 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-11","day":11,"ideas":[{"tag":"릴스","title":"'이번 주 삼겹살 시세 한 컷' 고정 코너 시작","body":"월요일마다 올리는 10초짜리 시세 영상을 시작해 보세요. 숫자 한 줄(이번 주 평균, 전주 대비, 전년 대비)과 한마디 해설이면 충분합니다. 오늘 카드의 시세 보는 법이 그대로 콘텐츠가 되고, 거래처에게는 전문가 이미지를 쌓는 가장 값싼 방법입니다."},{"tag":"스토어","title":"10월 돼지 시세 하락 전망에 맞춘 삼겹·목살 프로모션 타이밍 점검","body":"업계는 10월에 출하 돼지가 늘어 도매가가 9월보다 내려갈 것으로 보고 있습니다. 재고 단가가 높은 상품과 새로 들어올 단가가 낮은 상품을 구분해 프로모션 시점을 정해 보세요. 재고가 쌓이기 전에 소용량 세트로 먼저 회전시키는 방법이 안전합니다."},{"tag":"B2B 영업","title":"'시세 연동 단가 조항' 재계약 제안서","body":"돼지 도매가가 9월에는 6천 원대 후반이었다가 10월에는 5천 원대로 내려갈 것이라는 전망처럼 한 달 사이에도 크게 움직입니다. 고정 단가 거래처에는 분기별 단가 조정이나 시세 연동 조항을 제안하는 자료를 준비해 보세요. 오르내림을 서로 나누는 구조가 장기 거래에 유리합니다."},{"tag":"인사·HACCP","title":"월요일 2분 '이번 주 재고·시세 공유' 시간 만들기","body":"직원과 알바 근로자에게 이번 주 주력 품목 재고와 시세 변화를 2분만 공유하는 시간을 정해 보세요. 오래된 재고부터 먼저 소분·출고하는 선입선출 원칙이 왜 중요한지 숫자로 이해시킬 수 있고, 냉동창고 재고 기록의 정확도도 올라갑니다."},{"tag":"지원사업·마케팅","title":"일요일 15분 '일·주·전년 시세 메모표' 만들기와 세계 육류 가격 한 줄 문자","body":"오늘 캘린더 항목(자료 정리)으로 삼겹·목살·한우 등심·앞다리의 일, 주, 전년 대비를 적는 표를 만드세요. 그리고 FAO 육류 가격 지수가 9월에 1.1% 내렸다는 소식을 '세계 육류 가격은 소폭 하락' 한 줄 문자로 거래처에 보낼 수도 있습니다."}],"market":{"beef":"FAO 소고기(우육) 가격은 9월에 거의 변동이 없었습니다. 국내 한우는 사육과 도축이 줄어 도매가가 높은 수준이라는 전망이 이어지지만, 이번 주 한우 도매가 자료는 확인하지 못했습니다.","pork":"국내 돼지 도매가는 42주차(10월 7일 기준) 평균 6,116원으로 전주보다 2.6%, 전년보다 4.0% 높았지만, 업계는 10월 출하 증가로 5천 원대 후반~6천 원 수준으로 내려갈 것으로 봅니다. 세계적으로는 FAO 돼지고기 가격이 주요 수출국의 공급 풍부로 9월에 하락했습니다."},"news":[{"title":"FAO 9월 육류 가격 지수 1.1% 하락, 돼지·닭고기가 이끌어","source":"FAO 식량가격지수 9월분(10월 2일 발표) 보도: Pig333, PotatoPro, IndexBox (검색 요약)","date":"2026-10-02","summary":"FAO 육류 가격 지수는 9월 평균 127.9포인트로 전월 대비 1.5포인트(1.1%) 내렸고 1년 전과는 비슷한 수준입니다. 브라질의 풍부한 닭고기 수출 물량과 EU의 수입 수요 약화로 닭고기가, 주요 수출국의 공급 풍부로 돼지고기가 내렸고, 소고기와 양고기는 보합이었습니다. 전체 식량가격지수는 136.0으로 2022년 11월 이후 최고입니다.","impact":"세계 돼지고기 가격 하락은 수입 삼겹·목살 단가에 하방 압력입니다. 소고기는 보합이라 수입 소고기 단가 협상은 환율과 관세 변수가 더 중요합니다."},{"title":"국내 돼지 도매가 42주차 6,116원, 10월은 '5천 원대 후반' 전망","source":"돼지와사람(양돈 전문 매체) 주간 전광판 및 10월 전망 기사 (검색 요약)","date":"2026-10-07 기준","summary":"42주차 평균 도매가는 6,116원으로 전주 대비 2.6%, 전년 대비 4.0% 올랐습니다. 9월 평균은 6,686원이었고, 10월에는 출하 가능 돼지가 늘어 가격 하락 압력이 크며 협회는 10월 도매가를 5,800~6,000원으로 전망했다고 합니다. 국내산 냉장 삼겹살 소비자가격은 100g당 2,979원으로 전월보다 올랐습니다.","impact":"도매가 하락은 소비자가격에 시차를 두고 반영됩니다. 재고 단가와 신규 매입 단가 차이를 주 단위로 점검해 판매가 조정 시점을 정하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 국내 돼지 도매가의 단위(지육 kg당 가격으로 보임)는 원문 확인이 필요합니다. 이번 주 한우 도매가는 2026년 10월 자료를 찾지 못했으니 축산유통정보(ekapepia.com)의 한우 단계별 가격에서 직접 확인하세요."},{"date":"2026-10-12","day":12,"ideas":[{"tag":"릴스","title":"'목살 vs 앞다리살 굽기 차이'에 '냉장 해동 하루' 팁 붙이기","body":"오늘 캘린더 항목에 오늘 카드 내용을 더해 보세요. 두 부위를 같은 불에 구워 육즙과 식감 차이를 보여 주고, 마지막 3초에 '냉동육은 냉장고에서 하루 천천히 해동하면 육즙이 살아납니다' 자막을 넣으면 한 영상에서 두 가지 정보를 줄 수 있습니다."},{"tag":"스토어","title":"소 부위 지도 카드뉴스와 상품 상세페이지 '해동·보관 아이콘' 추가","body":"오늘 캘린더 항목인 소 부위 지도 카드뉴스를 만들고, 냉동 상품 상세페이지 맨 아래에 '냉장 해동 12~24시간, 해동 후 재냉동 금지' 같은 아이콘 안내를 넣어 보세요. 해동 실수로 인한 맛 불만과 문의를 줄일 수 있습니다."},{"tag":"B2B 영업","title":"'냉동 vs 냉장 납품 선택 가이드' 한 장","body":"거래처의 소비 속도에 따라 냉장은 회전이 빠른 곳에, 냉동은 재고 보관 기간이 긴 곳에 권하는 기준을 한 장으로 정리해 보세요. 포장 단위(소분 규격)까지 제안하면 단순 단가 대화에서 벗어나 맞춤 납품 제안이 됩니다."},{"tag":"인사·HACCP","title":"냉동창고 3곳 온도 기록 점검과 전기요금 시간대 확인","body":"창고별 온도 기록과 문 열림 시간을 점검하고, 산업용 전기요금이 올해 낮에는 내리고 저녁과 밤에는 오르는 시간대별 체계로 바뀌었다는 보도가 있으니 우리 계약종별에서 어떻게 적용되는지 한전 공지나 고지서로 확인해 보세요. 24시간 가동하는 냉동창고는 야간 요금 영향이 클 수 있습니다."},{"tag":"지원사업·마케팅","title":"에너지 절감·냉동설비 관련 지원사업 공고 확인과 거래처 시세 한 줄","body":"지원사업 후보 목록에서 고효율 냉동·냉장 설비나 에너지 절감 관련 공고가 있는지 K-Startup과 기업마당에서 찾아 보세요. 거래처 문자에는 '미국 냉동 돼지고기 재고가 1년 전보다 12% 많다는 USDA 자료가 나왔습니다' 같은 시장 소식을 한 줄로 넣을 수 있습니다."}],"market":{"beef":"미국 냉동 소고기 재고는 8월 말 기준 4억 710만 파운드로 1년 전보다 5% 많았습니다. EU-메르코수르 협정은 5월 1일부터 잠정 적용 중이고, 연 9만 9천 톤(EU 소고기 생산의 약 1.5%)의 저율 관세 쿼터가 있으나 쿼터 배분을 두고 메르코수르 내부 이견이 있다는 보도가 있습니다.","pork":"미국 냉동 돼지고기 재고는 8월 말 1년 전보다 12% 많았고 삼겹살(포크벨리) 재고는 7월보다 35% 줄었습니다. 재고가 많아 미국산 돼지고기 수출 가격에는 부담 요인입니다."},"news":[{"title":"미국 냉동 육류 재고 1년 전보다 8% 증가, 냉동 돼지고기는 12% 증가","source":"USDA 냉동 재고 보고서(9월 25일 발표, 8월 31일 기준)를 요약한 American Ag Network 기사","date":"2026-09-25 발표 (기사 2026-09-28)","summary":"냉동 육류 총재고는 8억 6,210만 파운드로 1년 전보다 8%, 전월보다 1% 많았습니다. 소고기는 4억 710만 파운드로 5% 늘었고 뼈 없는 부위가 증가를 이끌었습니다. 돼지고기는 1년 전보다 12% 많았고 삼겹살(포크벨리) 재고는 7월보다 35% 줄고 1년 전보다 1% 적었습니다.","impact":"미국의 냉동 돼지고기 재고가 많아 수입 냉동 돼지고기 가격에 하방 압력이 있을 수 있습니다. 반면 삼겹살은 재고가 빠르게 줄어 가격이 지지될 수 있습니다."},{"title":"산업용 전기요금 계시별 개편: 낮 요금 인하, 저녁·밤 요금 인상","source":"서울신문, 정책브리핑(korea.kr), 기후에너지환경부 발표 보도 (검색 요약)","date":"2026-03 발표, 4월 16일 적용 (유예 기업은 10월 1일부터)","summary":"산업용(을) 전기요금의 최대 부하 요금이 여름·겨울철 16.9원, 봄·가을철 13.2원 내려가는 대신 저녁과 밤 시간 요금은 오르는 계시별 개편안이 적용됐습니다. 적용 유예를 신청한 기업은 10월 1일부터 개편안이 적용된다고 보도됐습니다. 4분기 전기요금은 동결이라는 블로그 글이 있으나 공식 확인이 필요합니다.","impact":"냉동창고처럼 24시간 가동하는 설비는 시간대별 요금 구조를 파악해 가동 패턴과 비용을 점검해야 합니다. 우리 계약종별에 해당하는지는 한전 고지서로 확인하세요."},{"title":"EU-메르코수르 협정 잠정 적용, 소고기 쿼터 배분 이견과 EU의 브라질 육류 수입 중단","source":"Rio Times, MercoPress, Agriland 등 (검색 요약)","date":"2026년 5월 적용, 9월 보도 포함 (최신 상황 확인 필요)","summary":"협정은 5월 1일부터 잠정 적용 중이며 메르코수르산 소고기 9만 9천 톤에 7.5% 관세를 적용하는 쿼터를 두고 있습니다. 이는 EU 소고기 생산의 약 1.5%입니다. 쿼터를 나라별로 어떻게 나눌지 메르코수르 내부 이견이 있고, 9월에는 EU가 식품안전 문제로 브라질산 육류 수입을 중단했다는 보도가 있으나 해제 여부는 확인하지 못했습니다.","impact":"브라질산 물량이 EU로 가기 어려워지면 아시아 등 다른 시장 쪽으로 향할 수 있습니다. 수입 소고기 가격 경쟁 구도에 영향을 줄 수 있어 소식을 계속 확인하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 전기요금 항목은 우리 사업장의 계약종별과 적용 시점이 다를 수 있으니 한전 고지서나 한전 공지로 확인하세요. EU의 브라질산 육류 수입 중단 여부는 확인하지 못했습니다. 최근 한우·삼겹살 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-13","day":13,"ideas":[{"tag":"릴스","title":"냉동창고 선입선출 정리와 '숙성일 라벨' 보여 주기","body":"오늘 캘린더 항목인 입고 정리 영상에 오늘 카드를 더해 보세요. 박스마다 입고일과 소분일, 숙성 시작일 라벨을 붙이는 장면을 보여 주고 '오래된 것부터 나가는 창고가 신선한 고기를 만듭니다'로 마무리하면 위생 관리 신뢰도와 전문성을 함께 보여 줄 수 있습니다."},{"tag":"스토어","title":"웻에이징 소용량 테스트 상품과 숙성 상품 원가 계산","body":"숙성 상품을 팔기 전에 수율 손실, 보관 공간 비용, 위생 관리 비용을 먼저 계산해 보세요. 진공 포장 웻에이징은 수분 손실이 적어 소용량 테스트로 시작하기 좋습니다. 숙성 일수 표기는 표시 규정을 확인한 뒤 정확한 날짜 기준으로만 적으세요."},{"tag":"B2B 영업","title":"고깃집용 '숙성일 라벨과 권장 소비 기간' 안내 카드","body":"숙성 메뉴를 하는 식당에는 납품 박스에 숙성 시작일과 권장 소비 기간을 함께 적어 주는 서비스를 제안해 보세요. 거래처는 메뉴 설명이 쉬워지고 우리는 재고 회전을 예측하기 쉬워집니다."},{"tag":"인사·HACCP","title":"창고 온도 기록 사진 점검과 숙성 시작·종료 기록 양식 만들기","body":"오늘 캘린더 항목대로 3개 창고의 온도 기록 사진을 확인하세요. 숙성을 시작할 경우를 대비해 시작일, 종료일, 온도, 담당자를 적는 한 장짜리 양식도 미리 만들어 두면 HACCP 기록과 바로 연결할 수 있습니다. 외국인·알바 근로자에게는 사진으로 설명하세요."},{"tag":"지원사업·마케팅","title":"사업계획서 목차 초안(10/16)을 위한 회사 현황 자료 모으기와 시장 소식 한 줄","body":"목요일에 쓸 사업계획서 목차 초안을 위해 매출 추이, 인력, 설비(냉동창고 3곳, 차량 5대), 인증 현황을 한 장으로 모아 보세요. 거래처 문자에는 '미국은 소고기 가격이 크게 올라 소비 수량이 줄고 있습니다' 같은 시장 소식을 한 줄로 넣을 수 있습니다."}],"market":{"beef":"국내 한우는 추석 성수기 거세우 도매가가 kg당 2만 4천~2만 5천 원으로 전망돼 지난해 같은 기간 2만 1천 원보다 높았고, 1+ 이상 비중이 60%대로 올랐다는 보도가 있습니다. 미국은 소고기 가격이 사상 최고 수준이지만 판매 금액은 8% 늘고 판매 수량은 4% 줄어 수요가 둔화되는 모습입니다.","pork":"국내 돼지 도매가는 42주차(10월 7일 기준) 6,116원이고, 업계는 10월 출하 증가로 가격이 5천 원대 후반~6천 원대로 내려갈 것으로 전망합니다. 세계 돼지고기 가격은 9월에 FAO 지수 기준으로 하락했습니다."},"news":[{"title":"추석 앞 한우 도매가 2만 4천 원대, 1+ 이상 비중 60%대로 상승","source":"머니투데이(KREI 축산관측 9월호 인용)","date":"2026-09-04","summary":"한국농촌경제연구원 축산관측 9월호는 추석 성수기 거세우 도매가격을 kg당 2만 4천~2만 5천 원으로 전망했습니다. 지난해 같은 기간 2만 1,004원, 평년 2만 1,263원보다 높고, 1+ 이상 고등급 출하 비중이 60%대로 올랐다고 합니다.","impact":"명절 이후 수요가 꺼지면 도매가가 조정될 수 있으니 10월 시세를 ekapepia에서 직접 확인하세요. 고등급 출하 비중이 높다는 것은 등급 설명 역량이 영업에 도움이 된다는 뜻입니다."},{"title":"미국 소고기 소매가 사상 최고 수준, 판매 금액 8% 증가·수량 4% 감소","source":"USAFacts(BLS 평균가격 인용), Meatingplace, AP 보도 요약 (검색 요약)","date":"2026-07 기준 (최신 월 확인 필요)","summary":"미국의 7월 다진 소고기 평균 가격은 파운드당 6.89달러였고 소고기·송아지고기 소비자물가는 1년 전보다 9.4% 올랐습니다. 소고기 판매 금액은 8% 늘었지만 수량은 4% 줄어 소비자가 조금 덜 사는 모습이라고 합니다. USDA는 올해 소고기 가격 상승률을 12.1%로 전망했다고 보도됐습니다.","impact":"높은 가격이 수요를 줄이는 현상은 한국 시장에도 시사점이 있습니다. 소용량·부위 조합 상품과 가격 대비 만족도를 설명하는 영업이 유리할 수 있습니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 이번 주(10월 둘째 주) 한우 도매가는 확인하지 못했으니 축산유통정보(ekapepia.com)의 한우 단계별 가격에서 직접 확인하세요. 숙성 시장 동향 관련 기사는 검색되지 않았습니다."},{"date":"2026-10-14","day":14,"ideas":[{"tag":"릴스","title":"'2주 동안 배운 소·돼지고기, 30초 요약' 복습 릴스","body":"오늘이 2주 복습일이니 배운 내용 중 가장 놀라웠던 세 가지를 30초로 정리해 보세요. 예를 들어 '등심이 부드러운 이유', '1++ 우둔에 마블링이 없는 이유', '수율 80%면 실제 원가는 12,500원'입니다. 지식이 쌓이는 과정을 보여 주는 것 자체가 전문가 이미지를 만듭니다."},{"tag":"스토어","title":"소용량 체험 세트(재고 회전용)와 재구매 쿠폰 문구","body":"오늘 캘린더 항목입니다. 구이 부위 3종 비교 세트(예: 등심·채끝·목심)나 돼지 3종 비교 세트(삼겹·목살·항정)처럼 '맛 비교' 컨셉의 소용량 세트를 구상하세요. 재구매 쿠폰 문구는 '지난번 마음에 드셨던 부위, 이번엔 한 단계 다른 부위로'처럼 학습 카드 내용을 연결하면 좋습니다."},{"tag":"B2B 영업","title":"고객 질문 FAQ 5개 응대 매뉴얼 완성","body":"카드 14번 숙제였던 '가장 자주 받는 질문 5개'의 답을 지난 2주 내용으로 써 보세요. 예: 이 부위는 구워도 되나요, 1++가 더 맛있나요, 한우와 육우는 뭐가 다른가요. 거래처 영업용 한 장으로 정리해 두면 신입 직원 교육에도 쓸 수 있습니다."},{"tag":"인사·HACCP","title":"직원·알바 대상 5분 복습 퀴즈 시간","body":"2주 학습 카드 중 퀴즈 3개를 골라 쉬운 한국어와 그림으로 직원 교육 시간에 내 보세요. 외국인·알바 근로자도 함께 참여하게 하고 일시와 참석자를 적어 두면 교육 기록으로 남길 수 있습니다."},{"tag":"지원사업·마케팅","title":"수입육 공급처 다변화 메모와 사업계획서 목차 초안 준비","body":"오늘 뉴스처럼 브라질 소고기의 중국 수출이 크게 줄고 EU가 브라질산 수입을 막는 등 수입육 공급 지형이 바뀌고 있습니다. 우리 거래처가 쓰는 수입육 원산지를 정리한 메모를 만들어 두고, 목요일 사업계획서 목차 초안에 시장 환경 항목으로 활용하세요."}],"market":{"beef":"브라질 소고기 수출은 8월에 1년 전보다 22.2% 줄어든 23만 3,500톤이었고, 중국 향 물량이 약 90% 줄었다고 ABIEC가 밝혔습니다. 1~8월 누적은 약 220만 톤으로 5.3% 늘었습니다. EU는 브라질을 동물성 식품 승인 공급국에서 제외했고 9월 3일 발효로 전해졌습니다.","pork":"국내 돼지 도매가는 10월 7일 기준 6,116원으로 연초 한국농촌경제연구원 전망(올해 평균 5,500~5,700원)보다 높습니다. 브라질은 닭고기 수출이 9월에 500.3천 톤으로 3.7% 늘었지만 돼지고기 수출은 11% 감소했다는 보도가 있습니다(세부 수치는 확인하지 못했습니다)."},"news":[{"title":"브라질 8월 소고기 수출 22.2% 감소, 중국 향 약 90% 급감","source":"ABIEC 자료를 인용한 보도, USDA FAS 브라질 보고서 (검색 요약)","date":"2026-08 통계 (9월 보도)","summary":"브라질 소고기 수출이 8월에 23만 3,500톤으로 1년 전보다 22.2% 줄었고, 중국이 부여한 저율 관세 쿼터를 소진하면서 중국 향 물량이 약 90% 줄었습니다. 1~8월 누적 수출량은 약 220만 톤으로 5.3% 늘고 수출액은 127억 9천만 달러로 21.7% 늘었습니다. EU는 브라질을 승인 공급국 목록에서 제외하는 조치를 투표로 확정해 9월 3일 발효로 전해졌고, USDA는 9월 9일 기준 지역화 수출 합의가 이뤄지지 않았다고 밝혔습니다.","impact":"브라질산 물량이 갈 곳을 찾으면 아시아 시장의 가격 경쟁이 달라질 수 있습니다. 한국의 브라질산 소고기 수입 허용 범위는 별도로 확인하세요."},{"title":"연초 농경연 전망 vs 현재: 돼지 도매가 5,500~5,700원 전망, 실제 10월 6,116원","source":"한국농촌경제연구원 2026 농업전망(1월), 돼지와사람 주간 전광판(10월 7일) (검색 요약 비교)","date":"2026-01 전망 / 2026-10-07 실제","summary":"농경연은 올해 돼지 도매가가 공급 증가로 전년보다 낮은 kg당 5,500~5,700원, 도축은 1.5% 안팎 늘어난다고 전망했습니다. 한우는 거세우 평균 2만 원 안팎, 국내산 소고기 생산은 7.9% 감소로 전망했습니다. 그러나 10월 7일 기준 돼지 도매가는 6,116원으로 전망보다 높은 수준입니다.","impact":"연초 전망보다 가격이 높게 형성되는 이유(질병, 소비 등)를 따져 보는 것이 시세 판단의 연습 문제입니다. 전망치는 참고만 하고 실시간 시세로 판단하세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 브라질 9월 소고기·돼지고기 수출 수치는 확인하지 못했습니다. 농경연 10월 축산관측 자체는 검색되지 않았으니 농업관측센터에서 최신 보고서를 확인하세요. 최근 한우 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-15","day":15,"ideas":[{"tag":"릴스","title":"'Prime·Choice·Select, 마블링은 이만큼 달라요' 3장 비교","body":"오늘 카드의 등급 이야기를 마블링 사진 세 장으로 보여 주세요. 후크는 '미국 소고기 등급, 1분이면 이해합니다'입니다. 마지막 자막에 '등급은 등심 단면 기준이라 부위마다 다릅니다'를 넣으면 오해를 막는 전문가형 영상이 됩니다."},{"tag":"스토어","title":"수입육 상세페이지 표기 템플릿: 원산지·등급·부위·냉장/냉동 한 줄","body":"'미국산 | USDA Choice | 갈비 | 냉동'처럼 네 가지를 같은 자리에 같은 형식으로 적는 템플릿을 만들어 모든 수입육 상품에 적용하세요. 한우와 혼동될 여지를 없애고 문의도 줄어듭니다."},{"tag":"B2B 영업","title":"미수금 30일 이상 거래처 확인 통화와, 호주산 쓰는 신규 식당 10곳에 미국산 갈비·차돌 제안","body":"오늘 캘린더 항목입니다. 먼저 미수금 거래처 통화를 마치고, 신규 식당 리스트를 만들 때 호주산을 쓰는 곳을 우선 고르세요. 호주산에 높은 관세가 적용 중인 시기라 미국산 갈비·차돌박이 대체 견적이 좋은 대화 소재가 됩니다."},{"tag":"인사·HACCP","title":"수입육 입고 검수 항목과 영문 라벨 읽기 교육","body":"수입 소고기 입고 시 원산지, 소비기한, 냉장·냉동 구분, 온도, 수입 관련 서류 보관 여부를 확인하는 항목을 검수표에 넣으세요. Prime, Choice, Select, Yield Grade 같은 영문 표기를 그림과 함께 읽는 5분 교육을 외국인·알바 근로자와 함께 하면 입고 실수가 줄어듭니다."},{"tag":"지원사업·마케팅","title":"내일 사업계획서 목차 초안을 위한 '시장 환경' 근거 메모","body":"내일 캘린더 항목인 사업계획서 목차 초안에 쓸 시장 환경 근거를 오늘 메모해 두세요. 예: 국내 한·육우 사육 4.9% 감소, 올해 한국의 미국산 소고기 관세 0%와 호주산 안전장치 발동, 8월 미국산 소고기 한국 수출 14% 증가. 출처와 발표 시점을 함께 적어 두세요."}],"market":{"beef":"미국 소고기의 한국 수출은 8월에 19,195톤으로 1년 전보다 14% 늘어 1월 이후 처음 증가했고 금액은 2억 100만 달러였습니다. 호주산이 한국의 안전장치 기준을 넘으면서 한국 수입업체가 미국산으로 옮겨 간 영향으로 설명됩니다. 1~8월 누적은 물량 8% 감소, 금액 3% 감소입니다.","pork":"중국 돼지 가격은 4월 저점 이후 25% 넘게 반등해 9월 초 전국 시세가 kg당 약 11.04위안으로 보도됐고, 중국은 어미돼지 수를 줄이는 정책을 이어가고 있습니다. 미국산 돼지고기 수출은 8월에 소고기와 달리 부진했다는 보도가 있습니다."},"news":[{"title":"8월 미국 소고기 한국 수출 14% 증가, 호주산 안전장치 영향","source":"USMEF 8월 수출 실적(10월 7일 발표)을 요약한 Oklahoma Farm Report, American Ag Network 등","date":"2026-10-07","summary":"한국은 8월에 미국산 소고기 19,195톤을 수입해 1년 전보다 14% 늘었고, 1월 이후 처음으로 전년을 웃돌았습니다. 금액은 20% 늘어난 2억 100만 달러로 올해 두 번째로 높았습니다. 호주산이 7월 말 한국의 안전장치 기준을 넘으면서 미국산 기회가 커졌다고 설명하며, 1~8월 누적은 물량 8%, 금액 3% 감소입니다. 같은 보도에서 미국산 돼지고기 수출은 8월에 부진했습니다.","impact":"한국 수입 소고기 시장에서 미국산 존재감이 다시 커지는 중입니다. 미국산 갈비·차돌 거래 제안과 재고 확보 시점을 검토해 보세요."},{"title":"중국 돼지 가격 4월 저점에서 25% 반등, 어미돼지 감축 정책 지속","source":"BigGo Finance, Futu News, Longbridge 등 중국 양돈 기업·시황 보도 (검색 요약)","date":"2026-09 보도 (10월 시세는 미확인)","summary":"중국 돼지 가격은 4월에 약 9위안/kg 근처의 10년 만의 저점(보도마다 수치 상이)을 찍은 뒤 25% 넘게 올라 9월 초 약 11.04위안/kg으로 보도됐습니다. 어미돼지는 전국 3,780만 두로 정상 재고 목표 3,750만 두를 약간 웃돌고, 정부는 올해 3월 목표를 3,650만 두로 잡았습니다. 대형 양돈 기업 무위안은 9월에 돼지 642만 두를 팔았고 평균 가격은 1년 전보다 19.6% 낮았으며 상반기에는 60억 8천만 위안 순손실을 냈습니다.","impact":"중국 돼지 가격이 회복되면 세계 돼지고기 가격 하방이 완만해질 수 있습니다. 수입 돼지고기 가격이 앞으로도 크게 내리기는 어렵다는 신호로 볼 수 있습니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 중국 돼지 가격 저점 수치는 보도마다 달라 정확한 값은 확인하지 못했습니다. 한국의 미국산 소고기 수입 요건과 관세율은 최신 공고로 확인하세요. 국내 한우·삼겹살 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-16","day":16,"ideas":[{"tag":"릴스","title":"'풀 먹은 소와 곡물 먹은 소, 지방 색이 다른 이유' 비교 릴스","body":"노란빛 지방과 흰 지방의 고기를 나란히 보여 주고 '풀의 색소가 지방에 쌓여서'라는 한 줄로 설명하세요. 오늘 카드 내용이 그대로 15초 영상이 됩니다. 후크는 '같은 호주산인데 지방 색이 다른 이유'가 좋습니다."},{"tag":"스토어","title":"호주산 상품에 '그라스페드/그레인페드' 표기와 불고기 썰기 팁 넣기","body":"상세페이지에 풀 먹은 소인지 곡물 비육인지, 부위, 냉동 여부를 한 줄로 적고 '결 반대 방향으로 얇게 썰어 양념하세요' 같은 조리 팁을 붙여 보세요. 호주산 우둔·설도의 퍽퍽하다는 후기를 줄일 수 있습니다."},{"tag":"B2B 영업","title":"수입육 판매 증가 소식과 함께 보내는 '호주산·미국산·육우 대안 견적표'","body":"한국에서 수입육 판매가 늘고 있다는 보도가 나오는 시점이라 거래처 대화를 열기 좋습니다. 호주산 관세가 높은 시기에 같은 용도의 미국산과 국내산 육우 대안을 한 장에 비교한 견적표를 만들어 보세요. 견적 유효기간 문구도 함께 넣으세요."},{"tag":"인사·HACCP","title":"알바 근로계약서 갱신 대상 확인과 계약 만료일 표 업데이트","body":"오늘 캘린더 항목입니다. 알바 근로자의 계약 만료일과 갱신 여부를 표로 정리하고 만료 30일 전 알림을 휴대폰에 넣어 두세요. 외국인 근로자 표와 같은 서식으로 관리하면 놓치는 일이 줄어듭니다."},{"tag":"지원사업·마케팅","title":"사업계획서 목차 초안에 넣을 '시장 환경' 근거 정리","body":"오늘 캘린더 항목입니다. 시장 환경 항목에는 국내 한·육우 사육 감소, 한국의 돼지고기 수입 증가(1~7월 14.3%), 수입 소고기 안전장치 변화 같은 근거를 출처와 발표 시점과 함께 적으세요. 회사 현황 항목은 냉동창고 3곳, 차량 5대, 직원 10명 정보를 한 장으로 모아 두면 됩니다."}],"market":{"beef":"호주산 소고기의 9월 전체 수출은 13만 2,146톤으로 1년 전보다 5% 줄었고, 중국은 7,778톤으로 62% 줄어 한국과 일본에 밀려 4위가 됐다는 보도가 있습니다. 미국 향은 4% 늘어 올해 호주 수출의 31.3%를 차지합니다. 한국 향으로 보이는 9월 물량은 17,927톤으로 1년 전보다 16% 적었다고 합니다.","pork":"한국의 돼지고기 수입은 1~7월 33만 555톤으로 1년 전보다 14.3% 늘었고 냉동이 대부분입니다. 한우 가격이 오르면서 수입육 판매가 늘고 있다는 보도가 있고, USDA는 일본과 한국이 상반기에 공급이 넉넉해 재고가 많아 하반기 수입 속도가 둔화될 것으로 봅니다."},"news":[{"title":"호주 소고기 9월 수출 13만 톤, 중국 62% 급감·한국 물량은 6월 정점 대비 크게 감소","source":"Stock Journal, The Land 등 호주 매체 (호주 농림수산부 통계 인용, 검색 요약)","date":"2026-10 중순 보도","summary":"9월 호주 소고기 총수출은 13만 2,146톤으로 1년 전보다 5% 줄었지만 5년 평균보다는 32% 많았습니다. 미국은 4% 늘었고 중국은 55% 안전장치 관세 때문에 7,778톤으로 62% 줄어 한국과 일본 다음 4위로 내려갔습니다. 한국 향으로 보이는 물량은 17,927톤으로 6월 정점 3만 2,599톤보다 크게 줄었는데, 한국의 안전장치로 관세가 24%가 된 영향으로 설명됩니다(보도가 시장을 명시하지 않아 확인 필요).","impact":"호주산의 한국 수입이 위축되면서 호주산 재고 단가가 높게 유지될 수 있습니다. 호주산 재고가 있다면 소진 계획과 대체 원료 확보 시점을 점검하세요."},{"title":"한국 돼지고기 수입 1~7월 14.3% 증가, 한우 값 상승에 수입육 판매 확대","source":"서울경제 영문판(9월 16·17일 보도), 한국 수입 통계 인용 기사 (검색 요약)","date":"2026-09-16 ~ 09-17","summary":"한국의 돼지고기 수입은 1~7월 33만 555톤으로 1년 전보다 14.3% 늘었고 이 중 냉동이 30만 5,388톤입니다. 이마트의 수입 돼지고기 판매가 32% 늘었다는 보도와 한우 가격 상승으로 수입육 판매가 확대된다는 기사 제목이 확인됩니다(기사 세부 수치는 확인하지 못했습니다).","impact":"국산 한우와 돼지 가격이 높을수록 수입육 수요가 커지는 구조입니다. 수입 소용량 상품과 거래처용 수입육 대안 제안이 먹힐 가능성이 큽니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 호주산 한국 향 9월 물량은 보도에 시장 이름이 명시되지 않아 한국으로 추정한 것이므로 호주 정부 통계로 확인하세요. 서울경제 기사 세부 내용은 확인하지 못했습니다. 최근 한우·삼겹살 도매가는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-19","day":17,"ideas":[{"tag":"릴스","title":"'수입 삼겹살과 국산 삼겹살, 표시 보는 법' 1분 정리","body":"오늘 카드를 바탕으로 원산지 표시 위치, 냉동·냉장 구분, 소비기한을 확인하는 방법을 보여 주세요. 색이나 모양으로 산지를 판단하지 말고 표시를 보라는 점을 강조하면 안전한 콘텐츠가 됩니다. 오늘 캘린더 항목인 '한우 등급 이해하기 1분' 릴스와 한 시리즈로 묶어도 좋습니다."},{"tag":"스토어","title":"등급 카드뉴스와 수입 냉동 상품 해동 가이드 한 장","body":"오늘 캘린더 항목인 등급 카드뉴스를 만들고, 냉동 삼겹살과 목살 상품 페이지에는 '냉장고에서 천천히 해동, 재냉동 금지, 키친타월로 물기 제거' 같은 해동 가이드를 넣어 보세요. 드립 때문에 맛이 없다는 후기를 줄일 수 있습니다."},{"tag":"B2B 영업","title":"연말 회식 시즌 대비 '수입 냉동 삼겹·목살 소용량 견적' 제안","body":"미국 돼지고기 도매가가 최근 3년 반 만의 저점 수준이라는 보도가 있어 수입 냉동 삼겹의 견적이 유리해질 수 있습니다. 연말 회식 시즌을 앞둔 고깃집과 단체 급식에 소용량 선예약 견적을 제안하되, 재고 부담을 피하도록 분할 납품 조건을 함께 넣으세요."},{"tag":"인사·HACCP","title":"내일 수율 실측 준비: 냉동 원료는 '해동 후 무게'까지 재기","body":"화요일 캘린더 항목이 원육 10kg 수율 실측 촬영입니다. 냉동 삼겹을 쓸 경우 해동 전 무게, 해동 후 무게(드립 손실), 손질 후 무게, 지방과 뼈 무게를 모두 재는 기록표를 준비하세요. 외국인·알바 근로자도 쓸 수 있게 칸을 단순하게 만들면 좋습니다."},{"tag":"지원사업·마케팅","title":"금요일 사업계획서 '회사 현황' 섹션 준비와 시장 메모","body":"금요일에 쓸 회사 현황 섹션을 위해 매출 추이, 직원 10명, 냉동창고 3곳, 차량 5대, 인증 현황 자료를 모아 두세요. 시장 환경 근거로는 한국 돼지고기 수입 증가(1~7월 14.3%)와 미국 돼지고기 가격 약세 소식을 출처와 함께 메모하세요."}],"market":{"beef":"미국 Choice 도매가(컷아웃)는 지난주 약 376.20달러로 3.18달러 내렸고, 4분기 비육우 가격 전망은 100파운드당 225달러로 유지됐습니다. 8월 미국 소고기 수출은 1년 전보다 늘었고 대만이 거의 최고 수준, 한국은 반등했다는 보도가 있습니다.","pork":"미국 돼지고기 도매가(컷아웃)는 100파운드당 77.55달러로 2023년 4월 이후 가장 낮고 돼지 선물은 계약 최저가를 기록했습니다. 소비자가 닭고기를 더 찾는다는 분석이 있습니다."},"news":[{"title":"미국 돼지 선물 계약 최저, 돼지고기 도매가 2023년 4월 이후 최저","source":"CME 시황을 요약한 The Pig Site, Mid-West Farm Report(10월 17일)","date":"2026-10-16 ~ 10-17","summary":"CME 돼지 선물이 10월 16일 계약 최저가를 새로 썼다가 막판 매수로 높은 가격에 마감했고, USDA 기준 돼지고기 컷아웃은 100파운드당 77.55달러로 2023년 4월 이후 가장 낮았습니다. 현물 돼지 가격도 지난주 다시 낮아졌고, 소비자가 돼지고기 대신 닭고기를 찾는다는 분석이 나옵니다.","impact":"미국산 삼겹·목살 수입 단가가 낮아질 여지가 있어 수입 견적에 유리합니다. 다만 환율과 운임, 재고를 함께 보고 분할 구매를 검토하세요."},{"title":"미국 소고기: Choice 도매가 소폭 하락, 4분기 비육우 225달러 전망 유지","source":"USDA 주간 시장 분석을 요약한 IndexBox, Mid-West Farm Report (검색 요약)","date":"2026-10-16 ~ 10-17","summary":"Choice 컷아웃은 지난주 376.20달러로 3.18달러 내렸고, 도축장 마진은 하루 사이 두당 85달러에서 99.65달러로 넓어졌습니다. 4분기 비육우 평균 가격 전망은 225달러로 유지됐고, 8월 소고기 수출은 1년 전보다 늘고 한국은 반등했다고 합니다. 이번 주 소·돼지·닭고기 가격이 서로 다른 방향으로 움직이고 있습니다.","impact":"미국산 소고기는 높은 가격대에서 안정적이고 돼지고기는 약세입니다. 수입 소고기 단가는 높게, 수입 돼지고기 단가는 낮게 형성될 가능성이 있습니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 이번 주(10월 셋째 주) 국내 한우·돼지 도매가는 2026년 자료로 확인되는 기사를 찾지 못했으니 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-21","day":18,"ideas":[{"tag":"릴스","title":"'족발은 왜 오래 삶을까?' 콜라겐이 젤라틴이 되는 과정","body":"족발의 뼈와 껍질, 힘줄이 보이는 단면과 오래 삶은 뒤의 쫀득한 모습을 비교해 보여 주세요. 후크는 '구우면 안 되는 고기, 삶아야 하는 이유'입니다. 오늘 카드의 도식에서 다리 끝 부위를 짚어 보여 주면 이해가 쉽습니다."},{"tag":"스토어","title":"리뷰 이벤트와 신규 상품 사진 3컷, 원산지 라벨이 보이게 촬영하기","body":"오늘 캘린더 항목인 사진 리뷰 사은품 이벤트와 상품 사진 3컷을 함께 진행하세요. 사진에 원산지와 부위명 라벨이 자연스럽게 보이도록 포장 상태 컷, 단면 컷, 조리 후 컷으로 구성하면 신뢰와 구매 전환에 도움이 됩니다."},{"tag":"B2B 영업","title":"내일 연말 회식·단체 프로모션 안과 장거리 거래처 1곳 배송 원가 계산","body":"목요일 캘린더 항목입니다. 연말 회식 시즌 프로모션은 가격이 약한 수입 냉동 삼겹·목살과 족발·보쌈용 세트를 묶어 안을 만들고, 장거리 거래처 1곳은 유류비, 운전 인건비, 차량 감가, 냉동 유지 비용을 1회 배송 기준으로 계산해 견적에 반영하세요."},{"tag":"인사·HACCP","title":"수입 원료 입고 검수에 '수출작업장·원산지 지역·소비기한·온도' 넣기","body":"유럽산처럼 지역과 작업장에 따라 허용 여부가 달라지는 원료를 위해 입고 검수표에 수출작업장 번호, 원산지 지역, 소비기한, 입고 온도 칸을 추가하세요. 외국인·알바 근로자도 사진과 체크 방식으로 쓸 수 있게 만들면 서류 누락을 줄일 수 있습니다."},{"tag":"지원사업·마케팅","title":"금요일 사업계획서 '회사 현황' 작성 준비와 시장 메모","body":"금요일 캘린더 항목이 사업계획서 1섹션(회사 현황) 작성입니다. 직원 10명, 냉동창고 3곳, 차량 5대, 연매출 규모, 거래처 유형(공장·식당) 자료를 한 장으로 모아 두고, 시장 환경 메모에는 유럽 돼지고기 가격 약세와 스페인·독일 ASF 소식을 출처와 함께 적어 두세요."}],"market":{"beef":"이번 주(10월 셋째 주) 소고기 신규 소식은 크지 않았고, 앞선 브리핑의 미국 소고기 가격 강세와 호주산 한국 향 수출 감소 흐름이 이어지고 있습니다.","pork":"유럽 돼지 가격은 9월 중순 기준 영국 단위 환산 평균 148펜스/kg 수준이고, 유럽위원회 기준 평균은 100kg 도체당 약 169.7유로로 1년 전보다 16.4% 낮다는 자료가 인용됐습니다. 올해 상반기 유럽 돼지고기 생산은 1.8% 늘었습니다."},"news":[{"title":"EU 돼지고기 수출 상반기 감소: 스페인 -18%, 독일 +29%","source":"Ukragroconsult 등 EU 수출 통계 보도, USDA 세계 시장 분석 (검색 요약)","date":"2026년 상반기 통계 (보도 시점 확인 필요)","summary":"스페인은 유럽 최대 수출국 자리를 지켰지만 ASF와 무역 제한으로 수출이 약 18% 줄어 58만 5천 톤이었고, 독일은 약 29% 늘어 18만 9천 톤이었습니다. 일본, 말레이시아, 멕시코 등 일부 시장은 스페인산을 막았고, 중국은 바르셀로나 지역만 제한하며, 한국은 비발생 지역 돼지고기를 받아들인다는 보도가 있습니다.","impact":"유럽산 수입 삼겹·목살의 공급처가 스페인에서 독일 등으로 이동하고 있습니다. 거래처가 유럽산을 쓴다면 현재 허용 지역과 작업장을 확인하고 산지 분산 대안을 준비하세요."},{"title":"유럽 돼지 가격 1년 전보다 16.4% 낮아, 단기 압박 지속 전망","source":"유럽위원회 가격 자료를 인용한 Farm Change, AHDB 유럽 돼지고기 시황 (검색 요약)","date":"2026-09 ~ 10 초 (정확한 주차 확인 필요)","summary":"유럽 평균 돼지 가격은 100kg 도체당 169.7유로로 1년 전보다 16.4% 낮고, AHDB는 넉넉한 공급과 약한 수요 때문에 유럽 시장이 단기적으로 압박을 받을 것으로 봅니다. 올해 상반기 유럽 돼지고기 생산은 1,110만 톤으로 1.8% 늘었습니다. 서로 다른 기준의 수치는 직접 비교하기 어렵습니다.","impact":"유럽산 수입 돼지고기는 가격 협상에 유리한 국면입니다. 다만 ASF 소식으로 공급이 갑자기 달라질 수 있으니 분할 구매와 유효기간이 짧은 견적을 권합니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 한국의 스페인산 허용 범위는 최신 농림축산식품부 공지로 확인하세요. 이번 주 소고기 신규 뉴스와 국내 한우·돼지 도매가는 2026년 자료로 확인되는 기사를 찾지 못했습니다. 국내 시세는 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-23","day":19,"ideas":[{"tag":"릴스","title":"'소고기는 왜 천천히 오르고 돼지고기는 왜 빨리 오르내릴까?' 한 장 그림 설명","body":"소는 2년 반, 돼지는 6개월이라는 숫자를 막대 두 개로 비교하는 그림 한 장이면 충분합니다. 후크는 '한우값은 왜 안 떨어질까요?'입니다. 오늘 카드의 핵심 내용이라 15초에 담을 수 있고, 거래처에게 시세 설명을 잘하는 사장님이라는 인상을 줍니다."},{"tag":"스토어","title":"내일 11월 한 달 콘텐츠 주제 초안과 한우데이(11/1) 소용량 기획전","body":"토요일 캘린더 항목은 11월 콘텐츠 초안입니다. 11월 1일 한우데이, 김장철 보쌈·수육, 연말 회식 시즌을 큰 축으로 잡고, 한우 가격이 높은 시기라 소용량 구성과 부위 조합 세트로 기획전 상품을 구상해 보세요. 예약발행을 금·토에 미리 걸어 두면 주말이 편해집니다."},{"tag":"B2B 영업","title":"'시세 5지표 월간 메모'를 거래처에 한 줄로 공유하고 시세 연동 조항 제안","body":"사육두수, 수입량, 환율, 질병, 주요국 정책 다섯 가지를 월 1회 한 장으로 정리해 두고 핵심 한 줄만 거래처에 보내 보세요. 오늘 뉴스처럼 중국 쿼터로 브라질 소고기 물량이 다른 시장으로 흘러갈 수 있다는 소식은 수입육 견적 유효기간을 짧게 가져가야 하는 근거가 됩니다."},{"tag":"인사·HACCP","title":"오늘 캘린더: HACCP 교육 이수 기록 정리와 외국인·알바 교육 기록 서식 통일","body":"이번 달 직원, 외국인, 알바 근로자 교육 일시, 주제, 참석자, 담당자를 한 서식에 모아 정리하세요. 이번 달 진행한 부위 교육, 입고 검수 교육, 냉동창고 안전 교육을 기록해 두면 HACCP 점검 때 바로 제시할 수 있습니다."},{"tag":"지원사업·마케팅","title":"오늘 캘린더: 사업계획서 1섹션(회사 현황) 작성, 숫자·강점·리스크 3칸으로 쓰기","body":"회사 현황은 숫자(연매출 100억, 직원 10명, 냉동창고 3곳, 차량 5대), 강점(자체 배송, HACCP, 온라인 스토어, 다양한 거래처), 리스크와 대응(시세 변동은 월 1회 시세 점검과 시세 연동 단가로 대응) 세 칸으로 나눠 쓰면 정리가 빠릅니다. 오늘 하루 한 섹션만 끝낸다는 마음으로 시작하세요."}],"market":{"beef":"중국이 브라질의 올해 소고기 쿼터(110만 6천 톤) 소진을 9월 29일 확인해 10월 1일부터 연말까지 초과 물량에 약 67% 관세가 적용되고, 호주는 6월에 쿼터(20만 5천 톤)를 채웠습니다. 미국 소 선물은 지난주 약 3개월 고점까지 올랐습니다.","pork":"미국 12월물 돼지 선물은 100파운드당 65.725달러로 새 계약 최저가를 기록했고, 돼지고기 컷아웃은 77달러대로 약 3년 반 만의 저점 수준입니다. 소고기와 달리 돼지고기는 약세가 이어지고 있습니다."},"news":[{"title":"중국, 브라질 소고기 쿼터 소진 확인: 10월 1일부터 초과분 약 67% 관세, 브라질은 미국·캐나다 등으로 물량 전환 모색","source":"Beef Central, 중국 상무부 발표 인용 보도, Expana·Global Times 등 (검색 요약)","date":"2026-09-29 ~ 10-01","summary":"중국 상무부는 브라질의 올해 쿼터 110만 6천 톤이 9월 29일 소진됐다고 밝혔고, 10월 1일부터 연말까지 초과 물량에는 기본 12%에 55% 추가 관세가 붙어 약 67%가 됩니다. 호주는 6월에 쿼터를 채웠고 아르헨티나는 8월 5일 쿼터의 50%에 도달했습니다. Beef Central은 브라질이 더 많은 물량을 미국, 캐나다, 일본, 한국 등 다른 시장으로 돌릴 가능성을 짚었습니다.","impact":"브라질산 소고기가 한국을 포함한 아시아 시장에 들어올 가능성이 높아지면 수입 소고기 가격 경쟁이 달라질 수 있습니다. 한국의 브라질산 허용 범위는 별도로 확인하세요."},{"title":"미국 소 선물 3개월 고점, 돼지 선물은 계약 최저 경신","source":"CME 시황을 요약한 The Beef Site, The Pig Site (검색 요약)","date":"2026-10-20 ~ 10-21 추정 (정확한 날짜 확인 필요)","summary":"12월물 생우 선물이 100파운드당 231.125달러로, 11월물 비육 소 선물이 348.825달러로 둘 다 3개월 고점을 기록했습니다. 12월물 돼지 선물은 65.725달러로 새 계약 최저가를 쓰고, 돼지고기 컷아웃은 77.11달러까지 내렸다는 보도가 있습니다. Choice 소고기 컷아웃은 373.30달러로 소폭 올랐습니다.","impact":"소고기는 강세, 돼지고기는 약세로 갈라지는 흐름이 이어집니다. 수입 소고기 단가는 높게, 수입 돼지고기 단가는 유리하게 유지될 가능성이 있습니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 이번 주 국내 한우·돼지 도매가는 2026년 자료로 확인되는 기사를 찾지 못했습니다. 축산유통정보(ekapepia.com)에서 직접 확인하세요. 중국 쿼터와 관세 수치는 보도를 인용한 것이므로 최신 공지를 확인하세요."},{"date":"2026-10-26","day":20,"ideas":[{"tag":"릴스","title":"'소고기 90CL이 뭔가요?' 햄버거 패티 원료 용어 풀이","body":"90CL을 '지방 10% 안팎의 정육 부스러기'라고 한 줄로 풀어 주는 15초 영상입니다. 후크는 '햄버거 패티 고기, 가격은 어떻게 정해질까?'입니다. 오늘 캘린더 항목인 소고기 구이용 vs 국거리용 구분 릴스와 이어 '구이도 국거리도 아닌 분쇄용'으로 확장하면 시리즈가 됩니다."},{"tag":"스토어","title":"스토어 카테고리 정리: 구이용·불고기용·국거리용·분쇄용 4분류","body":"오늘 캘린더 항목입니다. 상품을 구이용, 불고기·샤브샤브용, 국거리용, 분쇄·가공용 네 갈래로 나누고 카테고리 대표 이미지에 부위 도식을 쓰세요. 소 도식에서 해당 부위가 어디인지 보여 주면 구매 선택이 쉬워집니다."},{"tag":"B2B 영업","title":"햄버거·분식·구내식당용 '분쇄·슬라이스 가공 원료' 제안서","body":"수입 분쇄용 원료 가격이 약하다는 소식은 가공용 단가 협상에서 유리한 근거입니다. 햄버거, 분식, 구내식당 거래처에 분쇄육, 불고기 슬라이스 규격과 견적 유효기간을 한 장으로 정리해 제안해 보세요. 산지와 한국 허용 여부는 서류로 확인한 뒤 안내하세요."},{"tag":"인사·HACCP","title":"내일 수율 실측 촬영(원육 10kg)과 트리밍 부산물 활용 기록표 준비","body":"화요일 캘린더 항목이 수율 실측 촬영입니다. 원육 무게, 정육, 지방, 뼈, 부스러기를 따로 재고, 부스러기는 분쇄용으로 얼마나 쓸 수 있는지 함께 기록하세요. 외국인·알바 근로자도 칸만 채우면 되게 사진이 들어간 한 장 서식이 좋습니다."},{"tag":"지원사업·마케팅","title":"11월 콘텐츠 주제 확정과 한우데이(11/1) 예약발행 점검","body":"11월 첫날이 한우데이입니다. 토요일에 올릴 콘텐츠가 예약발행되어 있는지 확인하고, 한우데이 기획전 상품 구성(소용량 구이 세트, 국거리 세트)을 마무리하세요. 지원사업 후보 1곳의 마감일과 서류 목록도 이번 주 안에 한 번 더 확인해 두세요."}],"market":{"beef":"브라질의 9월 미국 향 소고기 수출은 금액으로 2억 6,350만 달러로 1년 전보다 524% 늘었고 1~9월 물량은 55.6% 늘었다는 보도가 있습니다. 미국에서는 수입 분쇄용 원료(90CL)가 재고 과잉으로 약세이고, 아르헨티나는 미국 무관세 쿼터의 61%를 소진했습니다.","pork":"미국 돼지 가격은 가을 들어 약세가 이어지고 USDA는 4분기 생산자 돼지 가격을 100파운드당 55달러, 올해 평균을 약 64달러(전년 대비 7.3% 하락)로 전망합니다. 국내는 한돈연구소가 10월 출하를 전년보다 9.0% 많은 164만 1천 두로 보고 지육 가격을 kg당 5,700~6,000원으로 예상합니다."},"news":[{"title":"브라질 9월 미국 향 소고기 수출 524% 급증, 미국은 수입 분쇄육 재고 과잉","source":"Rio Times, Beef Central, 우크라그로컨설트 (검색 요약)","date":"2026-10 중순 ~ 하순 보도 (정확한 날짜 확인 필요)","summary":"브라질의 9월 미국 향 소고기 수출액은 2억 6,350만 달러로 1년 전의 4,220만 달러보다 524% 늘었고, 1~9월 물량은 55.6% 늘어난 28만 5,400톤이었습니다. 아르헨티나는 미국 무관세 쿼터 10만 톤의 61%를 썼고 미국 수입 점유율은 12%로 호주(29.6%)에 이어 큽니다. 냉동 90CL 분쇄용 원료는 미국 동부 기준 파운드당 3.13달러로 약세이고 현물·11월 인도분 재고가 넉넉하다고 합니다.","impact":"중국 쿼터로 밀린 남미 물량이 미국으로 크게 이동하며 분쇄용 원료 가격이 눌리고 있습니다. 한국 수입 가공용 원료 견적에도 약세 압력이 생길 수 있습니다."},{"title":"미국 돼지 가격 가을 약세 지속: 4분기 55달러 전망, 8월 돼지고기 수출 3개월 연속 감소","source":"USDA 전망, Pork Checkoff(10월 19일), RFD-TV 보도 요약 (검색 요약)","date":"2026-10-19 ~ 10-23","summary":"USDA는 4분기 생산자 돼지 가격을 100파운드당 55달러, 올해 평균을 약 64달러로 전망하고, 8월 돼지고기 수출이 5억 1,600만 파운드로 1년 전보다 약 5% 줄어 3개월 연속 감소했다고 밝혔습니다. 돼지고기 도매 컷아웃은 10월 16일 이후 계속 내려 23일 74달러대였고, 선물이 2023년 가을 폭락 때와 비슷하게 움직인다는 분석도 나왔습니다.","impact":"미국산 삼겹·목살 등 수입 냉동 돼지고기 가격이 당분간 유리할 가능성이 큽니다. 다만 환율, 운임, 재고를 함께 보고 분할 구매하세요."},{"title":"한돈연구소: 10월 돼지 출하 164만 1천 두(+9.0%), 지육 가격 5,700~6,000원 전망","source":"축산신문 (한돈연구소 수급 전망 보도)","date":"2026-10-07 보도","summary":"한돈연구소는 10월 돼지 출하두수를 전년 같은 달보다 9.0% 많은 164만 1천 두로 예상하고 10월 지육 가격을 kg당 5,700~6,000원으로 전망했습니다. 출하가 늘어 가격 하락 압력이 커진다는 설명입니다.","impact":"국산 돼지 도매가가 내려가면 수입 돼지고기와의 가격 차가 줄어 수입 냉동 수요에 영향을 줄 수 있습니다. 국산과 수입 가격 차를 이번 주에 점검해 보세요."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 한국의 브라질·아르헨티나산 소고기 허용 범위는 최신 공지로 확인하세요. 이번 주 한우 도매가는 2026년 자료로 확인되는 기사를 찾지 못했으니 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-10-28","day":21,"ideas":[{"tag":"릴스","title":"'냉동육 해동, 이렇게 하면 육즙이 사라집니다' 3가지 방법 비교","body":"냉장 해동, 찬물 해동, 전자레인지 해동을 같은 고기로 하고 저울로 드립(나온 물) 양을 비교해 보세요. 후크는 '같은 고기인데 해동법에 따라 육즙이 이만큼 다릅니다'입니다. 오늘 카드의 해동 내용이 그대로 영상이 되고, 숫자가 나오는 영상이라 설득력이 큽니다."},{"tag":"스토어","title":"오늘 캘린더: 한우데이 기획전 상품 구성 확정과 광고 성과 점검","body":"한우데이(11/1)를 앞두고 기획전 상품 구성을 확정하세요. 추석에 농협 매장에서 1등급 등심이 100g 7,590원 안팎의 할인 행사가 있었다는 보도가 있으니, 가격 경쟁보다 소용량 구성이나 국거리·구이 조합 세트, 해동·보관 안내 같은 부가가치로 차별화하는 것이 안전합니다. 광고 성과는 전환율과 광고비 대비 매출을 같이 확인하세요."},{"tag":"B2B 영업","title":"내일 신규 거래처 3곳 샘플 제안: 냉장·냉동 샘플과 해동 가이드를 한 세트로","body":"목요일 캘린더 항목인 샘플 제안에 냉장과 냉동 샘플을 함께 넣고, 해동·보관 가이드 한 장을 곁들이세요. 거래처 입장에서 품질 차이를 직접 비교할 수 있고 우리가 냉동 관리에 강하다는 신뢰를 줍니다. 거래처별 마진 메모도 같은 날 작성해 두면 제안 단가를 정하기 쉽습니다."},{"tag":"인사·HACCP","title":"냉동창고 3곳 '온도 변동·적재 간격·성에' 점검표 만들기","body":"창고별로 문 개방 횟수, 적재 간격, 천장 성에, 온도 기록을 한 장에 점검하는 표를 만들어 보세요. 외국인·알바 근로자도 사진과 체크 표시로 쓸 수 있게 하면 입고 때 한 번에 많이 넣어 온도가 오르는 일을 줄일 수 있고 HACCP 기록으로도 남습니다."},{"tag":"지원사업·마케팅","title":"ASF 방역 이슈 대비 거래처 안내 문구 업데이트와 11월 콘텐츠 예약발행 점검","body":"국정감사에서 음식물찌꺼기를 먹는 돼지가 20개월 새 2.4배로 늘어 ASF 확산이 우려된다는 지적이 나왔습니다. 거래처가 불안해할 때 쓸 안내 문구(원료 이력번호, 입고 검수 기준, 방역 공지 확인 방법)를 업데이트해 두세요. 11월 1일 한우데이 콘텐츠 예약발행도 다시 확인하세요."}],"market":{"beef":"미국의 9월 비육장 입식은 1년 전의 88% 수준으로 9월 기준 1996년 이후 가장 적었고, 도축장 마진은 한때 마이너스였습니다. 12월물 생우 선물은 231달러대를 유지합니다. 국내는 추석 한우 행사에서 1등급 등심이 100g 7,590원 안팎으로 팔렸다는 보도가 있습니다.","pork":"미국 12월물 돼지 선물은 100파운드당 64.675달러로 새 계약 최저가를 또 기록했고 소비자가 돼지 대신 닭고기를 찾는다는 분석이 이어집니다. 국내는 국정감사에서 음식물찌꺼기를 먹이는 돼지가 20개월 새 2.4배로 늘어 ASF 위험이 커졌다는 지적이 나왔습니다."},"news":[{"title":"미국 9월 비육장 입식 1996년 이후 최저, 12월 돼지 선물은 또 계약 최저","source":"USDA 소 사육 현황 보고서(Cattle on Feed)를 요약한 CME 시황 (The Beef Site, The Pig Site)","date":"2026-10-26","summary":"10월 1일 기준 미국 비육장 소는 1년 전의 100% 수준이고 9월 입식은 88%로 시장 예상(92.6%)보다 적어 9월 기준 1996년 이후 가장 낮았습니다. 12월물 생우 선물은 231.200달러, 12월물 돼지 선물은 새 계약 최저가인 64.675달러로 마감했고 도축장 마진은 지난 금요일 두당 4.10달러 적자였습니다.","impact":"미국 소 공급 부족이 이어져 수입 소고기 단가는 높게 유지될 가능성이 큽니다. 돼지고기는 수요 약세가 이어지고 있어 수입 돼지고기 단가에 유리합니다."},{"title":"국정감사: 음식물찌꺼기 먹는 돼지 20개월 새 2.4배, ASF 확산 우려","source":"브레이크뉴스, 송옥주 의원 국정감사 자료 (검색 요약)","date":"2026-10-26","summary":"2019년 ASF 발생 이후 금지됐던 음식물찌꺼기(잔반) 사료가 2024년 10월 조건부로 허용된 뒤 사용 농가와 돼지가 20개월 새 2.4배로 늘었다는 지적입니다. 올해 국내 ASF는 1월 16일 첫 발생 이후 3월 초까지 21~24개 농장에서 확인되고 약 14만 8천 마리가 살처분됐다는 보도가 함께 소개됩니다. 이번 보도는 위험 경고이고 10월 신규 확진은 확인되지 않았습니다.","impact":"국내 ASF 위험이 겨울철에 커질 수 있어 국산 돼지고기 공급과 가격 변동성에 대비해야 합니다. 수입 돼지고기 확보와 산지 분산을 미리 준비하세요."},{"title":"추석 한우 할인 행사: 1등급 등심 100g 7,590원, 소비자가 대비 31~34% 저렴","source":"농협·대형마트 행사 보도 (검색 요약)","date":"2026-09 추정 (정확한 날짜 확인 필요)","summary":"추석 한우 행사는 1등급 기준 등심 100g 7,590원, 양지 4,300원, 불고기·국거리 3,310원 이하로 판매됐고 9월 상순 소비자가격 대비 약 31~34% 저렴했다고 합니다. 현장에서는 고물가로 명절 소비가 위축됐다고 설명했고, 수입 소고기 평균 수입단가가 전년 대비 7.2% 올랐다는 분석도 소개됩니다(날짜 확인 필요).","impact":"한우데이 행사 가격 경쟁은 농협·대형마트가 강합니다. 우리 스토어는 소용량·조합·보관 안내 같은 차별화로 승부하는 것이 안전합니다."}],"newsNote":"확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 올해 ASF 농장 수는 보도마다 21개와 24개로 달라 정확한 값은 농림축산식품부 공지로 확인하세요. 한우 할인 행사 보도는 날짜가 불확실합니다. 이번 주 국내 한우·돼지 도매가는 2026년 자료로 확인되는 기사를 찾지 못했으니 축산유통정보(ekapepia.com)에서 직접 확인하세요."},{"date":"2026-11-12","day":22,"ideas":[{"tag":"릴스","title":"'와규 A5, 숫자는 이렇게 읽습니다' 15초 해설","body":"A는 정육 비율, 5는 육질이라는 한 줄과 BMS 마블링 번호를 그림 한 장으로 보여 주세요. 후크는 '와규라고 다 같은 와규가 아닙니다'입니다. 오늘 카드의 호주·미국 와규 교잡종과 일본산 와규 차이도 자막 한 줄로 넣으면 오해를 막는 전문가형 영상이 됩니다."},{"tag":"스토어","title":"김장철 수육·보쌈 세트 기획: 삼겹·앞다리·족발 3종 조합","body":"11월 중순부터 김장철 수육과 보쌈 수요가 늘어납니다. 삼겹살, 앞다리, 족발을 용도별로 묶은 세트를 만들고 상세페이지에 부위 위치 도식과 삶는 시간 가이드를 넣어 보세요. 수입 냉동 삼겹 가격이 약세라 세트 구성 단가를 맞추기 좋은 시기입니다."},{"tag":"B2B 영업","title":"연말 회식·단체 급식 견적 시즌 시작: 수입 냉동 삼겹·목살 선예약 제안","body":"연말 회식 시즌을 앞두고 고깃집과 단체 급식 거래처에 수입 냉동 삼겹·목살 소용량 분할 납품 견적을 제안하세요. 한우데이 대형마트 50% 할인 행사 때문에 한우 수요가 일시적으로 분산됐을 수 있으니 거래처의 최근 주문 변화를 먼저 물어보는 것도 좋습니다."},{"tag":"인사·HACCP","title":"연말 HACCP 내부 점검 준비와 외국인·알바 근로 계약 만료일 재확인","body":"연말 전에 HACCP 기록(온도, 위생, 교육)의 누락을 한 번 점검하세요. 연말에 계약이 만료되는 외국인과 알바 근로자 목록을 다시 확인하고 갱신 준비를 90일 전, 30일 전 알림으로 나눠 관리하면 놓치지 않습니다."},{"tag":"지원사업·마케팅","title":"설 선물세트 준비 일정표와 연말 지원사업 마감 점검","body":"2027년 설은 2월 6일입니다. 12월에 상품 구성, 포장, 사진, 상세페이지를 끝내려면 지금 일정표를 만들어야 합니다. 같은 시기에 지원사업 후보의 마감일과 서류도 다시 확인하고 월간 경영 보고에 쓸 한우데이 판매 결과와 리뷰도 정리해 두세요."}],"market":{"beef":"미국의 소고기 수입은 올해 1~9월 17.5% 늘었고 남미 비중이 34.7%까지 올랐으며, 수입 확대로 분쇄용 소 가격은 내렸지만 소비자 가격은 크게 안 내렸다는 분석이 나옵니다. 11월 11일 기준 Choice 도매가는 100파운드당 360.60달러였고 업계는 소고기 가격이 몇 년 더 높을 것으로 봅니다.","pork":"유럽은 스페인 ASF의 여파로 가격 하락이 유럽 전체로 번졌고, 중국은 돼지 가격이 11월 초 10년 만의 최저인 kg당 8.63위안까지 내려 수입도 줄고 있습니다. 필리핀은 농가 가격 하락 때문에 60일 돼지고기 수입 금지에 들어갔습니다."},"news":[{"title":"대형마트 '한우데이' 한우 전 품목 50% 할인, 돼지고기도 대폭 할인","source":"경향신문 (2026-10-28 보도)","date":"2026-10-28","summary":"대형마트 3사가 10월 29일부터 11월 1~4일까지 한우 전 품목을 50% 할인하는 행사를 열고 돼지고기도 대폭 할인했습니다. 한우 사태는 100g당 2,980원, 2등급 등심은 5,790원에 내놨다고 합니다. 행사 가격이라 평소 소매가와는 다릅니다.","impact":"한우데이 전후로 한우 수요가 대형마트로 쏠렸을 수 있습니다. 거래처의 11월 주문 변화를 확인하고 한우 재고와 수입육 대안 제안을 조정하세요."},{"title":"미국 소고기 수입 1~9월 17.5% 증가, 남미 비중 34.7%로 상승, 목장 도태우 가격은 하락","source":"Farm Action, Texas Standard, First Balkan Media 등 USDA 자료 인용 보도 (검색 요약)","date":"2026-11-09 ~ 11-11","summary":"미국의 올해 1~9월 소고기 수입은 17.5% 늘었고 브라질 비중 20.7%, 호주 22.8%이며 남미 합산 비중은 2023년 19.9%에서 34.7%로 올랐습니다. 분쇄용 소 가격이 수입 확대 이후 약 20% 내렸지만 소비자 가격은 크게 내리지 않았고, 업계는 소고기 가격이 몇 년 더 높을 것으로 봅니다. 11월 11일 Choice 도매가는 360.60달러였습니다.","impact":"남미 물량이 미국으로 크게 이동해 분쇄·가공용 원료는 약세이고, 부위육 가격은 높게 유지됩니다. 수입 가공용 원료와 구이용 부위를 구분해 견적을 짜세요."},{"title":"USDA: 스페인 ASF가 EU 돼지 시장을 재편, 중국 돼지 가격 10년 최저","source":"USDA FAS 보고서를 요약한 The Pig Site, 후툰·에포크타임스 등 중국 시황 (검색 요약)","date":"2026-11 초 보도 (정확한 날짜 확인 필요)","summary":"USDA는 스페인 ASF와 가격 급락으로 스페인 농가가 손실을 보고 가격 하락이 EU 전체로 번졌다고 분석했습니다. 올해 상반기 스페인 수출은 3.5% 감소한 130만 톤으로 2020년 이후 최저였다고 합니다(앞선 브리핑의 -18%는 다른 기준의 수치라 확인이 필요합니다). 중국 돼지 가격은 11월 초 kg당 8.63위안으로 10년 만의 최저이고 USDA는 중국 돼지고기 수입을 올해 84만 톤으로 전망합니다.","impact":"유럽과 중국의 약세는 수입 돼지고기 가격에 계속 하방 압력을 줍니다. 가격 유리 시기에 분할 구매하되 ASF 소식과 환율을 함께 보세요."},{"title":"필리핀, 돼지고기 수입 60일 금지: 농가 가격 하락 대응","source":"Manila Times (2026-11-10), BusinessMirror (검색 요약)","date":"2026-11-10","summary":"필리핀 농업부가 농가 출하가 하락을 이유로 돼지고기 수입을 60일간 금지했고, 브라질 돼지고기 업계는 자국 양돈 부진의 원인이 수입이 아니라 ASF라고 반박했습니다. 필리핀은 앞서 스페인산에 시장을 다시 열었던 곳입니다.","impact":"필리핀 수입이 막히면 유럽·브라질·미국산 돼지고기 물량이 다른 시장으로 향해 가격 하방 압력이 커질 수 있습니다."}],"newsNote":"이번 브리핑은 10월 28일 이후 중단됐던 정기 실행을 복구하며 11월 12일에 다시 만든 것입니다(10월 30일~11월 11일 분은 만들지 못했습니다). 확인 한계: FAO, USDA 등 원문 사이트 접속이 막혀 검색 요약 기준으로 정리했습니다. 스페인 수출 감소율은 보도마다 달라 정확한 값은 원문 확인이 필요합니다. 이번 기간 국내 한우·돼지 도매가와 ASF 신규 발생은 2026년 자료로 확인되는 기사를 찾지 못했으니 축산유통정보(ekapepia.com)와 농림축산식품부 공지에서 직접 확인하세요."}];
var CARDS=[{"n":1,"title":"소 대분할 10부위: 어디에 있고, 위치가 왜 성질을 정하나","diagram":"beef","intro":"소고기 상담의 출발점은 부위가 몸의 어디에 있는지 아는 것입니다. 위치를 알면 그 근육이 평소 얼마나 일했는지 짐작할 수 있고, 그것이 곧 질기기와 부드러움, 그리고 어울리는 요리를 결정합니다.","sections":[{"h":"큰 지도: 앞에서 뒤로, 위에서 아래로","p":["소를 옆에서 보고 머리가 왼쪽에 있다고 생각하세요. 등 쪽 줄은 앞에서 뒤로 목심, 등심, 채끝, 그리고 엉덩이 쪽의 우둔 순서입니다. 아래쪽에는 앞다리, 갈비, 가슴에서 배로 이어지는 양지가 있고, 앞뒤 다리 끝쪽에 사태(정강이)가 있습니다. 뒷다리 허벅지는 설도입니다. 안심은 겉에서 보이지 않고 허리뼈 안쪽에 길쭉하게 숨어 있습니다.","이 배치를 도식으로 먼저 눈에 익히면, 이후 나오는 소분할 부위(살치살, 차돌박이, 도가니 등)도 어느 대분할에서 나왔는지 바로 연결됩니다."]},{"h":"핵심 원리: 많이 움직인 근육일수록 질기고 맛이 진하다","p":["소는 서서 풀을 뜯고 걸어 다니는 동물입니다. 머리와 목을 들고 있는 목, 체중의 상당 부분을 받치는 앞다리와 가슴, 걷고 밀어내는 뒷다리와 정강이는 하루 종일 일합니다. 이런 근육은 힘줄과 결합조직(콜라겐)이 많고 근섬유가 굵어 그냥 구우면 질깁니다. 대신 오래 끓이면 콜라겐이 녹아 젤라틴이 되어 국물이 진하고 고기가 부드러워집니다.","반대로 등뼈를 따라 길게 뻗은 등심과 채끝, 허리 안쪽의 안심은 자세를 유지할 뿐 격하게 움직이지 않아서 결합조직이 적고 근섬유가 가늘어 부드럽습니다. 이 부위가 구이와 스테이크용입니다."]},{"h":"10부위를 한 줄씩","p":["목심: 목 부위. 많이 움직여 결합조직이 있지만 마블링이 좋은 부분은 구이와 불고기로도 씁니다. 등심: 갈비 위쪽 등 부위로 가장 크고 대표적인 구이 부위이며 서양의 립아이와 위치가 비슷합니다. 채끝: 등심 뒤쪽 허리 부위이며 서양의 스트립로인(뉴욕 스트립)과 비슷합니다. 안심: 허리뼈 안쪽에 있는 가장 부드러운 근육이며 소량만 나옵니다.","앞다리: 어깨와 앞다리 윗부분으로 불고기, 장조림, 국거리에 씁니다. 우둔: 엉덩이 쪽 살코기로 지방이 적어 육회, 산적, 불고기에 씁니다. 설도: 뒷다리 허벅지 쪽으로 불고기, 장조림에 씁니다. 양지: 가슴과 배 부위로 국물과 찜용이며 차돌박이처럼 구이용 부위도 이곳에서 나옵니다. 사태: 앞뒤 다리의 정강이로 콜라겐이 매우 많아 탕과 찜, 수육용입니다. 갈비: 갈비뼈 주변으로 구이와 찜에 모두 씁니다."]}],"script":"소고기는 등 쪽은 덜 움직여서 부드러워 구이용이고, 다리와 가슴 쪽은 많이 움직여서 질기지만 오래 끓이면 진한 국물이 나와서 탕과 찜용이라고 기억하시면 실패가 없습니다.","summary":["소는 등 쪽(목심·등심·채끝)과 허리 안쪽의 안심이 덜 움직여 부드러워 구이용이고, 다리와 가슴 쪽(앞다리·양지·사태)은 많이 움직여 질기지만 오래 끓이면 국물·찜용으로 좋습니다.","위치를 알면 성질이 보입니다. 위치가 근육을 얼마나 쓰는지를, 근육 사용량이 결합조직과 부드러움을, 그것이 용도를 정합니다.","대분할 10부위는 다시 소분할로 나뉘고 같은 대분할 안에서도 가격 차가 큽니다."],"sources":"축산물품질평가원 부위별 명칭 및 도해, 농림축산식품부 식육 부위 구분 자료 (최신 명칭은 공식 자료로 확인)"},{"n":2,"title":"왜 등심·채끝·안심은 구이용이고 양지·사태는 국거리용인가","diagram":"beef","intro":"손님이 가장 자주 묻는 질문 중 하나가 '이 부위는 구워도 되나요, 끓여야 하나요?'입니다. 정답만 아는 것과 이유까지 설명할 수 있는 것은 신뢰가 완전히 다릅니다. 오늘은 그 이유를 근육의 구조에서 설명합니다.","sections":[{"h":"근육의 3가지 구성 요소","p":["고기는 크게 근섬유(고기 결을 이루는 가는 실 다발), 결합조직(근섬유를 감싸는 콜라겐 막과 힘줄), 지방으로 이루어집니다. 부드러움은 결합조직의 양과 근섬유의 굵기가 좌우하고, 풍미와 촉촉함은 지방과 근내지방(마블링)이 좌우합니다.","등심, 채끝, 안심은 결합조직이 적고 근섬유가 가늘어서 짧은 시간 열을 가해도 씹기 편합니다. 반대로 양지, 사태, 앞다리는 결합조직이 많아 같은 조리를 하면 질깁니다."]},{"h":"굽기에서 일어나는 일","p":["센 불에서 고기 겉면은 높은 온도에서 마이야르 반응(당과 아미노산이 반응해 갈색과 고소한 향을 만드는 반응)을 일으켜 구이 특유의 풍미를 만듭니다. 동시에 근섬유는 열로 수축하며 안의 수분(육즙)을 밀어냅니다. 오래 구울수록 수분이 더 빠져 퍽퍽해집니다.","그래서 구이는 짧은 시간에 끝내야 하고, 짧은 시간에도 부드러운 부위가 구이에 맞습니다. 마블링은 가열 중 녹아 근섬유 사이를 적셔 주기 때문에 같은 굽기에서도 더 촉촉하게 느껴집니다."]},{"h":"끓이기에서 일어나는 일","p":["결합조직의 콜라겐은 물과 함께 대략 70℃ 이상의 온도에서 오래 가열되면 서서히 젤라틴으로 바뀝니다. 젤라틴은 물에 녹아 국물에 걸쭉함과 감칠맛을 주고, 고기 자체는 부드럽게 풀어집니다. 이 변화에는 시간이 필요하기 때문에 양지, 사태, 앞다리는 몇 시간씩 약한 불로 끓이는 조리에 맞습니다.","같은 이유로 국거리 부위를 스테이크처럼 구워 내면 콜라겐이 그대로 남아 질기고, 안심을 몇 시간 끓이면 지방이 없어 퍽퍽하고 맛도 밋밋해집니다. 부위와 조리법이 맞아야 합니다."]},{"h":"구이 3형제의 차이","p":["안심은 가장 부드럽지만 지방이 적어 풍미가 약합니다. 그래서 소스나 버터와 함께 내는 경우가 많습니다. 등심은 부드러움과 풍미, 마블링의 균형이 가장 좋은 대표 구이 부위입니다. 채끝은 등심과 이어진 근육으로 씹는 맛이 좀 더 있고, 가장자리 지방이 풍미를 더합니다."]}],"script":"구이는 짧게 익히는 요리라서 원래 부드러운 부위가 맞고, 국은 오래 끓이는 요리라서 질긴 대신 콜라겐이 많은 부위가 오히려 맛있어집니다. 그래서 같은 소고기라도 요리에 맞는 부위를 고르시는 게 중요합니다.","summary":["구이는 짧게 익히는 요리라 결합조직이 적은 등심·채끝·안심이 맞고, 국과 찜은 오래 끓여 콜라겐이 젤라틴이 되는 양지·사태가 맞습니다.","센 불에서는 마이야르 반응으로 구이 풍미가 생기고, 오래 구우면 수분이 빠져 퍽퍽해집니다. 마블링은 촉촉함을 보완합니다.","부위와 조리법이 맞아야 합니다. 안심을 오래 끓이면 밋밋하고 사태를 구우면 질깁니다."],"sources":"Principles of Meat Science (Aberle 외), Lawrie's Meat Science 중 근육 구조와 결합조직 장, 축산물품질평가원 자료"},{"n":3,"title":"한우 육질등급: 무엇을 어디서 보고 매기는가","diagram":null,"intro":"등급은 손님이 가장 먼저 묻는 가격 근거입니다. 등급이 무엇을 보증하고 무엇은 보증하지 않는지 정확히 알아야 과장 없이 판매할 수 있습니다.","sections":[{"h":"어디를 보고 판정하나","p":["국내 소 도체 등급은 도축 후 도체를 반으로 갈라 걸어 둔 상태에서 마지막 등뼈와 첫째 허리뼈 사이를 절개한 등심 단면을 보고 판정합니다. 도체 전체를 보는 것이 아니라 이 한 곳의 상태로 전체 등급을 대표합니다."]},{"h":"육질등급의 5가지 판정 요소","p":["첫째, 근내지방도(마블링)입니다. 등심 단면의 지방 무늬를 표준 모형과 비교해 번호(대략 1~9번)로 평가합니다. 육질등급 1++, 1+, 1, 2, 3은 이 번호를 기본으로 합니다. 등급별 번호 구간은 개정될 수 있으니 축산물품질평가원의 최신 기준을 확인하세요.","둘째, 육색입니다. 밝은 선홍색이 좋은 평가를 받습니다. 셋째, 지방색으로 백색에서 유백색이 좋습니다. 넷째, 조직감으로 결이 곱고 탄력이 있는지를 봅니다. 다섯째, 성숙도로 소가 얼마나 늙었는지를 뼈와 연골의 굳은 정도와 고기 색 등으로 판단합니다.","일반적으로 마블링이 높아도 다른 항목이 기준에 못 미치면 등급이 내려갑니다."]},{"h":"등급이 보증하지 않는 것","p":["등급은 등심 한 곳의 상태를 대표로 하므로, 같은 1++ 소라도 우둔이나 설도는 원래 마블링이 거의 없습니다. 손님이 '1++ 우둔이니 마블링이 풍성하겠다'고 기대하면 오해입니다. 또 마블링이 많으면 고소하고 부드럽지만 지방이 부담스러운 손님, 담백한 살코기를 선호하는 손님도 많습니다. 등급이 높다고 모두에게 더 맛있는 것은 아닙니다."]}],"script":"등급은 소의 등심 단면에서 마블링과 색, 조직감, 나이를 종합해서 정합니다. 그래서 같은 1++ 소라도 우둔이나 설도는 원래 마블링이 적은 부위입니다. 담백한 걸 좋아하시면 1등급 살코기도 아주 좋은 선택입니다.","summary":["한우 육질등급(1++~3)은 마지막 등뼈와 첫째 허리뼈 사이 등심 단면에서 마블링, 육색, 지방색, 조직감, 성숙도를 보고 정합니다.","한 곳이 도체 전체를 대표하므로 1++여도 우둔·설도는 마블링이 적습니다.","등급이 높다고 모두에게 더 맛있는 것은 아닙니다. 용도와 취향, 예산에 맞춰 권하세요."],"sources":"축산물품질평가원(ekape.or.kr) 소도체 등급판정 기준 (등급별 번호 구간 최신본 확인)"},{"n":4,"title":"육량등급 A·B·C: 정육이 얼마나 나오는지를 미리 읽는 법","diagram":null,"intro":"육질등급이 맛의 지표라면 육량등급은 돈의 지표입니다. 도체를 사서 손질했을 때 정육이 얼마나 나오는지를 예측하게 해 주기 때문에 원가 관리에 직결됩니다.","sections":[{"h":"육량지수는 무엇으로 계산하나","p":["육량등급은 A, B, C이며 A가 정육 비율이 가장 높습니다. 등급은 육량지수라는 값을 계산해 정하고, 이 값은 세 가지를 이용합니다. 도체중(도체 무게), 등지방두께(등 쪽 지방 층의 두께), 등심단면적(육질 판정과 같은 절개면에서 등심 근육이 차지하는 넓이)입니다.","기본 원리는 간단합니다. 같은 무게의 도체라면 지방이 두꺼울수록 정육이 줄고, 등심 단면이 넓을수록 정육이 늘어납니다."]},{"h":"육질과 육량의 관계","p":["마블링을 높이려면 오래 비육해야 하는데, 이 과정에서 몸 전체 지방도 함께 늘어나는 경향이 있습니다. 그래서 육질 등급이 매우 높은 소가 육량등급은 낮게 나오는 경우가 있습니다. '1++C'는 맛은 좋지만 정육은 적다는 뜻입니다. 반대로 '2A'는 마블링은 적지만 살코기가 많다는 뜻입니다."]},{"h":"실무 해석","p":["도체나 대분할 육을 매입할 때 육량등급이 같은 조건에서 정육률의 차이를 만듭니다. 따라서 kg당 매입단가만 비교하면 안 되고, 육량등급별 예상 수율을 고려한 실제 원가를 비교해야 합니다. 이 계산은 다음 카드(수율)에서 이어집니다."]}],"script":"1++ 뒤에 붙은 A, B, C는 정육이 얼마나 나오는지를 뜻합니다. A는 살코기가 많이 나오는 소, C는 지방이 상대적으로 많은 소입니다.","summary":["육량등급 A·B·C는 정육 비율이며 도체중, 등지방두께, 등심단면적으로 계산한 육량지수로 정합니다.","육질과 육량은 별개입니다. 1++C는 맛은 좋지만 정육은 적습니다.","매입할 때 육량등급을 예상 수율에 반영해 실제 원가로 비교하세요."],"sources":"축산물품질평가원(ekape.or.kr) 소도체 육량등급 판정기준 (육량지수 기준값은 최신본 확인)"},{"n":5,"title":"수율: 싼 고기가 정말 싼 고기인가","diagram":null,"intro":"육류 가공업에서 이익을 결정하는 숫자 하나를 꼽으라면 수율입니다. 매입단가가 같아도 수율이 다르면 실제 원가가 달라지고, 그 차이는 매출이 커질수록 크게 벌어집니다.","sections":[{"h":"수율의 정의","p":["수율은 원료 무게 중에서 판매할 수 있는 제품이 몇 퍼센트 나왔는지를 뜻합니다. 수율 = 제품 무게 ÷ 원료 무게 × 100. 원료 100kg을 손질해 제품이 80kg 나오면 수율 80%입니다. 나머지 20kg은 뼈, 과도한 지방, 힘줄, 핏물과 수분 손실, 절단 부스러기 등입니다."]},{"h":"실제 원가 계산","p":["실제 원가 = 매입단가 ÷ 수율. 예를 들어 kg당 10,000원에 매입해서 수율이 80%면 실제 원가는 12,500원입니다. 만약 다른 원료가 kg당 10,500원인데 수율이 88%라면 실제 원가는 약 11,930원으로 오히려 더 쌉니다. 매입단가가 500원 높아도 더 싼 고기일 수 있다는 뜻입니다.","다만 트리밍 부산물(지방, 뼈 등)을 판매해서 얻는 수입이 있다면 그만큼 실제 원가에서 빼서 계산해야 합니다. 이 부분을 알아야 정확한 손익이 나옵니다."]},{"h":"수율을 실측하는 방법","p":["같은 품목을 손질하기 전에 무게를 재고, 손질 후 제품, 지방, 뼈, 기타를 각각 재서 표에 적습니다. 5~10회 반복해서 평균을 내면 그 품목의 대표 수율이 됩니다. 원료 업체별, 등급별, 작업자별로 나눠 기록하면 어디서 손실이 커지는지 보입니다.","수율이 예상보다 낮게 나오면 원인은 크게 원료 자체(지방 과다, 등급), 작업 방식(트리밍 기준이 과도함), 보관 중 수분 손실 세 가지 중 하나입니다."]}],"script":"kg당 단가가 싸 보여도 손질하고 나면 실제로 쓸 수 있는 고기가 적으면 결국 더 비쌉니다. 저희는 손질 후 실제 나오는 양 기준으로 가격을 계산합니다.","summary":["수율은 제품 무게÷원료 무게×100이고, 실제 원가는 매입단가÷수율입니다. 단가 10,000원에 수율 80%면 12,500원입니다.","단가가 싸도 수율이 낮으면 더 비쌉니다. 부산물 판매 수입은 원가에서 빼서 계산하세요.","주력 품목 수율을 5~10회 실측해 평균을 기록해 두세요."],"sources":"Principles of Meat Science 정육률(cutting yield) 관련 장, 축산물품질평가원 육량등급 자료"},{"n":6,"title":"돼지 대분할 7부위: 위치와 특성","diagram":"pork","intro":"돼지고기는 국내 소비량이 많고 부위별 인기 차이가 매우 커서, 부위 위치와 성질을 아는 것이 수급과 재고 관리의 핵심입니다.","sections":[{"h":"7개 부위의 위치","p":["돼지를 옆에서 볼 때 등 쪽 줄은 앞에서 뒤로 목심(목 뒤쪽에서 어깨 위), 등심(등을 따라 길게 뻗은 근육), 그리고 뒷다리(엉덩이와 허벅지)입니다. 배 쪽에는 삼겹살(배 부위, 갈비뼈 아래)이 있고, 그 위쪽 갈비뼈 주변이 갈비입니다. 앞다리는 어깨와 앞다리이며, 안심은 등심 안쪽 허리뼈 아래에 숨어 있는 가늘고 긴 근육입니다.","소와 같은 원리가 여기도 적용됩니다. 등 쪽 근육(등심, 안심)은 덜 움직이고, 어깨와 다리(앞다리, 뒷다리)는 많이 움직입니다."]},{"h":"부위별 성격","p":["삼겹살은 배 부위로 지방층과 살코기층이 번갈아 층을 이루고 있어 구이에 가장 인기가 높습니다. 목심은 어깨 위 근육으로 근육 사이 지방이 적당히 있어 목살 구이가 됩니다. 등심은 돈가스, 스테이크용으로 지방이 적고 담백합니다. 안심은 가장 부드럽고 지방이 적습니다. 갈비는 갈비뼈 붙은 부위로 찜과 구이에 씁니다.","앞다리와 뒷다리는 지방이 적고 근섬유가 많아 구우면 퍽퍽할 수 있어 불고기, 수육, 제육볶음, 다짐육, 햄과 소시지 등 가공용으로 널리 씁니다."]},{"h":"수급 불균형이 만드는 구조","p":["돼지 한 마리에서 삼겹살 양은 정해져 있는데 수요는 삼겹살과 목살에 몰려 있습니다. 그래서 삼겹살은 상대적으로 비싸고 부족하며, 앞다리와 뒷다리는 상대적으로 재고가 쌓이기 쉽습니다. 이 균형을 어떻게 맞추느냐가 돼지고기 취급 업체의 수익을 좌우합니다."]}],"script":"돼지고기는 배 쪽 삼겹살과 어깨 위 목살이 구이용으로 인기가 높고, 앞다리와 뒷다리는 지방이 적어서 불고기나 수육, 제육으로 하면 훨씬 맛있게 드실 수 있습니다.","summary":["돼지는 안심, 등심, 목심, 앞다리, 뒷다리, 삼겹살, 갈비 7부위로 나뉩니다. 삼겹살과 목심(목살)은 구이, 앞·뒷다리는 불고기·수육·가공용이 맞습니다.","수요가 삼겹과 목살에 몰려 부족한 부위와 남는 부위의 불균형이 생기므로 세트와 가공품으로 균형을 맞춰야 합니다.","소와 같은 원리로 덜 움직이는 등 쪽이 더 부드럽습니다."],"sources":"축산물품질평가원 돼지 부분육 규격 및 명칭 자료 (최신 규격 확인)"},{"n":7,"title":"돼지 특수부위: 항정·가브리·갈매기·등갈비는 어디서 나오나","diagram":"pork-special","intro":"특수부위는 소량만 나와서 단가가 높고 콘텐츠로도 인기가 좋습니다. 위치를 정확히 알아야 '이건 어디에서 나온 고기'라고 자신 있게 설명할 수 있습니다.","sections":[{"h":"대분할에서 나뉘는 소분할","p":["목심에서는 목살과 함께 항정살, 가브리살이 나옵니다. 항정살은 목의 아래 앞쪽, 머리와 앞다리 사이의 지방 낀 근육이며 한 마리에서 양이 적습니다. 가브리살은 목심과 등심이 이어지는 부근에 붙은 근육으로 지방이 적당히 껴서 쫄깃합니다.","갈비 부위에서는 등갈비가 나오고, 갈매기살은 가로막(횡격막)이라는 근육이며 갈비 안쪽에 붙어 있어 내장 근처에서 분리됩니다. 뒷다리에서는 볼기살, 설깃살 등 지방이 적은 살코기가 나옵니다."]},{"h":"왜 특수부위가 맛있고 비싼가","p":["항정살과 가브리살은 근육과 근육 사이에 지방이 자연스럽게 섞여 있어 식감이 다르고 고소합니다. 갈매기살은 가로막 근육이라 일반 살코기보다 조밀하고 쫄깃합니다. 이런 부위는 한 마리에서 나오는 양 자체가 적어 수요에 비해 공급이 부족하고, 가격이 높아집니다."]},{"h":"지방의 성질과 맛","p":["돼지는 소보다 지방이 불포화지방산 비율이 상대적으로 높고 녹는 온도도 낮은 편이라, 같은 조건에서 입안에서 부드럽게 녹고 식어도 덜 굳는 경향이 있습니다. 이 성질이 삼겹살이 식어도 비교적 덜 뻣뻣하게 느껴지는 이유 중 하나입니다."]},{"h":"가공용 부위 활용","p":["앞다리와 뒷다리는 수육, 제육볶음, 다짐육, 소시지, 햄 원료로 많이 쓰입니다. 이런 가공은 인기 없는 부위를 부가가치가 있는 제품으로 바꾸는 방법입니다."]}],"script":"항정살은 돼지 목 아래쪽 근육 사이에 지방이 껴 있는 부위고, 한 마리에서 양이 적어서 귀한 부위입니다. 가브리살은 목심과 등심이 만나는 부근에 있는 쫄깃한 부위입니다.","summary":["항정살(목 아래)·가브리살(목심과 등심 이음)·갈매기살(가로막)은 한 마리에서 소량만 나와 값이 높습니다.","근육 사이에 지방이 섞여 식감과 고소함이 다릅니다.","앞·뒷다리는 불고기·제육·소시지 같은 가공으로 부가가치를 만들 수 있습니다."],"sources":"축산물품질평가원 돼지 부분육 규격 자료, 한국 식육 부위 명칭 표준 (지방 성질은 Lawrie's Meat Science 지방 장 참고)"},{"n":8,"title":"돼지 도체 등급과 품질 이슈 (PSE, DFD)","diagram":null,"intro":"돼지는 등급 못지않게 도축 전후의 스트레스와 pH 관리가 품질을 크게 좌우합니다. 이 지식은 원료를 받을 때 이상 육을 알아보는 눈이 됩니다.","sections":[{"h":"국내 돼지 도체 등급","p":["국내 돼지 도체 등급은 1+, 1, 2 세 단계와 이에 못 미치는 등외로 나뉩니다. 판정에는 도체중과 등지방두께 같은 도체 규격 요소와, 육색·지방색·조직감 등 육질과 외관 요소가 함께 쓰입니다. 소와 달리 마블링 하나로 갈리기보다 규격과 품질의 균형을 보는 성격이 강합니다. 정확한 기준 수치는 개정될 수 있으니 축산물품질평가원의 최신본을 확인하세요."]},{"h":"사후 pH와 품질","p":["도축 후 근육은 젖산이 쌓여 pH가 서서히 내려가고 정상적으로는 일정 수준(대략 5.5 부근)에서 안정됩니다. 이 변화의 속도와 최종값이 고기 색, 보수력(수분을 붙잡는 힘), 식감을 결정합니다."]},{"h":"PSE육과 DFD육","p":["PSE육은 창백하고(Pale), 연하고 물러지며(Soft), 물이 많이 빠지는(Exudative) 고기입니다. 도축 전 스트레스나 열 때문에 도축 직후 pH가 너무 빨리 떨어지면서 단백질이 변성되어 생깁니다. 색이 하얗게 떠 보이고 포장 안에 물이 많이 고입니다.","DFD육은 어둡고(Dark), 단단하며(Firm), 건조한(Dry) 고기입니다. 도축 전 오랜 스트레스로 근육의 에너지가 이미 고갈되어 pH가 충분히 내려가지 않아 생깁니다. 색이 어둡고 보존성이 떨어져 부패하기 쉽습니다."]},{"h":"현장에서의 활용","p":["입고 시 색이 지나치게 창백하고 포장 내 육즙(드립)이 많은 고기는 PSE를 의심해 보세요. 가공 시 수율이 낮게 나오고 식감이 퍽퍽한 원인이 됩니다. 원료 업체별로 이런 상태를 기록하면 거래처 품질 비교에 쓸 수 있습니다."]}],"script":"돼지고기는 도축 전에 스트레스를 받으면 고기가 창백하고 물이 많이 빠지는 경우가 있습니다. 저희는 입고 때 색과 드립을 확인해서 그런 원료는 걸러냅니다.","summary":["돼지 도체 등급은 1+, 1, 2, 등외이며 도체중, 등지방두께 같은 규격과 육질을 함께 봅니다.","PSE육은 창백하고 물러지며 물이 많이 빠지는 고기이고 도축 전 스트레스로 pH가 급락해 생깁니다. DFD육은 어둡고 건조하며 보존성이 떨어집니다.","입고 때 육색과 드립을 확인하면 수율과 품질 관리에 도움이 됩니다."],"sources":"Principles of Meat Science의 사후 대사와 pH 장, 축산물품질평가원 돼지도체 등급판정 기준"},{"n":9,"title":"한우·육우·젖소·수입 소고기: 차이를 정확히 구분하기","diagram":null,"intro":"손님과 거래처가 '국산'과 '한우'를 혼용하는 경우가 많습니다. 정확한 구분은 신뢰이자, 표시 위반을 막는 안전장치입니다.","sections":[{"h":"국내산 소고기의 세 갈래","p":["한우는 한우 품종의 소입니다. 육우는 고기 생산을 목적으로 키운 소로, 젖소 수소가 대표적이며 한우와 젖소의 교잡종 등도 포함됩니다. 젖소는 우유를 생산하다가 도축되는 소를 말합니다. 셋 모두 국내에서 키웠지만 품종, 사육 목적, 육질 특성이 다르고 판매 표기도 달라야 합니다.","한우는 마블링이 잘 형성되는 편이고 가격이 가장 높습니다. 육우는 상대적으로 지방이 적고 가격이 합리적이며, 젖소 고기는 국거리나 가공용으로 많이 쓰입니다."]},{"h":"수입 소고기의 구분","p":["미국산은 곡물로 비육하는 방식이 많고 USDA 등급(Prime, Choice, Select 등)으로 나뉩니다. 호주산은 목초 비육과 곡물 비육이 모두 있고, 호주 고유의 품질 체계(예: MSA)가 있습니다. 뉴질랜드산은 대체로 목초 비육입니다.","사료와 사육 방식은 풍미와 지방 색에 영향을 줍니다. 곡물 비육은 지방이 희고 고소한 편이고, 목초 비육은 지방이 다소 노랗고 풀 향이 나는 경향이 있습니다."]},{"h":"판매 시 주의","p":["표시는 정확해야 합니다. 국내산 육우를 한우로, 수입산을 국산으로 표기하면 원산지 표시 위반으로 처벌받을 수 있습니다. 상세페이지, 견적서, 거래명세서 어디에서도 종류가 명확히 구분되어야 합니다."]}],"script":"국산 소고기 중에는 한우, 육우, 젖소 고기가 있어서 각각 품종과 키운 목적이 다르고, 저희는 이를 정확히 구분해서 표시합니다.","summary":["한우는 한우 품종, 육우는 고기용으로 키운 젖소 수소 등, 젖소는 우유를 생산하다 도축되는 소로 품종과 사육 목적이 다르고 표기도 달라야 합니다.","수입 소고기는 곡물·목초 사육 방식과 등급 체계가 국가마다 달라 지방색과 풍미가 다릅니다.","종류를 정확히 표기하는 것이 신뢰이자 위반 방지입니다."],"sources":"축산물품질평가원, 국립농산물품질관리원 원산지 표시 안내, USDA AMS 소고기 등급 자료, Meat Standards Australia (MSA) 자료"},{"n":10,"title":"원산지 표시와 이력제: 법이 요구하는 것과 신뢰를 만드는 법","diagram":null,"intro":"표시와 이력제는 귀찮은 규제가 아니라, 정확히 지키면 가장 강력한 신뢰 자산입니다. 위반하면 과태료와 영업 리스크가 크므로 정확히 알고 있어야 합니다.","sections":[{"h":"원산지 표시","p":["원산지 표시는 「농수산물의 원산지 표시 등에 관한 법률」에 근거합니다. 축산물은 소매 판매와 음식점 모두 원산지 표시 의무가 있고, 소고기는 국산의 경우 한우, 육우, 젖소 등 종류도 함께 표시합니다. 위반 시 과태료 또는 형사 처벌 대상이 될 수 있습니다. 세부 표시 방법과 위반 기준은 개정될 수 있으니 국립농산물품질관리원의 최신 안내를 확인하세요."]},{"h":"축산물이력제","p":["이력제는 「가축 및 축산물 이력관리에 관한 법률」에 근거한 제도로, 소와 돼지가 태어나거나 수입된 시점부터 사육, 도축, 가공, 판매까지의 정보를 기록해 추적할 수 있게 합니다. 소는 개체마다 12자리 개체식별번호가 부여되고, 돼지는 묶음 단위의 번호를 씁니다. 소비자는 번호로 조회 사이트에서 사육지, 도축장, 등급 등을 확인할 수 있습니다.","가공업체는 이력번호를 받아 기록하고 다음 단계로 정확히 전달할 의무가 있습니다."]},{"h":"신뢰 자산으로 쓰는 법","p":["상세페이지나 포장에 이력번호를 넣고 조회 방법을 안내하면 신뢰가 크게 올라갑니다. 문제가 생겼을 때 이력번호로 원료를 추적해 원인을 빠르게 찾을 수 있다는 점은 HACCP 회수 절차에도 도움이 됩니다."]}],"script":"저희 제품은 이력번호로 어느 농장에서 어느 도축장을 거쳐 왔는지 직접 확인하실 수 있습니다.","summary":["원산지 표시는 법으로 의무이고 위반하면 처벌받습니다. 소와 돼지는 이력제로 사육부터 유통까지 추적됩니다.","이력번호 조회를 안내하면 신뢰 자산이 되고 문제가 생겼을 때 회수 범위를 좁힐 수 있습니다.","입고 이력번호와 출고 제품을 연결하는 기록을 만드세요."],"sources":"축산물이력제 (mtrace.go.kr), 국립농산물품질관리원 원산지 표시 안내"},{"n":11,"title":"시세를 읽는 법: 산지에서 소매까지 가격의 흐름","diagram":null,"intro":"시세를 볼 줄 알면 사야 할 때와 기다려야 할 때, 견적을 올려야 할 때를 구분할 수 있습니다. 시세는 하루 숫자가 아니라 흐름으로 봐야 합니다.","sections":[{"h":"가격의 사슬","p":["축산물 가격은 산지(농가)에서 도매(도축 후 도체 또는 부분육 거래), 소매(마트, 식당)로 이어집니다. 앞 단계의 가격이 움직이면 뒤 단계로 일정 시차를 두고 전달됩니다. 축산물품질평가원의 축산유통정보(ekapepia)에서 소·돼지 도매시세와 소매가격, 산지 가격 등을 확인할 수 있습니다."]},{"h":"어떻게 비교하나","p":["하루 가격 하나만 보면 판단하기 어렵습니다. 전일 대비, 전주 대비, 전년 동기 대비 세 가지를 나란히 봐야 합니다. 특히 전년 동기 대비가 중요한 이유는 계절성이 있기 때문입니다.","삼겹살은 캠핑과 휴가철, 봄 행락철 수요가 늘고, 소고기는 명절 전에 오르는 경향이 있습니다. 시세가 올랐을 때 그것이 계절성 때문인지 구조적 변화인지를 구분해야 합니다."]},{"h":"시세와 재고 전략","p":["일반적으로 상승 초기에는 재고를 확보하고 하락기에는 재고를 최소화하는 것이 기본입니다. 다만 거래처와의 납품 단가가 고정인지 시세 연동인지에 따라 전략이 달라집니다. 고정 단가 계약이라면 시세 상승이 그대로 마진을 깎으므로 재계약 시점을 잡아야 합니다."]},{"h":"기록 습관","p":["삼겹, 목살, 한우 등심, 앞다리 등 주력 4~5개 품목의 매일 시세를 표에 적으세요. 한 달만 쌓여도 자기 사업의 시세 감각이 생깁니다."]}],"script":"요즘 삼겹살 시세가 지난주보다 이만큼 올랐고 작년 같은 시기보다는 이만큼 높습니다. 그래서 가격 조정이 필요한 상황입니다.","summary":["가격은 산지, 도매, 소매 순으로 전달되며 일·주·전년 대비를 계절성과 함께 봐야 합니다.","상승 초기에는 재고 확보, 하락기에는 재고 최소화가 기본이지만 거래처 단가가 고정인지 연동인지에 따라 달라집니다.","주력 4~5개 품목의 시세를 매일 기록하세요."],"sources":"축산유통정보 ekapepia.com (축산물품질평가원), 한국농촌경제연구원 축산관측, aT 농산물유통정보"},{"n":12,"title":"냉장과 냉동: 온도가 고기에 하는 일","diagram":null,"intro":"냉동창고를 3개 운영하는 업체에게 냉동 지식은 곧 품질과 비용입니다. 무엇이 고기를 상하게 하고, 무엇이 품질을 지키는지 이유까지 알아 둡니다.","sections":[{"h":"기준 온도","p":["식품공전에서 냉장은 0~10℃, 냉동은 -18℃ 이하를 기준으로 합니다. 이 수치는 개정될 수 있으니 최신 식품공전을 확인하세요. 냉장 상태에서는 미생물이 서서히 자라기 때문에 보관 기간이 짧고, 냉동에서는 미생물 증식이 사실상 멈춥니다."]},{"h":"얼음결정과 드립","p":["고기 속 수분이 얼면서 얼음결정이 생깁니다. 천천히 얼리면 결정이 크게 자라 근섬유 세포를 찢고, 해동할 때 육즙이 많이 흘러나옵니다(드립). 급속 냉동은 작은 결정을 만들어 조직 손상이 적습니다. 그래서 같은 냉동육이라도 급속 냉동인지가 품질을 가릅니다."]},{"h":"동결화상과 온도 변동","p":["냉동 보관 중 고기 표면의 수분이 승화(얼음이 바로 수증기로 변함)해서 날아가면 표면이 하얗게 마르는 동결화상이 생깁니다. 포장이 헐거우면 심해지고 산화 냄새도 납니다. 또 창고 문을 자주 여닫아 온도가 오르내리면 작은 결정이 합쳐져 큰 결정이 되어 조직을 손상시킵니다."]},{"h":"해동과 재냉동","p":["해동은 냉장 온도에서 천천히 하는 것이 가장 안전하고 품질 손실이 적습니다. 상온 해동은 표면이 위험 온도대에 오래 머물러 위생상 위험합니다. 해동된 고기를 다시 얼리면 조직 손상이 반복되고 세균 증식 위험도 있어 권장하지 않습니다."]}],"script":"저희는 급속 냉동으로 조직 손상을 줄이고, 진공 포장으로 냉동 화상을 막습니다. 해동은 냉장고에서 하루 정도 천천히 해 주시면 육즙이 가장 잘 유지됩니다.","summary":["냉장은 0~10℃, 냉동은 -18℃ 이하이며 급속 냉동은 얼음결정이 작아 해동 때 드립이 적습니다.","동결화상과 온도 변동, 해동 후 재냉동은 품질과 위생을 해칩니다. 해동은 냉장고에서 천천히 하세요.","온도 기록은 HACCP의 핵심 기록입니다."],"sources":"식품의약품안전처 식품공전(최신본), Lawrie's Meat Science 냉장·냉동 장"},{"n":13,"title":"숙성: 부드러워지고 맛이 깊어지는 이유","diagram":null,"intro":"숙성은 프리미엄 상품과 콘텐츠의 단골 주제입니다. 원리를 알면 '오래 두면 무조건 좋다'는 오해를 바로잡고, 원가와 위생 리스크를 함께 설명할 수 있습니다.","sections":[{"h":"사후강직과 숙성","p":["도축 직후 근육은 에너지가 고갈되면서 단단하게 굳는데 이를 사후강직이라고 합니다. 이 시기의 고기는 질깁니다. 시간이 지나면 고기 안의 효소(예: 칼페인, 카텝신)가 근섬유 단백질을 조금씩 분해해 다시 부드러워지고, 단백질이 분해되며 감칠맛 성분(아미노산 등)이 늘어납니다. 이 과정이 숙성입니다."]},{"h":"웻에이징","p":["진공 포장 상태로 냉장 온도에서 숙성시킵니다. 수분 손실이 거의 없어 수율이 좋고 관리가 쉽습니다. 풍미 변화는 상대적으로 완만하며, 약간 신 향이나 육즙 같은 풍미가 납니다. 대부분의 상업적 숙성이 이 방식입니다."]},{"h":"드라이에이징","p":["포장 없이 온도와 습도, 공기 흐름을 관리하는 냉장실에서 표면을 마르게 하며 숙성합니다. 수분이 증발하면서 맛이 농축되고 독특한 풍미(견과류 같은 향)가 납니다. 반면 수분 손실과 겉면 마른 층을 잘라내는 트리밍 때문에 수율이 크게
