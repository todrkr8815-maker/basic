name: 나라장터 청주권 축산·급식 공고 알림

on:
  schedule:
    - cron: "10 22 * * 0-4"   # UTC 22:10 일~목 = 한국시간 월~금 오전 7:10
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 수집·필터·알림
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python g2b-monitor/monitor.py --notify --out report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2b-report
          path: report.md
          retention-days: 30
