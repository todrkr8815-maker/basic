 낮아지고, 전용 설비와 엄격한 위생 관리가 필요합니다. 그래서 가격이 높습니다."]},{"h":"기간과 종류","p":["소고기는 보통 수 주 단위로 숙성하고, 돼지고기는 상대적으로 짧게 숙성하는 편입니다. 숙성 기간이 길수록 무조건 좋은 것은 아니며 목적과 부위, 설비에 따라 적정 기간이 다릅니다. 구체적인 기간과 조건은 설비 사양과 자체 위생 기준에 맞춰 정해야 합니다."]}],"script":"숙성은 고기 안의 효소가 단백질을 천천히 분해해서 더 부드럽고 감칠맛 나게 만드는 과정입니다. 웻에이징은 육즙이 살아 있고, 드라이에이징은 맛이 농축되지만 그만큼 수분이 줄어 가격이 올라갑니다.","summary":["숙성은 사후강직 뒤 효소가 근섬유 단백질을 분해해 부드럽고 감칠맛이 나게 하는 과정입니다.","웻에이징은 수율이 좋고 관리가 쉽고, 드라이에이징은 풍미가 진하지만 수율이 낮고 설비와 위생 관리가 필요합니다.","숙성 상품은 원가와 위생 비용을 먼저 계산하고 시작하세요."],"sources":"Lawrie's Meat Science 숙성 장, Principles of Meat Science 사후 변화 장, 축산물품질평가원 자료"},{"n":14,"title":"2주 복습: 손님 앞에서 설명해 보기","diagram":null,"intro":"지식은 말로 설명할 수 있어야 내 것이 됩니다. 오늘은 새로운 내용 없이 지난 13일치를 소리 내어 설명하는 연습입니다.","sections":[{"h":"복습 방법: 소리 내어 설명하기","p":["카드를 보지 않고 각 주제를 30초씩 소리 내어 설명해 보세요. 손님이나 신입 직원에게 설명한다고 상상하세요. 막히는 부분이 곧 다시 읽어야 할 부분입니다."]},{"h":"핵심 연결 고리","p":["이 2주의 내용은 하나의 흐름으로 이어집니다. 위치가 근육의 운동량을 정하고(1일), 운동량이 결합조직과 부드러움을 정하며(2일), 등급은 그중 일부를 표준화한 지표이고(3~4일), 수율이 원가를 정하며(5일), 돼지도 같은 원리로 부위가 나뉘고(6~8일), 종류 구분과 표시 의무가 신뢰를 만들고(9~10일), 시세와 보관과 숙성이 이익과 품질을 결정합니다(11~13일)."]},{"h":"오늘 할 일","p":["가장 자신 없는 카드 한 장을 다시 읽고, 가장 흥미로웠던 주제 하나를 릴스 대본으로 써 보세요. 그리고 주력 품목 하나의 수율 실측을 시작하세요."]}],"script":"소고기든 돼지고기든 부위가 어디인지, 얼마나 움직이는 근육인지, 그래서 어떤 요리에 맞는지를 알면 손님께 정확하게 권해 드릴 수 있습니다.","summary":["위치가 근육 사용량을, 사용량이 결합조직을, 결합조직이 조리법을 정합니다. 등급은 품질 지표이고 수율은 원가를, 표시와 이력은 신뢰를, 시세·보관·숙성은 이익과 품질을 좌우합니다.","소리 내어 설명해 보는 것이 지식을 내 것으로 만드는 가장 좋은 복습입니다."],"sources":"앞선 13개 카드의 확인처 참고"},{"n":15,"title":"미국산 소고기: 곡물 비육과 USDA 등급을 이해하고 한국 손님에게 권하는 법","diagram":"beef","intro":"한국에 들어오는 수입 소고기는 미국산과 호주산이 대부분을 차지합니다. 그중 미국산은 올해 한국 관세가 0%가 되면서 관심이 커졌습니다. 오늘부터는 수입육을 산지별로 공부합니다. 첫 번째로 미국산이 어떻게 키워지고 어떤 기준으로 등급이 매겨지는지, 그래서 어떤 부위가 한국에서 잘 팔리는지를 이유와 함께 정리합니다.","sections":[{"h":"어떻게 키우나: 방목에서 비육장까지","p":["미국산 소고기의 대부분은 곡물 비육(grain-fed) 방식입니다. 송아지는 먼저 넓은 목초지에서 어미와 함께 자라고, 젖을 뗀 뒤 한동안 풀과 조사료로 키워집니다. 이후 비육장(피드롯)으로 옮겨져 옥수수 같은 곡물 중심의 사료를 몇 달 동안 먹으며 살과 지방을 붙인 뒤 도축됩니다. 사육 기간과 사료 배합은 농장과 업체마다 다르니 구체적인 수치는 업체 자료로 확인하세요.","품종은 마블링이 잘 생기는 앵거스 계통과 그 교잡종의 비중이 높은 것으로 알려져 있습니다. 곡물 사료는 풀보다 에너지 밀도가 높아서 소가 남는 에너지를 근육 사이와 근육 안에 지방으로 쌓습니다. 이것이 마블링(근내지방)입니다. 곡물 비육 소고기는 지방이 희고 고소한 맛이 나고, 풀 위주로 키운 소고기는 지방이 적고 노란빛을 띠며 풀 향이 나는 경향이 있습니다. 호주산과의 차이는 다음 카드에서 자세히 다룹니다.","이 방식 덕분에 마블링이 비교적 고르게 들어간 소고기를 대규모로 안정적으로 공급할 수 있습니다. 한국 시장에서 미국산이 갈비와 차돌박이 같은 구이용 부위로 많이 소비되는 배경입니다."]},{"h":"USDA 등급: Prime, Choice, Select","p":["미국의 소비자용 육질등급은 Prime, Choice, Select 세 단계가 대표적입니다. 이보다 낮은 등급은 주로 가공용과 제조용으로 쓰입니다. 판정은 도체를 12번째와 13번째 갈비뼈 사이에서 잘라 드러난 등심(립아이) 단면에서 마블링 정도와 소의 성숙도(대략의 월령)를 보고 합니다. Prime이 마블링이 가장 풍부하고 Choice, Select 순으로 적어집니다. 세부 기준은 USDA의 최신 등급 표준에서 확인하세요.","육량을 나타내는 등급도 따로 있습니다. 육량등급(Yield Grade)은 1~5 숫자로 표시하고 1이 정육 비율이 가장 높습니다. 한국의 육량등급 A·B·C에서 A가 가장 좋은 것과 방향은 같지만 표기가 숫자라는 점이 다릅니다.","주의할 점은 등급이 등심 단면 한 곳으로 도체 전체를 대표한다는 것입니다. 한우 등급과 같은 한계입니다. Prime이어도 우둔이나 설도처럼 원래 지방이 적은 부위는 마블링이 풍부하지 않습니다. 그리고 한우 1++와 USDA Prime을 같은 급으로 말하면 안 됩니다. 판정 기준과 단면, 사육 방식, 월령이 모두 달라 직접 비교할 수 없습니다."]},{"h":"한국에서 잘 팔리는 부위: 갈비와 차돌박이는 왜 구이용인가","p":["갈비는 소 도식의 갈비 영역, 즉 갈비뼈를 감싼 근육과 지방층입니다. 이 부위는 호흡할 때 갈비뼈가 움직이고 몸통을 받치는 데 쓰여서 결합조직이 어느 정도 있습니다. 그런데 지방층이 두껍게 끼어 있어 센 불에 구우면 지방이 녹아 고기 사이로 퍼지며 연해지고 풍미가 강해집니다. 그래서 뼈째 구이나 얇게 저며 펼친 LA갈비 형태로 많이 팝니다.","차돌박이는 양지 중에서도 가슴 쪽 부위입니다. 근육 사이 근막과 지방이 얇은 층을 이루고 있습니다. 양지는 원래 결합조직이 많아 오래 끓여야 부드러워지는 부위인데, 차돌박이는 아주 얇게 썰어 몇 초만 구우면 결합조직이 질기게 느껴지지 않고 지방층이 녹아 고소해집니다. 얇게 써는 일은 반냉동 상태에서 하는 것이 쉬워서 수입 냉동 차돌박이가 흔한 것으로 알려져 있습니다.","수입육은 반드시 원산지를 '미국산'으로 표시해야 하고 한우로 오인되게 표기하면 안 됩니다. 등급을 적을 때도 'USDA Choice'처럼 기관과 등급을 함께 적고 한우 등급 표기와 섞어 쓰지 마세요."]},{"h":"관세와 시장 변화가 영업에 주는 의미","p":["앞선 브리핑에서 보았듯이 한국은 올해 1월부터 미국산 소고기 관세가 0%가 되었고, 호주산은 7월 말 안전장치 물량을 채워 연말까지 높은 관세가 적용 중이라는 보도가 있습니다. 미국육류수출협회 자료에서도 8월 미국산 소고기의 한국 수출이 1년 전보다 14% 늘었고, 한국 수입업체들이 호주산 대신 미국산으로 눈을 돌린 영향으로 설명됩니다. 수치와 관세율은 변동될 수 있으니 거래 전에 최신 자료를 확인하세요.","미국산은 냉장과 냉동으로 들어옵니다. 냉장은 맛과 식감이 좋지만 소비기한이 짧아 재고 회전이 중요하고, 냉동은 보관이 편하지만 해동과 드립 관리가 필요합니다. 한국이 허용하는 월령 등 수입 요건은 검역 기준이 바뀔 수 있으니 최신 기준을 확인하세요."]}],"script":"미국산 소고기는 곡물을 먹여 키워서 지방이 고르게 박히고 고소한 맛이 특징입니다. 등급은 Prime, Choice, Select 순으로 마블링이 줄어듭니다. 갈비와 차돌박이는 지방층 덕분에 구이에 잘 맞아서 한국에서 많이 찾으십니다. 한우와는 기준이 달라 직접 비교하지 않고, 용도와 예산에 맞춰 추천해 드립니다.","summary":["미국산은 곡물 비육과 앵거스 계통 덕에 마블링이 고르고 고소합니다.","USDA Prime·Choice·Select는 12~13번째 갈비뼈 사이 단면의 마블링과 성숙도로 정하며 한우 등급과 직접 비교하면 안 됩니다.","갈비와 차돌박이는 지방층 덕분에 구이용이며 올해 한국의 미국산 관세 0% 변화가 수요를 키웁니다."],"sources":"USDA AMS 소고기 등급 표준(최신본 확인), 미국육류수출협회(USMEF) 한국 시장 자료, 호주 MLA 한국 시장 요약, 축산물품질평가원 한우 등급 기준(비교용)"},{"n":16,"title":"호주산 소고기: 풀 먹은 소와 곡물 비육 소, 그리고 AUS-MEAT·MSA 등급","diagram":"beef","intro":"호주산은 미국산과 함께 한국 수입 소고기의 두 축입니다. 올해는 한국의 안전장치 관세 때문에 호주산 수입 흐름이 크게 달라졌습니다. 어제 미국산을 공부했으니 오늘은 호주산이 어떻게 키워지는지, 풀 먹은 소와 곡물 먹은 소는 맛이 왜 다른지, 호주가 쓰는 등급 체계는 무엇인지, 그리고 어떤 부위가 한국에서 불고기와 샤브샤브에 잘 맞는지를 이유와 함께 정리합니다.","sections":[{"h":"어떻게 키우나: 넓은 목초지와 선택적 곡물 비육","p":["호주는 광활한 목초지에서 소를 키우는 나라입니다. 대부분의 소가 초지에서 자라고, 일부는 도축 전 일정 기간 비육장에서 곡물을 먹습니다. 그래서 호주산은 풀 위주로 키운 그라스페드(grass-fed)와 곡물로 마무리한 그레인페드(grain-fed)가 함께 유통됩니다. 곡물 비육 기간은 짧게는 두어 달부터 일본 시장용처럼 아주 길게 하는 경우까지 다양합니다. 정확한 기간은 업체와 제품 규격마다 다르니 자료로 확인하세요.","품종은 남부는 앵거스와 헤리퍼드 계통이 많고, 더운 북부는 더위에 강한 브라만 계통 교잡종이 많습니다. 와규 교잡종과 순종도 생산됩니다.","풀과 곡물은 고기를 이렇게 다르게 만듭니다. 풀 위주로 키우면 에너지 섭취가 상대적으로 낮고 움직임이 많아 근내지방(마블링)이 적고 살코기 맛이 진합니다. 또 풀에 든 카로티노이드 색소가 지방에 쌓여 지방이 노란빛을 띠는 경향이 있습니다. 곡물 비육은 에너지 섭취가 많아 마블링이 늘고 지방이 희며 고소한 맛이 납니다. 같은 호주산이라도 어떤 방식으로 키웠는지에 따라 용도가 달라집니다."]},{"h":"등급과 품질 보증: AUS-MEAT와 MSA","p":["AUS-MEAT는 호주 육류 거래의 표준 언어입니다. 부위 규격, 지방 두께, 지방 색, 마블링 정도 등을 숫자와 코드로 표준화해 수출업체와 수입업체가 같은 기준으로 대화하게 해 줍니다. 마블링 점수는 0~9 같은 숫자로 표시되는 경우가 많습니다. 세부 코드는 최신 AUS-MEAT 표준에서 확인하세요.","MSA(Meat Standards Australia)는 소비자가 실제로 먹어 보고 평가한 식미 자료를 바탕으로 만든 품질 보증 프로그램입니다. 마블링만 보는 것이 아니라 소의 월령, 사육과 도축 전후 관리, 숙성 같은 요소를 함께 반영해 부위와 조리법별로 예상 식미를 계산합니다. 같은 부위도 구이용으로 먹을 때와 스튜로 먹을 때 평가가 다를 수 있다는 점이 특징입니다.","주의할 점은 AUS-MEAT 마블링 점수나 MSA 표시를 한우 등급이나 USDA 등급과 직접 같은 급으로 말하면 안 된다는 것입니다. 호주 고유의 기준이라고 설명하세요."]},{"h":"한국에서 호주산은 어떻게 쓰이나: 우둔·설도·앞다리는 왜 불고기용인가","p":["한국 시장에서 곡물 비육 호주산은 갈비와 척아이롤처럼 구이용으로, 풀 먹은 호주산은 우둔, 설도, 앞다리처럼 불고기와 샤브샤브, 장조림용으로 많이 쓰입니다.","우둔과 설도는 소 도식에서 엉덩이와 뒷다리 쪽에 있는 큰 근육입니다. 이 근육들은 소가 걷고 몸을 밀어낼 때 쓰여서 근섬유가 길고 굵으며 지방이 적습니다. 그래서 얇게 썰어 양념에 재웠다가 짧게 익히는 불고기, 샤브샤브, 또는 삶아서 결대로 찢는 장조림처럼 두껍지 않거나 습열을 쓰는 조리에 잘 맞습니다. 지방이 적은 부위를 두껍게 센 불에 오래 구우면 퍽퍽해지기 쉽습니다.","앞다리는 어깨에서 앞다리로 이어지는 부위로 역시 많이 움직이는 근육입니다. 가격이 상대적으로 낮고 불고기와 국거리에 널리 쓰입니다. 양념에 들어가는 배, 양파, 설탕 같은 재료는 단백질을 조금 풀어 주어 살코기 부위를 부드럽게 해 주는 데 도움이 됩니다."]},{"h":"관세·시장 변화가 영업에 주는 의미","p":["앞선 브리핑에서 본 것처럼 호주산은 올해 7월 말 한국의 안전장치 물량 기준을 넘어 높은 관세가 적용 중이라는 보도가 있고, 인상 전에 물량을 미리 들여와 올해 수입된 호주산의 대부분이 냉동이라고 합니다. 관세와 적용 기간은 바뀔 수 있으니 견적 때마다 최신 공지를 확인하세요.","호주산 단가가 높아진 시기에는 미국산이나 국내산 육우, 또는 부위 변경으로 거래처 원가를 맞추는 제안이 도움이 됩니다. 호주산을 쓰는 거래처에는 지난 카드에서 배운 미국산 갈비·차돌박이 대안과 함께 호주산 우둔·설도 불고기용 슬라이스 제안을 같이 준비해 두세요."]}],"script":"호주산은 넓은 초지에서 키워 지방이 적고 담백한 풀 먹은 소고기와, 마지막에 곡물을 먹여 마블링을 높인 곡물 비육 소고기가 함께 있습니다. 구이는 곡물 비육 호주산이 잘 맞고, 불고기나 샤브샤브는 우둔과 설도 같은 살코기를 얇게 썰어 쓰시면 맛있습니다.","summary":["풀 먹은 호주산은 지방이 적고 노란빛이며, 곡물 비육은 마블링이 많고 지방이 희고 고소합니다.","AUS-MEAT는 규격 표준이고 MSA는 소비자 식미 기반 보증이며 한우·USDA 등급과 직접 비교하지 않습니다.","우둔·설도·앞다리는 불고기·샤브샤브·장조림에 맞고, 호주산 관세가 높은 시기에는 미국산·육우 대안을 함께 제안하세요."],"sources":"호주축산공사(MLA) MSA 및 AUS-MEAT 자료(최신 표준 확인), MLA 한국 시장 요약, Lawrie's Meat Science(사료와 지방 색·풍미), 축산물품질평가원 한우 등급(비교용)"},{"n":17,"title":"수입 돼지고기 산지 지도: 미국·캐나다·스페인·브라질은 어떻게 다른가","diagram":"pork","intro":"올해 1~7월 한국의 돼지고기 수입은 1년 전보다 14% 넘게 늘었고 그중 대부분이 냉동입니다. 한우와 국산 돼지고기 값이 오를수록 수입 돼지고기를 찾는 곳이 많아지니, 어디서 어떻게 키운 고기인지 설명할 수 있어야 합니다. 오늘은 수입 돼지고기의 주요 산지를 정리하고, 삼겹살과 목살이 어느 부위이며 왜 수입 냉동 상태로 많이 유통되는지를 이해합니다.","sections":[{"h":"수입 돼지는 어떻게 키우나","p":["수입 돼지고기를 내는 주요 산지의 돼지는 대부분 축사에서 곡물 사료로 키운 뒤 생후 대략 6개월 전후에 도축합니다. 품종은 랜드레이스, 라지화이트, 듀록을 교배한 3원 교잡이 널리 쓰입니다. 듀록은 근내지방이 잘 생기고 육질이 좋아 고기 맛을 끌어올리는 역할을 한다고 알려져 있습니다. 구체적인 품종 구성과 사육 기간은 농장과 업체마다 다르니 업체 자료로 확인하세요.","사료는 산지의 곡물 사정에 따라 다릅니다. 미국과 브라질은 옥수수와 대두를 많이 쓰고, 유럽은 보리와 밀 같은 곡류 비중이 높습니다. 사료가 싸고 풍부한 지역일수록 생산비가 낮아 수출 가격 경쟁력이 커집니다. 앞선 뉴스에서 브라질이 증산과 수출 확대를 이끌고 중국이 수입을 줄이는 이유도 이런 생산비와 공급 구조와 연결됩니다."]},{"h":"산지별 특징: 미국, 캐나다, 스페인, 브라질","p":["미국은 대규모 계열화 생산으로 규격이 일정하고 물량이 큰 산지입니다. 한국으로는 삼겹살과 앞다리 같은 냉동 부위가 많이 들어옵니다. 캐나다는 미국과 비슷한 곡물 사육 체계로 삼겹살과 목살이 한국 시장에서 오래 쓰여 왔습니다. 스페인은 유럽 최대의 돼지고기 생산국이자 수출국인데, 지난해 말 발생한 ASF로 일부 국가가 수입을 중단한 일이 있어 질병 소식에 민감합니다. 브라질은 생산과 수출이 빠르게 늘고 있는 산지입니다. 한국이 브라질산 돼지고기를 허용하는 범위는 검역 기준이 바뀔 수 있으니 최신 기준을 확인하세요.","산지에 따라 규격(지방 두께, 부위 손질 방식), 운송 기간, 냉동 방식이 다르고 같은 삼겹살도 가격 차이가 납니다. 수입 견적을 받을 때는 산지, 부위 규격, 포장 단위, 냉동 시점과 소비기한, 통관 일정을 함께 확인해야 합니다."]},{"h":"삼겹살과 목살은 어느 부위이고 왜 수입 냉동이 흔한가","p":["삼겹살은 돼지 도식에서 배 쪽, 갈비뼈 아래에 있는 부위입니다. 이 부위는 몸을 받치고 배를 감싸는 근육과 지방이 겹겹이 층을 이루고 있어 구우면 지방이 녹아 살코기를 적시면서 고소해집니다. 목살은 목심 부위로 어깨 위에서 목으로 이어지는 근육입니다. 근육 사이에 지방이 적당히 섞여 있어 구이용으로 좋습니다.","수입 삼겹살과 목살이 대부분 냉동으로 들어오는 이유는 장거리 해상 운송과 보관 기간을 견디기 위해서입니다. 냉동하면 미생물 증식이 사실상 멈추고 재고를 조절하기 쉬워 수입 물량의 대부분이 냉동입니다. 대신 해동 과정에서 드립이 생기므로 냉장고에서 천천히 해동하고 재냉동하지 않는 관리가 품질을 좌우합니다. 냉동 원료의 수율은 해동 후 손실까지 포함해 실측해야 정확합니다."]},{"h":"고객에게 이렇게 권하세요","p":["국산 냉장 삼겹살과 수입 냉동 삼겹살은 가격 차이가 큰 편이고 맛과 식감, 쓰임새도 다릅니다. 가격이 중요한 단체 급식이나 보쌈, 대량 구이에는 수입 냉동이 맞고, 신선함과 국산 이미지가 중요한 고깃집에는 국산 냉장을 권하는 식으로 용도를 나눠 제안하세요. 원산지를 정확히 표기하고 국산과 수입이 섞이지 않도록 입고와 소분 단계에서 구분해야 합니다."]}],"script":"수입 삼겹살은 대부분 곡물 사료로 키운 돼지를 냉동해서 들여오는 제품이라 가격이 합리적이고 물량이 안정적입니다. 국산 냉장은 신선함이 강점이고요. 쓰임새와 예산에 맞춰 골라 드립니다. 어느 나라 제품인지 표시는 항상 정확히 해 드립니다.","summary":["수입 돼지고기의 주요 산지는 미국, 캐나다, 스페인, 브라질이며 대부분 축사에서 곡물 사료로 키운 3원 교잡 돼지입니다. 사료가 싼 지역일수록 생산비가 낮습니다.","삼겹살(배 쪽)과 목살(목심)은 지방과 근육이 어우러져 구이에 맞고, 장거리 운송 때문에 수입품은 대부분 냉동이며 해동 관리가 품질을 좌우합니다.","수입 견적은 산지, 규격, 냉동 시점, 소비기한을 함께 확인하고, 용도(대량·단체 vs 신선·국산 이미지)에 따라 국산과 수입을 나눠 제안하세요."],"sources":"USDA FAS 가축·축산물 보고서(산지별 생산·수출 최신본 확인), 축산물품질평가원 돼지 부분육 자료, 한국육류유통수출협회 수입 통계(최신본 확인), Lawrie's Meat Science(돼지 육질 장)"},{"n":18,"title":"유럽산 돼지고기: 스페인·독일·네덜란드, 그리고 족발은 왜 오래 삶을까","diagram":"pork","intro":"한국 수입 돼지고기에서 유럽산은 미국·캐나다산과 함께 큰 축입니다. 올해는 스페인의 ASF로 유럽 안의 수출 지형이 크게 바뀌어, 유럽산을 취급한다면 질병과 허용 범위 소식에 민감해야 합니다. 오늘은 유럽 돼지가 어떻게 키워지는지, 어느 나라가 주요 수출국인지, 족발과 삼겹살·목살·등갈비가 몸의 어디이고 왜 그렇게 조리하는지를 정리합니다.","sections":[{"h":"유럽 돼지는 어떻게 키우나","p":["유럽의 돼지도 대부분 축사에서 곡물 사료로 키웁니다. 사료는 미국이나 브라질이 옥수수와 대두를 많이 쓰는 것과 달리 보리, 밀 같은 곡류와 수입 대두박을 섞어 쓰는 경우가 많습니다. 사료의 지방산 조성은 돼지 지방의 단단함과 풍미에 영향을 주기 때문에 같은 삼겹살이라도 산지에 따라 지방의 느낌이 조금 다를 수 있습니다. 이 차이는 경향일 뿐이어서 업체 자료와 실제 샘플로 확인하는 것이 안전합니다.","품종은 듀록 외에 근육량이 많은 계통(피에트레인 등)을 교배에 널리 쓰는 것으로 알려져 있습니다. 유럽연합은 동물복지 기준이 비교적 엄격한 편이라고 알려져 있으며, 세부 규정은 국가와 농장마다 다릅니다. 구체적인 사육 기준은 수출업체의 인증 자료로 확인하세요."]},{"h":"주요 수출국과 올해의 변화: 스페인, 독일, 네덜란드","p":["스페인은 유럽 최대의 돼지고기 생산국이자 수출국입니다. 그런데 지난해 말 야생 멧돼지에서 ASF가 확인되면서 일부 국가가 수입을 중단했고, 올해 상반기 스페인의 수출은 1년 전보다 약 18% 줄었다고 보도됐습니다. 다만 한국이 비발생 지역에서 나온 스페인산 돼지고기는 받아들인다는 보도가 있어, 질병 때문에 한꺼번에 막히는 것이 아니라 지역별로 허용 여부가 나뉘는 지역화 방식이 적용되고 있습니다. 한국의 현재 허용 범위는 반드시 최신 공지로 확인하세요.","스페인의 빈자리를 독일이 채우고 있습니다. 올해 상반기 독일의 수출은 약 29% 늘어 18만 9천 톤이었다고 합니다. 네덜란드와 덴마크도 큰 수출국이지만 국가별로 가격 수준과 주력 품목이 다릅니다. 유럽 전체로는 돼지고기 공급이 넉넉하고 수요가 약해 가격이 낮은 흐름입니다."]},{"h":"족발·삼겹살·등갈비는 몸의 어디이고 왜 이렇게 조리하나","p":["족발은 도식의 앞다리와 뒷다리 끝, 발목 아래 부위입니다. 이 부위는 몸무게를 받치고 움직임이 많아 뼈, 힘줄, 껍질이 많고 콜라겐이 풍부합니다. 콜라겐은 물에서 오래 삶으면 젤라틴으로 풀려 쫀득하고 부드러운 식감과 진한 국물이 나옵니다. 그래서 족발은 간장 양념에 오래 삶는 조리법이 맞고, 구이로는 쓰지 않습니다. 수입 족발의 상당 부분이 유럽과 북미산으로 알려져 있으니 정확한 산지 비중은 통계로 확인하세요.","삼겹살은 도식의 배 쪽, 갈비뼈 아래에 있는 부위로 지방과 살코기가 층을 이루어 구이와 보쌈에 맞습니다. 등갈비는 도식의 갈비 영역, 즉 갈비뼈 주변의 살로 뼈와 힘줄이 붙어 있어 오래 굽거나 조리면 뼈 주변의 지방과 콜라겐이 녹아 부드러워집니다. 목살은 목심 부위로 근육 사이에 지방이 있어 구이에 알맞습니다."]},{"h":"영업에서 챙길 점","p":["유럽산을 취급할 때는 같은 나라라도 수출작업장과 지역에 따라 허용 여부가 달라질 수 있으니 입고 서류를 확인해야 합니다. 유럽산은 해상 운송 기간이 길어 납기가 늦어질 수 있으므로 재고와 일정에 여유를 두세요. 가격은 유럽 시장이 약세라 협상에 유리하지만 ASF 같은 질병 소식으로 공급이 갑자기 바뀔 수 있으니 한 산지에만 의존하지 말고 미국·캐나다산 대안을 함께 준비하는 것이 안전합니다."]}],"script":"유럽산 돼지고기는 보리와 밀 같은 곡류 사료로 키우고 동물복지 기준이 엄격한 편입니다. 올해는 ASF 때문에 나라와 지역별 허용 여부가 계속 바뀌고 있어서, 저희는 입고 때 원산지와 작업장 서류를 꼭 확인합니다. 가격은 지금 유리한 편이고, 족발이나 보쌈처럼 오래 삶는 메뉴에도 잘 맞습니다.","summary":["유럽산 돼지고기는 보리·밀 같은 곡류 사료와 비교적 엄격한 동물복지 기준으로 키우며, 스페인·독일·네덜란드·덴마크가 주요 수출국입니다.","올해는 스페인 ASF로 스페인 수출이 상반기 약 18% 줄고 독일이 약 29% 늘었으며, 한국을 포함한 여러 나라가 지역 단위로 수입 허용 여부를 정합니다.","족발(다리 끝)은 콜라겐이 많아 오래 삶고, 삼겹살·목살은 구이, 등갈비는 뼈 주변 지방과 콜라겐이 녹도록 오래 굽거나 조려 먹습니다. 질병 소식에 대비해 산지를 분산하세요."],"sources":"EU 집행위원회 돼지 가격 자료, AHDB 유럽 돼지고기 시황, USDA FAS 가축·축산물 세계 시장 보고서(최신본 확인), 한국 농림축산식품부 수입위생 공지(허용 지역·작업장 최신 확인), Lawrie's Meat Science"},{"n":19,"title":"시세는 왜 움직일까: 소는 느리고 돼지는 빠른 이유, 그리고 사료·환율·질병","diagram":null,"intro":"앞선 브리핑에서 한우 도매가는 높게 유지되고 돼지 도매가는 연초 전망보다 높거나 내려가는 등 소와 돼지의 가격 움직임이 다르게 나타났습니다. 이 차이에는 이유가 있습니다. 오늘은 시세를 움직이는 다섯 가지 요인(사육두수, 사료가격, 환율, 질병, 생산 사이클)을 소와 돼지로 나눠 정리하고, 어떤 순서로 확인하면 되는지 영업과 재고 판단에 연결합니다.","sections":[{"h":"소는 느리게 움직인다: 공급이 늘기 어려운 구조","p":["소는 송아지를 낳는 데 한 번에 보통 한 마리이고, 태어나서 도축 체중까지 키우는 데 한우는 대략 2년 반이 넘게 걸립니다. 그래서 가격이 올라도 농가가 곧바로 공급을 늘릴 수 없고, 공급을 줄이면 몇 년 동안 그 영향이 이어집니다. 올해 국내 한·육우 사육이 2분기에 1년 전보다 4.9% 줄고 한우 도축이 9% 안팎 줄 것이라는 전망이 나온 것도 몇 해 전부터 이어진 가임 암소 감소의 결과로 설명됩니다. 가임 암소가 줄면 몇 년 뒤 송아지가 줄고 그다음 도축 마릿수가 줄기 때문입니다.","세계적으로도 같습니다. 미국은 소 사육 마릿수가 75년 만에 가장 적은 수준이라 소고기 가격이 기록적으로 높습니다. 소 시장은 한 번 방향이 잡히면 몇 년씩 가는 경향이 있어서, 단기 시세 등락에 일희일비하기보다 사육두수와 가임 암소 추세를 보는 것이 중요합니다."]},{"h":"돼지는 빠르게 움직인다: 약 1년짜리 사이클","p":["돼지는 임신 기간이 약 114일이고 한 번에 여러 마리를 낳으며 생후 6개월 전후에 도축합니다. 그래서 돈가가 오르면 농가가 어미돼지를 늘리고, 1년 안팎 뒤에 공급이 몰려 가격이 내려가는 오르내림(돼지 사이클)이 자주 나타납니다. 중국이 올해 돼지 가격이 크게 내려가자 어미돼지를 줄이는 정책을 쓰고 가격이 4월 저점에서 25% 넘게 반등한 것도 같은 구조입니다.","돼지는 공급이 빨리 늘고 줄기 때문에 가격이 소보다 변동성이 큽니다. 월 단위로 시세를 보고 재고를 짧게 가져가는 전략이 소고기보다 중요합니다."]},{"h":"사료, 환율, 질병이 비용과 공급을 흔든다","p":["사료는 생산비의 큰 부분입니다. 한국은 옥수수와 대두박 같은 사료 곡물을 대부분 수입해서 국제 곡물 가격과 환율이 함께 사료비에 반영됩니다. 원화가 약해져 달러 환율이 오르면 사료비와 수입 육류 단가가 함께 올라 국내 가격에도 영향을 줍니다.","질병은 공급을 갑자기 바꿉니다. ASF가 발생하면 살처분으로 국내 공급이 줄고 수출입이 중단되며, 스페인 ASF처럼 한 나라의 수출이 막히면 세계 가격이 흔들립니다. 질병 소식은 예측하기 어렵기 때문에 방역 당국 공지를 정기적으로 확인하고, 한 산지에만 의존하지 않는 것이 가장 좋은 대비입니다."]},{"h":"어떤 순서로 확인하나: 시세 판단 체크리스트","p":["첫째, 국내 사육두수와 도축두수(분기별 가축동향조사, 축산유통정보)입니다. 둘째, 수입량과 수입 단가(관세청, 협회 통계)입니다. 셋째, 환율과 사료 곡물 가격입니다. 넷째, 질병 발생과 수출입 제한 공지입니다. 다섯째, 주요 수출국의 정책과 무역 변화입니다. 예를 들어 중국이 올해 소고기 수입에 쿼터를 두면서 브라질과 호주 물량이 다른 시장으로 흘러가는 일은 아시아 수입 소고기 가격에 영향을 줍니다.","이 다섯 가지를 월 1회 메모표로 정리하면 시세 방향을 거래처에 설명하기 쉬워집니다. 고정 단가 계약 거래처에는 시세 연동 조항이나 분기별 조정 조건을 제안하는 근거로 쓸 수 있습니다."]}],"script":"소고기는 송아지부터 도축까지 2년 반 넘게 걸려서 한 번 공급이 줄면 몇 년 가는 반면, 돼지고기는 1년 안팎으로 공급이 늘고 줄어서 가격이 더 자주 움직입니다. 저희는 사육두수, 환율, 질병 소식을 매달 점검해서 가격이 어떻게 갈지 미리 말씀드리고 있습니다.","summary":["소는 송아지부터 도축까지 2년 반 넘게 걸려 공급이 한 번 줄면 오래 가고, 돼지는 임신 약 114일과 생후 6개월 도축으로 1년 안팎의 가격 사이클이 나타납니다.","사료와 환율은 생산비와 수입 단가를, 질병과 무역 정책은 공급과 수출입을 갑자기 바꿉니다.","사육두수, 수입량, 환율·사료, 질병 공지, 주요국 정책 다섯 가지를 월 1회 메모표로 점검하고 고정 단가 거래처에는 시세 연동 조항을 제안하세요."],"sources":"한국농촌경제연구원 농업관측, 국가데이터처 가축동향조사(최신본 확인), 축산물품질평가원 축산유통정보, USDA FAS 가축·축산물 보고서, OECD-FAO Agricultural Outlook (최신본 확인)"},{"n":20,"title":"뉴질랜드·브라질·아르헨티나 소고기: 풀로 키우는 산지와 가공용 살코기 원료","diagram":"beef","intro":"미국과 호주 다음으로 눈여겨볼 소고기 산지는 풀 중심으로 소를 키우는 뉴질랜드, 브라질, 아르헨티나입니다. 이 나라들은 올해 중국의 쿼터 관세 때문에 수출 방향을 바꾸고 있어 시장 변화의 중심에 있습니다. 오늘은 이 산지들이 소를 어떻게 키우는지, 품종이 육질을 어떻게 바꾸는지, 그리고 이 고기들이 왜 주로 살코기 부위와 가공용 원료로 쓰이는지를 정리합니다.","sections":[{"h":"풀로 키우는 세 나라: 방목 환경과 특징","p":["뉴질랜드는 연중 풀이 자라는 온대 기후 덕분에 대부분의 소를 풀 위주로 방목해 키웁니다. 뉴질랜드 소고기 생산에는 젖소 농가에서 나오는 소의 비중도 상당한 것으로 알려져 있어 소고기가 낙농과 함께 만들어지는 구조입니다. 한국에는 양고기로 더 잘 알려져 있고 소고기 수입 비중은 크지 않습니다. 정확한 수입 비중은 통계로 확인하세요.","브라질은 세계 최대급 소고기 수출국으로 넓은 열대·아열대 초지에서 소를 풀로 키우고, 일부는 곡물 비육장에서 마무리합니다. 사육 비용이 낮아 가격 경쟁력이 가장 큰 산지로 꼽힙니다. 아르헨티나는 팜파스 초원에서 방목하는 풀 먹인 소고기 전통이 있는 나라로 앵거스와 헤리퍼드 계통을 많이 키웁니다. 올해 미국이 아르헨티나산 쇠고기 수입 한도를 늘리고 중국 쿼터에도 접근하면서 존재감이 커졌습니다."]},{"h":"품종이 육질을 바꾼다: 앵거스·헤리퍼드와 브라만·네로레","p":["앵거스와 헤리퍼드 같은 유럽 계통은 마블링이 잘 생기고 육질이 부드러운 편입니다. 반면 브라질의 네로레와 같은 브라만(제부) 계통은 더위와 해충에 강해 열대 초지에서 잘 크지만 근내지방이 적고 고기가 덜 부드러운 경향이 있습니다. 브라만 계통 소는 도축 후 근육 단백질을 분해해 연하게 만드는 효소(칼페인)의 작용을 억제하는 칼파스타틴이라는 물질이 많은 것으로 알려져 있어, 같은 기간 숙성해도 연해지는 정도가 작을 수 있습니다. 앞서 배운 숙성 원리와 연결되는 내용입니다.","그래서 이런 산지의 소고기는 지방이 적은 대신 근육이 많은 살코기 부위가 주력이고, 부드러움을 키우기 위해 숙성, 얇은 슬라이스, 양념 절임, 습열 조리 같은 방법이 중요해집니다."]},{"h":"어떤 부위와 용도로 쓰이나: 우둔·설도·앞다리와 분쇄용 원료","p":["이 산지의 수출품은 소 도식에서 엉덩이와 뒷다리의 우둔과 설도, 어깨 쪽 앞다리처럼 근육이 크고 지방이 적은 부위가 많습니다. 이 부위는 많이 움직이는 큰 근육이라 근섬유가 길고 지방이 적어서, 두껍게 구우면 퍽퍽하지만 얇게 썰어 불고기, 샤브샤브, 장조림, 육포, 햄버거 패티 같은 가공용으로 쓰기에 알맞습니다.","또 하나 알아 둘 것은 분쇄용 살코기 원료입니다. 거래에서 '90CL'이라고 부르는 제품은 화학적 살코기 비율이 90%라는 뜻으로 지방이 10% 정도 섞인 정육 부스러기입니다. 햄버거 패티와 분쇄육 가공에 쓰이며 국제 가격이 정해져 있어 시세 지표로도 쓰입니다. 올해 이 원료는 미국의 수입 확대와 재고 때문에 가격이 약세라는 보도도 있습니다."]},{"h":"시장 변화와 영업 포인트","p":["중국이 올해 소고기에 쿼터를 두고 초과 물량에 높은 관세를 붙이면서 브라질과 호주의 중국행 물량이 다른 시장으로 옮겨 가고 있습니다. 브라질의 미국 수출은 9월에 금액으로 500% 넘게 늘었다는 보도가 있습니다. 이런 물량 재편은 아시아 시장의 가격 경쟁에도 영향을 줄 수 있습니다. 다만 한국이 브라질과 아르헨티나산 소고기를 허용하는 범위는 검역 기준에 따라 달라지므로 취급 전에 반드시 최신 공지를 확인해야 합니다.","거래처에는 가공용과 분쇄육, 불고기·샤브샤브용 슬라이스 제안이 가장 현실적입니다. 가격 경쟁력이 있는 원료를 확보하되, 산지와 허용 여부, 소비기한, 냉동 이력을 입고 서류로 꼭 확인하세요."]}],"script":"풀로 키운 남미와 뉴질랜드산 소고기는 지방이 적고 살코기 맛이 진한 것이 특징입니다. 구이용보다는 얇게 썰어 불고기나 샤브샤브, 장조림, 햄버거 패티처럼 쓰시면 가격 대비 만족도가 높습니다. 산지와 한국 수입 허용 여부는 항상 확인해서 안내해 드립니다.","summary":["뉴질랜드, 브라질, 아르헨티나는 풀 중심 방목이 기본이며 브라질은 비용이 낮고 아르헨티나는 팜파스 방목 전통이 있습니다.","앵거스·헤리퍼드는 부드럽고 마블링이 좋고, 브라질의 네로레 같은 브라만 계통은 지방이 적고 칼파스타틴이 많아 덜 연한 경향이 있습니다.","우둔·설도·앞다리는 얇게 썰어 불고기·샤브샤브·가공용으로 쓰고, 90CL 같은 분쇄용 살코기는 시세 지표입니다. 한국의 허용 범위는 반드시 최신 공지로 확인하세요."],"sources":"USDA FAS 산지별 소고기 보고서(최신본 확인), 호주·뉴질랜드 축산 기관 자료, 한국 농림축산식품부 수입위생 공지(허용 국가·작업장 확인), Lawrie's Meat Science(품종·칼파스타틴·숙성 장), Principles of Meat Science"},{"n":21,"title":"냉동·해동 과학 심화: 얼음결정, 동결화상, 해동 방법, 그리고 진공포장 고기의 색","diagram":null,"intro":"냉동창고를 3곳 운영한다면 냉동 지식은 곧 품질과 비용입니다. 앞서 냉장과 냉동의 기본을 배웠고 오늘은 한 단계 더 들어갑니다. 얼음결정이 왜 고기를 망치는지, 창고에서 품질이 서서히 떨어지는 원인은 무엇인지, 해동은 어떻게 해야 드립이 적은지, 그리고 손님이 가장 많이 묻는 '진공포장 고기가 왜 어두운 색이냐'까지 이유와 함께 정리합니다.","sections":[{"h":"얼음결정은 얼마나 빨리 얼리느냐로 결정된다","p":["고기 속 수분은 대략 영하 1도에서 영하 5도 사이에서 가장 많이 얼음으로 바뀝니다. 이 구간을 천천히 지나면 얼음이 한곳에 모여 큰 결정으로 자라고, 큰 결정은 근섬유와 세포막을 찢습니다. 반대로 이 구간을 빠르게 지나면 작은 결정이 세포 안팎에 고르게 생겨 조직 손상이 적습니다. 급속 냉동이 품질이 좋은 이유입니다.","조직이 많이 찢어진 고기는 해동할 때 수분을 붙잡는 힘(보수력)이 약해져 육즙이 흘러나옵니다. 이것이 드립입니다. 그래서 급속 냉동한 고기는 해동 후에도 촉촉하고, 천천히 언 고기는 퍽퍽하고 물이 많이 고입니다. 입고 때 냉동 방식을 업체에 물어보고, 우리 창고에 들어올 때 온도가 충분히 낮은지 확인하는 것이 중요합니다."]},{"h":"창고에서 품질이 떨어지는 이유: 동결화상, 산화, 온도 변동","p":["동결화상은 냉동 중 표면의 얼음이 수증기로 바로 날아가는 승화 때문에 생깁니다. 표면이 하얗고 거칠게 마르고 맛이 나빠집니다. 포장이 헐겁거나 공기가 많이 남아 있을수록 심해지므로 진공포장이나 밀착 포장이 가장 확실한 예방법입니다.","냉동 중에도 지방은 서서히 산화됩니다. 산화가 진행되면 쿰쿰한 냄새와 누런 색이 생깁니다. 돼지 지방은 소 지방보다 산화에 약한 경향이 있어서 돼지고기는 같은 온도에서도 냉동 보관 기간을 상대적으로 짧게 관리하는 것이 안전합니다. 구체적인 보관 기간은 제품 규격과 소비기한 표시를 기준으로 하세요.","창고 문을 자주 열거나 적재가 많아 온도가 오르내리면 작은 얼음결정이 합쳐져 큰 결정이 되는 재결정이 일어나 급속 냉동의 효과가 사라집니다. 문 개방 시간을 줄이고, 제품과 벽 사이에 공기가 흐를 틈을 두고, 입고 직후 온도가 크게 오르지 않도록 한 번에 많은 양을 넣지 않는 것이 좋습니다."]},{"h":"해동은 어떻게 하는 것이 드립이 가장 적은가","p":["냉장 해동은 0~5도 안팎의 냉장고에서 하루 정도 천천히 하는 방법입니다. 표면과 속이 비슷하게 녹아 드립이 가장 적고 위생도 안전합니다. 시간이 부족할 때는 밀봉한 채로 찬물에 담그고 물을 갈아 주는 방법을 쓰며, 이때도 상온 물이나 뜨거운 물은 표면 온도를 위험 구간으로 올리므로 피하세요. 전자레인지 해동은 표면이 익기 쉬워 당장 조리할 때만 씁니다.","해동한 고기를 다시 얼리면 조직 손상과 세균 증식 위험이 커지므로 피합니다. 해동하면서 나온 드립은 맛과 수율을 떨어뜨리는 손실이므로, 냉동 원료의 수율은 해동 후 무게를 기준으로 실측해야 정확합니다."]},{"h":"진공포장 고기는 왜 어두운 보라색일까","p":["고기 색은 미오글로빈이라는 색소가 산소와 만나는 정도에 따라 달라집니다. 산소가 닿지 않는 진공포장 안에서는 어두운 붉은 보라색(탈산소 미오글로빈)이고, 포장을 열어 산소에 노출되면 몇 분 안에 밝은 선홍색으로 변하는데 이를 블룸이라고 합니다. 시간이 오래 지나면 갈색(메트미오글로빈)으로 바뀌는데 이것이 변질의 신호는 아니지만 신선도가 떨어져 보이는 원인이 됩니다.","그래서 진공포장 고기를 어둡다고 걱정하는 손님에게는 '산소가 없는 상태의 정상적인 색이고 포장을 열고 잠시 두면 선홍색으로 돌아온다'고 설명하면 됩니다. 다만 냄새가 이상하거나 끈적임, 포장 팽창이 있으면 변질을 의심해야 합니다."]}],"script":"진공포장 고기가 어두운 보라색인 것은 산소가 없는 상태에서 나타나는 정상적인 색이고, 포장을 열고 잠깐 두면 선홍색으로 돌아옵니다. 냉동육은 냉장고에서 하루 천천히 해동하면 육즙이 가장 잘 유지됩니다. 저희는 급속 냉동과 진공포장으로 동결화상과 드립을 줄이고 있습니다.","summary":["얼음결정은 영하 1~5도 구간을 얼마나 빨리 지나느냐로 크기가 정해지고, 급속 냉동은 작은 결정이라 조직 손상과 드립이 적습니다.","창고에서는 동결화상, 지방 산화(돼지가 더 약함), 온도 변동으로 인한 재결정이 품질을 떨어뜨리므로 밀착 포장, 문 개방 최소화, 적재 간격 유지가 중요합니다.","해동은 냉장고에서 천천히 하고 재냉동은 피하며, 진공포장 고기의 어두운 보라색은 산소가 없을 때의 정상 색이라고 설명하면 됩니다."],"sources":"Lawrie's Meat Science 냉동과 육색 장, Principles of Meat Science, 식품의약품안전처 식품공전(보관 온도 최신본 확인), 축산물 소비기한 설정 관련 공고(최신본 확인)"},{"n":22,"title":"세계 브랜드 읽기: 와규, 앵거스, 이베리코는 이름이 아니라 품종·사육·등급이다","diagram":"beef","intro":"와규, 앵거스, 이베리코는 손님이 가장 자주 입에 올리는 브랜드입니다. 그런데 이름만 같고 실제 내용은 크게 다른 제품이 많아서 정확히 설명하지 못하면 오해와 클레임이 생깁니다. 오늘은 세 브랜드를 품종, 사육 방식, 사료, 등급과 인증이라는 네 가지로 풀어서 이해하고, 손님에게 권할 때 무엇을 확인하고 무엇을 과장하지 말아야 하는지 정리합니다.","sections":[{"h":"와규: 일본 소 품종과 A5·BMS 읽는 법","p":["와규(和牛)는 일본에서 개량한 소 품종을 가리키며 일본 흑모화종, 갈모화종, 일본단각종, 무각화종 네 가지로 나뉩니다. 이 중 흑모화종이 대부분을 차지하고 마블링이 매우 잘 생기는 것으로 유명합니다. 일본의 등급은 육량등급 A, B, C와 육질등급 1~5를 합쳐 'A5'처럼 표기합니다. A는 정육 비율이 높은 것, 5는 육질이 가장 좋은 것이라는 뜻입니다. 육질에는 마블링 정도를 12단계로 나타내는 BMS(Beef Marbling Standard) 번호도 함께 쓰입니다.","와규 지방은 올레산 같은 불포화지방산 비율이 높아 녹는 온도가 낮고 입안에서 부드럽게 녹는다고 알려져 있습니다. 그래서 얇게 썰어 살짝 굽는 스키야키나 샤브샤브, 소량으로 먹는 스테이크가 어울립니다. 지방이 많아 많이 먹기는 어려워 1인당 제공량을 적게 잡는 것이 좋습니다.","주의할 점은 '와규'라는 이름이 호주나 미국에서 와규 혈통을 교배한 소에도 붙는다는 것입니다. 일본산 와규와 호주산 와규 교잡종은 사육 환경, 사료, 마블링 수준이 다르므로 원산지와 혈통(순종인지 교잡인지)을 함께 확인하고 표기해야 합니다."]},{"h":"앵거스: 품종과 브랜드 인증은 다르다","p":["앵거스는 스코틀랜드에서 기원한 검은 털의 품종으로 마블링이 잘 생기고 육질이 고르며 성장이 빠른 편이라 미국, 호주, 남미 등에서 널리 키웁니다. 앞서 배운 미국산과 호주산 소고기의 상당수가 앵거스 계통 교잡종입니다.","그런데 '앵거스 소'와 '인증 앵거스 브랜드'는 다릅니다. 인증 프로그램(대표적으로 미국의 Certified Angus Beef)은 앵거스 혈통을 일정 비율 이상 가진 소 가운데 마블링, 월령, 도체 규격 같은 기준을 통과한 것만 브랜드를 붙입니다. 단순히 소가 검은색이라고 앵거스 브랜드라고 할 수 없다는 점이 핵심입니다. 인증 기준은 프로그램마다, 시기마다 다르니 최신 기준은 업체 서류로 확인하세요."]},{"h":"이베리코: 도토리와 지방이 만드는 풍미","p":["이베리코는 스페인과 포르투갈이 있는 이베리아 반도의 토착 돼지 품종입니다. 일반 흰 돼지보다 근내지방이 많고 지방에 올레산이 풍부해 고기가 촉촉하고 고소하다고 알려져 있습니다. 가장 고급으로 꼽히는 베요타 등급은 참나무 숲에서 도토리를 먹여 키운 이베리코로, 도토리의 지방산이 지방 풍미에 영향을 준다고 설명됩니다.","스페인에서는 이베리코 혈통 비율과 사육 방식(도토리 방목, 곡물 사료 방목, 곡물 사료 사육)에 따라 등급과 색 라벨이 나뉩니다. 이름은 같은 '이베리코'여도 도토리를 먹은 순종과 곡물로 키운 교잡종은 가격과 품질이 크게 다릅니다. 라벨 색상 체계와 구체 기준은 규정이 바뀔 수 있으니 최신 기준을 확인하세요.","이베리코 특수부위(프레사, 세크레토, 플루마 등)는 우리가 배운 가브리살, 항정살처럼 근육 사이 지방이 풍부한 부위로, 구이용으로 인기가 높습니다. 정확한 부위 위치와 한국 명칭은 업체 도해로 확인하세요."]},{"h":"브랜드를 볼 때 던질 세 가지 질문과 손님에게 권하는 법","p":["첫째, 품종과 혈통이 무엇인가(순종인가 교잡인가). 둘째, 어떻게 키웠는가(사육 환경, 사료, 기간). 셋째, 어떤 기준으로 등급이나 인증을 받았는가(공식 기준인가, 업체 자체 기준인가). 이 세 가지를 확인하면 이름에 휘둘리지 않고 손님에게 정확히 설명할 수 있습니다.","한우와도 비교할 수 있습니다. 한우는 한국 고유 품종이고 근내지방도 번호로 등급을 정합니다. 와규, 앵거스, 이베리코와 직접 점수를 비교하지 말고 '각각 다른 기준으로 평가한다'고 말하세요. 프리미엄 브랜드는 소량, 얇게, 짧게 굽는 방식으로 권하고, 일상 구이는 가격 대비 만족도가 좋은 산지와 부위를 권하는 식으로 용도를 나누는 것이 좋습니다. 원산지와 종류 표기는 언제나 정확히 하세요."]}],"script":"와규와 앵거스, 이베리코는 이름이 아니라 품종, 사육 방식, 등급 기준으로 구분합니다. 와규는 일본에서 개량한 소로 A5처럼 육량과 육질을 함께 표시하고, 앵거스는 인증 기준을 통과한 것만 브랜드가 붙습니다. 이베리코는 도토리를 먹였는지 곡물로 키웠는지에 따라 품질이 달라집니다. 그래서 저희는 항상 원산지와 혈통, 인증 서류를 확인해서 안내해 드립니다.","summary":["와규는 일본의 소 품종이며 A5는 육량 A와 육질 5를 뜻하고, 호주·미국 와규 교잡종과는 원산지와 혈통이 달라 따로 표기해야 합니다.","앵거스 품종과 인증 앵거스 브랜드는 다르고, 인증은 혈통과 마블링·월령 같은 기준을 통과해야 붙습니다.","이베리코는 이베리아 토착 돼지이며 도토리 방목 순종인지 곡물 교잡종인지에 따라 품질이 크게 다릅니다. 브랜드는 품종, 사육, 등급 기준 세 가지로 확인하고 한우와 점수를 직접 비교하지 마세요."],"sources":"일본 식육격부거래협회 등급 기준(최신본 확인), USDA·Certified Angus Beef 인증 기준(최신본 확인), 스페인 이베리코 품질규정(최신본 확인), 축산물품질평가원 한우 등급 기준(비교용), Lawrie's Meat Science(지방산 조성과 풍미)"}];

var UPDATED="2026-11-12 16:58 (한국시간)";
var BASE="https://github.com/todrkr8815-maker/basic/blob/claude/blissful-fermi-baue0g/ozn/daily/";
var DOW=["일","월","화","수","목","금","토"];
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function dowOf(d){return DOW[new Date(Date.parse(d+"T00:00:00Z")).getUTCDay()]}
function cardFor(day){for(var i=0;i<CARDS.length;i++){if(CARDS[i].n===day)return CARDS[i]}return null}
$("upd").textContent=UPDATED;

var sel=$("bsel");
BR.slice().reverse().forEach(function(b,i){var o=el("option",null,b.date.replace(/-/g,".")+" ("+dowOf(b.date)+") · Day "+b.day);o.value=b.date;sel.appendChild(o)});

function renderBrief(b){
  var v=$("v1");v.innerHTML="";
  $("hd").textContent=b.date.replace(/-/g,".")+" ("+dowOf(b.date)+") 브리핑";
  var c=cardFor(b.day);
  $("dt").textContent="학습 Day "+b.day+(c?" · "+c.title:"");
  var s1=el("section");var h=el("h2","","이런 아이디어 어떠세요?");s1.appendChild(h);
  (b.ideas||[]).forEach(function(x){var d=el("div","idea");d.appendChild(el("span","itag",x.tag));d.appendChild(el("span","ititle",x.title));d.appendChild(el("span",null,x.body));s1.appendChild(d)});
  v.appendChild(s1);
  var s2=el("section");s2.appendChild(el("h2","","세계 소·돼지고기 시장 흐름"));
  var mk=el("div","mk");
  var m1=el("div");m1.appendChild(el("b",null,"소고기"));m1.appendChild(el("span",null,(b.market||{}).beef||""));
  var m2=el("div");m2.appendChild(el("b",null,"돼지고기"));m2.appendChild(el("span",null,(b.market||{}).pork||""));
  mk.appendChild(m1);mk.appendChild(m2);s2.appendChild(mk);v.appendChild(s2);
  var s3=el("section");s3.appendChild(el("h2","","뉴스 요약"));
  (b.news||[]).forEach(function(n,i){
    var d=el("details");if(i===0)d.open=true;
    d.appendChild(el("summary",null,n.title));
    d.appendChild(el("div","meta",n.source+" · "+n.date));
    d.appendChild(el("p",null,n.summary));
    if(n.impact){var im=el("p","impact","오즈네이쳐에 의미: "+n.impact);d.appendChild(im)}
    s3.appendChild(d);
  });
  if(b.newsNote)s3.appendChild(el("div","src",b.newsNote));
  v.appendChild(s3);
  var s4=el("section");
  var a=el("a","link","이날의 A4 브리핑 PDF 열기");a.href=BASE+b.date+".pdf";a.target="_blank";a.rel="noopener";
  s4.appendChild(a);
  s4.appendChild(el("div","src","PDF는 공유 또는 인쇄 메뉴로 출력할 수 있습니다. 지난 브리핑 목차는 같은 폴더의 README에 있습니다."));
  v.appendChild(s4);
  renderCard(b.day);
}

function diagram(kind){
  var wrap=el("div","dia");
  var holder=document.createElement("div");holder.innerHTML=SVG[kind];wrap.appendChild(holder);
  var lg=el("div","legend");
  [["g","구이"],["m","불고기·튀김·다목적"],["s","탕·찜·수육·가공"]].forEach(function(x){var i=el("span",null,null);i.appendChild(el("i","sw z-"+x[0]));i.appendChild(document.createTextNode(x[1]));lg.appendChild(i)});
  wrap.appendChild(lg);
  wrap.appendChild(el("div","src","부위 위치를 보여 주는 도식입니다. 점선은 몸 안쪽의 부위(안심)입니다. 실제 모양과 비율은 다릅니다."));
  return wrap;
}
function box(card,lab,txt,cls){var d=el("div","box"+(cls?" "+cls:""));d.appendChild(el("b",null,lab));if(Array.isArray(txt)){var u=el("ul");txt.forEach(function(x){u.appendChild(el("li",null,x))});d.appendChild(u)}else d.appendChild(el("span",null,txt));card.appendChild(d)}
function renderCard(day){
  var v=$("v2");v.innerHTML="";
  var c=cardFor(day);if(!c){v.appendChild(el("p","src","이 날짜의 카드가 없습니다."));return}
  var card=el("section");
  var h=el("h2",null,"학습 카드");
  var cs=document.createElement("select");cs.id="csel";cs.setAttribute("aria-label","카드 선택");
  CARDS.slice().reverse().forEach(function(x){var o=el("option",null,"Day "+x.n);o.value=x.n;if(x.n===day)o.selected=true;cs.appendChild(o)});
  cs.addEventListener("change",function(){renderCard(+cs.value)});
  h.appendChild(cs);card.appendChild(h);
  card.appendChild(el("div","ctitle",c.title));
  card.appendChild(el("p","intro",c.intro));
  if(c.diagram&&SVG[c.diagram])card.appendChild(diagram(c.diagram));
  c.sections.forEach(function(sec){card.appendChild(el("h3",null,sec.h));sec.p.forEach(function(t){card.appendChild(el("p","body",t))})});
  box(card,"손님에게 이렇게 설명하세요",c.script);
  box(card,"간단 요약",c.summary||[],"sum");
  if(c.sources)card.appendChild(el("div","src","확인처: "+c.sources));
  v.appendChild(card);
}
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2)}
$("t1").addEventListener("click",function(){tab(1)});
$("t2").addEventListener("click",function(){tab(2)});
sel.addEventListener("change",function(){for(var i=0;i<BR.length;i++){if(BR[i].date===sel.value){renderBrief(BR[i]);break}}});
if(BR.length){renderBrief(BR[BR.length-1])}else{$("hd").textContent="브리핑 준비 중"}
</script>
